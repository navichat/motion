<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM System Test - Real Avatar Loading</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        #container {
            width: 800px;
            height: 600px;
            background: white;
            margin: 20px auto;
            border: 2px solid #ccc;
            border-radius: 10px;
            position: relative;
        }
        
        #controls {
            padding: 20px;
            background: #333;
            color: white;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        #log {
            background: black;
            color: lime;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: scroll;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        #status {
            background: #ffffcc;
            padding: 15px;
            border-left: 4px solid #ff9900;
            margin: 10px 0;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        
        .status-item {
            padding: 10px;
            border-radius: 5px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        
        .status-item.success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        
        .status-item.error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .performance-monitor {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="performance-monitor" id="performance-monitor">
        FPS: <span id="fps-counter">0</span><br>
        Render: <span id="render-status">Stopped</span><br>
        Avatar: <span id="avatar-status">Not Loaded</span>
    </div>

    <div id="controls">
        <h2>🎭 Real VRM Avatar System Test</h2>
        <p>Testing the fixed VRM loading system with real anime avatars (no geometric fallbacks)</p>
        
        <div>
            <button onclick="testVRMComponents()">Test VRM Components</button>
            <button onclick="loadRealVRM()">Load Real VRM Avatar</button>
            <button onclick="testBVHSystem()">Test BVH Animation System</button>
            <button onclick="startVRMAnimation()">Start VRM Animation</button>
            <button onclick="clearLogs()">Clear Logs</button>
        </div>
    </div>
    
    <div id="status">
        <strong>System Status:</strong> <span id="status-text">Ready for VRM testing</span>
        
        <div class="status-grid">
            <div class="status-item" id="vrm-loader-status">
                <strong>VRMLoader:</strong> <span>Not Checked</span>
            </div>
            <div class="status-item" id="avatar-binder-status">
                <strong>AvatarBinder:</strong> <span>Not Checked</span>
            </div>
            <div class="status-item" id="bvh-timeline-status">
                <strong>BVHTimeline:</strong> <span>Not Checked</span>
            </div>
            <div class="status-item" id="three-js-status">
                <strong>Three.js:</strong> <span>Not Checked</span>
            </div>
        </div>
    </div>
    
    <div id="log"></div>
    
    <div id="container"></div>

    <!-- Import maps for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
        }
    }
    </script>
    
    <!-- Load VRM Infrastructure -->
    <script src="./src/components/animation/vrm/VRMLoader.js"></script>
    <script src="./src/components/animation/vrm/AvatarBinder.js"></script>
    <script src="./src/components/animation/vrm/BVHTimelineVRMIntegration.js"></script>
    <script src="./src/components/animation/timeline/BVHTimeline.js"></script>
    <script src="./src/scene/ClassroomAvatarIntegration.js"></script>

    <script type="module">
        // Import Three.js modules
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Make modules available globally
        window.THREE = THREE;
        window.THREELoaders = { GLTFLoader, VRMLoaderPlugin };
        if (!window.THREE.GLTFLoader) window.THREE.GLTFLoader = GLTFLoader;
        if (!window.THREE.VRMLoaderPlugin) window.THREE.VRMLoaderPlugin = VRMLoaderPlugin;
        if (!window.THREE.OrbitControls) window.THREE.OrbitControls = OrbitControls;
        
        // Global state
        let classroomIntegration = null;
        let animationRunning = false;
        let performanceStats = { fps: 0, frameCount: 0, lastTime: performance.now() };
        
        // Logging function
        window.log = function(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('log');
            const logEntry = document.createElement('div');
            
            const typePrefix = {
                info: '🔍',
                success: '✅',
                error: '❌',
                warning: '⚠️'
            };
            
            logEntry.innerHTML = `[${timestamp}] ${typePrefix[type] || '📝'} ${message}`;
            logElement.appendChild(logEntry);
            logElement.scrollTop = logElement.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        };
        
        // Test VRM components availability
        window.testVRMComponents = function() {
            log('Testing VRM component availability...', 'info');
            
            const tests = [
                {
                    name: 'VRMLoader',
                    test: () => typeof window.VRMLoaderLite !== 'undefined',
                    element: 'vrm-loader-status'
                },
                {
                    name: 'AvatarBinder',
                    test: () => typeof window.AvatarBinder !== 'undefined',
                    element: 'avatar-binder-status'
                },
                {
                    name: 'BVHTimeline',
                    test: () => typeof window.BVHTimeline !== 'undefined',
                    element: 'bvh-timeline-status'
                },
                {
                    name: 'Three.js',
                    test: () => typeof window.THREE !== 'undefined' && typeof window.THREE.GLTFLoader !== 'undefined',
                    element: 'three-js-status'
                }
            ];
            
            tests.forEach(({ name, test, element }) => {
                const available = test();
                const statusElement = document.getElementById(element);
                const span = statusElement.querySelector('span');
                
                span.textContent = available ? 'Available ✅' : 'Not Available ❌';
                statusElement.className = `status-item ${available ? 'success' : 'error'}`;
                
                log(`${name}: ${available ? 'Available' : 'Not Available'}`, available ? 'success' : 'error');
            });
            
            log('VRM component test complete', 'info');
        };
        
        // Load real VRM avatar
        window.loadRealVRM = async function() {
            try {
                log('Loading real VRM avatar (no geometric fallbacks)...', 'info');
                document.getElementById('status-text').textContent = 'Loading VRM avatar...';
                
                // Initialize ClassroomAvatarIntegration
                const container = document.getElementById('container');
                classroomIntegration = new ClassroomAvatarIntegration(container);
                
                log('Initializing 3D scene...', 'info');
                await classroomIntegration.initializeScene();
                
                const status = classroomIntegration.getStatus();
                log(`VRM System Status: ${JSON.stringify(status, null, 2)}`, 'info');
                
                if (status.hasAvatar) {
                    log('✅ Real VRM avatar loaded successfully!', 'success');
                    document.getElementById('avatar-status').textContent = 'VRM Loaded';
                    document.getElementById('status-text').textContent = 'VRM avatar loaded and ready';
                } else {
                    log('❌ VRM avatar loading failed', 'error');
                    document.getElementById('status-text').textContent = 'VRM loading failed';
                }
                
            } catch (error) {
                log(`❌ VRM loading error: ${error.message}`, 'error');
                document.getElementById('status-text').textContent = `VRM loading failed: ${error.message}`;
            }
        };
        
        // Test BVH animation system
        window.testBVHSystem = function() {
            log('Testing BVH animation system...', 'info');
            
            if (!classroomIntegration) {
                log('❌ ClassroomAvatarIntegration not initialized. Load VRM first.', 'error');
                return;
            }
            
            const hasAnimation = classroomIntegration.animationsReady;
            const hasBinder = !!classroomIntegration.binder;
            const hasTimeline = !!classroomIntegration.bvhTimeline;
            
            log(`Animation system ready: ${hasAnimation}`, hasAnimation ? 'success' : 'error');
            log(`Avatar binder available: ${hasBinder}`, hasBinder ? 'success' : 'error');
            log(`BVH timeline available: ${hasTimeline}`, hasTimeline ? 'success' : 'error');
            
            if (hasBinder && classroomIntegration.binder.getStats) {
                const stats = classroomIntegration.binder.getStats();
                log(`Binder stats: ${JSON.stringify(stats)}`, 'info');
            }
        };
        
        // Start VRM animation
        window.startVRMAnimation = function() {
            if (!classroomIntegration || !classroomIntegration.vrm) {
                log('❌ VRM not loaded. Load VRM first.', 'error');
                return;
            }
            
            if (animationRunning) {
                log('Animation already running', 'warning');
                return;
            }
            
            log('Starting VRM animation...', 'info');
            animationRunning = true;
            document.getElementById('render-status').textContent = 'Running';
            
            // Performance monitoring
            const updatePerformance = () => {
                performanceStats.frameCount++;
                const now = performance.now();
                
                if (now >= performanceStats.lastTime + 1000) {
                    performanceStats.fps = Math.round((performanceStats.frameCount * 1000) / (now - performanceStats.lastTime));
                    performanceStats.frameCount = 0;
                    performanceStats.lastTime = now;
                    
                    document.getElementById('fps-counter').textContent = performanceStats.fps;
                }
                
                if (animationRunning) {
                    requestAnimationFrame(updatePerformance);
                }
            };
            
            updatePerformance();
            log('✅ VRM animation started with performance monitoring', 'success');
        };
        
        // Clear logs
        window.clearLogs = function() {
            document.getElementById('log').innerHTML = '';
            log('Logs cleared', 'info');
        };
        
        // Test VRM asset availability
        async function testVRMAssets() {
            const assets = [
                './assets/avatars/ichika.vrm',
                './assets/avatars/buny.vrm',
                './assets/avatars/kaede.vrm'
            ];
            
            log('Testing VRM asset availability...', 'info');
            
            for (const asset of assets) {
                try {
                    const response = await fetch(asset, { method: 'HEAD' });
                    const size = response.headers.get('content-length');
                    const sizeMB = size ? (size / 1024 / 1024).toFixed(1) + 'MB' : 'Unknown size';
                    
                    log(`${asset}: ${response.ok ? '✅ Available' : '❌ Not Found'} (${sizeMB})`, 
                        response.ok ? 'success' : 'error');
                } catch (error) {
                    log(`${asset}: ❌ Error - ${error.message}`, 'error');
                }
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            log('VRM System Test initialized', 'success');
            log('Click "Test VRM Components" to check component availability', 'info');
            testVRMAssets();
        });
        
    </script>
</body>
</html>
