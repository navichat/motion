<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Conversation Worker Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .test-section {
            margin: 25px 0;
            padding: 20px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-left: 5px solid #007bff;
        }
        
        .test-section h3 {
            color: #495057;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status {
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px 0;
        }
        
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        
        #output {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        
        .voice-selector {
            margin: 15px 0;
        }
        
        select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid #dee2e6;
            background: white;
            font-size: 14px;
            margin-left: 10px;
        }
        
        input[type="text"] {
            padding: 10px 15px;
            border-radius: 20px;
            border: 2px solid #dee2e6;
            width: 300px;
            margin-right: 10px;
            font-size: 14px;
        }
        
        .audio-controls {
            margin: 15px 0;
            padding: 15px;
            background: #e7f3ff;
            border-radius: 10px;
            border: 1px solid #b3d7ff;
        }
        
        .emoji { font-size: 1.2em; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Enhanced Conversation Worker Test Suite</h1>
        
        <div class="test-section">
            <h3><span class="emoji">⚡</span>Worker Initialization</h3>
            <div id="worker-status" class="status info">Not initialized</div>
            <button id="init-btn" onclick="initializeWorker()">Initialize Worker</button>
            <button id="test-models-btn" onclick="testModels()" disabled>Test Models</button>
        </div>
        
        <div class="test-section">
            <h3><span class="emoji">🎵</span>Text-to-Speech Testing</h3>
            <div class="voice-selector">
                Voice: 
                <select id="voice-select">
                    <option value="af_heart">Heart (Female)</option>
                    <option value="am_adam">Adam (Male)</option>
                    <option value="af_sarah">Sarah (Female)</option>
                    <option value="af_bella">Bella (Female)</option>
                    <option value="af_jessica">Jessica (Female)</option>
                </select>
                <button onclick="changeVoice()">Change Voice</button>
            </div>
            
            <div>
                <input type="text" id="tts-text" value="Hello! This is a test of the enhanced TTS system." placeholder="Enter text to speak...">
                <button onclick="testTTS()" id="tts-btn" disabled>Generate Speech</button>
            </div>
            
            <div class="audio-controls">
                <audio id="audio-player" controls style="width: 100%; display: none;"></audio>
                <div id="audio-info"></div>
            </div>
        </div>
        
        <div class="test-section">
            <h3><span class="emoji">🔤</span>Phonemization Testing</h3>
            <button onclick="testPhonemizer()" id="phoneme-btn" disabled>Test Phonemizer</button>
        </div>
        
        <div class="test-section">
            <h3><span class="emoji">📊</span>System Output</h3>
            <button onclick="clearOutput()">Clear Output</button>
            <div id="output">Ready to test conversation worker...\n</div>
        </div>
    </div>

    <script>
        let worker = null;
        let isInitialized = false;
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const output = document.getElementById('output');
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            output.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            output.scrollTop = output.scrollHeight;
        }
        
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('worker-status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }
        
        function initializeWorker() {
            try {
                log('Creating new conversation worker...');
                worker = new Worker('./js/conversationWorkerWorking.js');
                
                worker.onmessage = function(e) {
                    const { type, message, result, error } = e.data;
                    
                    switch (type) {
                        case 'info':
                            log(message, 'info');
                            break;
                        case 'error':
                            log(message, 'error');
                            updateStatus('Error occurred', 'error');
                            break;
                        case 'status':
                            log(message, 'success');
                            updateStatus('Ready', 'success');
                            isInitialized = true;
                            enableButtons();
                            break;
                        case 'output':
                            if (result && result.audio) {
                                handleAudioOutput(result);
                            } else {
                                log(`Result: ${JSON.stringify(result)}`, 'success');
                            }
                            break;
                        case 'debug_log':
                            log(`[DEBUG] ${message}`, 'info');
                            break;
                        default:
                            log(`Worker message: ${JSON.stringify(e.data)}`, 'info');
                            break;
                    }
                };
                
                worker.onerror = function(error) {
                    log(`Worker error: ${error.message}`, 'error');
                    updateStatus('Worker error', 'error');
                };
                
                updateStatus('Initializing...', 'warning');
                worker.postMessage({ type: 'init' });
                
            } catch (error) {
                log(`Failed to create worker: ${error.message}`, 'error');
                updateStatus('Failed to initialize', 'error');
            }
        }
        
        function enableButtons() {
            document.getElementById('test-models-btn').disabled = false;
            document.getElementById('tts-btn').disabled = false;
            document.getElementById('phoneme-btn').disabled = false;
        }
        
        function testModels() {
            if (worker) {
                log('Testing model status...');
                worker.postMessage({ type: 'test_models' });
            }
        }
        
        function changeVoice() {
            if (worker) {
                const voice = document.getElementById('voice-select').value;
                log(`Changing voice to: ${voice}`);
                worker.postMessage({ type: 'set_voice', data: { voice } });
            }
        }
        
        function testTTS() {
            if (worker) {
                const text = document.getElementById('tts-text').value;
                log(`Testing TTS with text: "${text}"`);
                worker.postMessage({ type: 'test_tts', data: { text } });
            }
        }
        
        function testPhonemizer() {
            if (worker) {
                log('Testing phonemizer...');
                worker.postMessage({ type: 'test_phonemizer' });
            }
        }
        
        function handleAudioOutput(result) {
            try {
                log(`Audio generated: ${result.audio.length} samples at ${result.sampleRate}Hz`, 'success');
                
                // Convert Float32Array to AudioBuffer for playback
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = audioContext.createBuffer(1, result.audio.length, result.sampleRate);
                const channelData = audioBuffer.getChannelData(0);
                channelData.set(result.audio);
                
                // Create audio source and play
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                
                // Also create downloadable audio
                const audioEl = document.getElementById('audio-player');
                const audioInfo = document.getElementById('audio-info');
                
                // Convert to WAV blob for download/playback
                const wavBlob = audioBufferToWav(audioBuffer);
                const audioUrl = URL.createObjectURL(wavBlob);
                
                audioEl.src = audioUrl;
                audioEl.style.display = 'block';
                
                audioInfo.innerHTML = `
                    <strong>Audio Info:</strong><br>
                    Duration: ${(result.audio.length / result.sampleRate).toFixed(2)}s<br>
                    Sample Rate: ${result.sampleRate}Hz<br>
                    Samples: ${result.audio.length}<br>
                    Format: ${result.format}<br>
                    <a href="${audioUrl}" download="tts-output.wav">📥 Download WAV</a>
                `;
                
                // Auto-play the generated audio
                source.start();
                log('Audio playback started', 'success');
                
            } catch (error) {
                log(`Audio handling error: ${error.message}`, 'error');
            }
        }
        
        function audioBufferToWav(buffer) {
            const length = buffer.length;
            const arrayBuffer = new ArrayBuffer(44 + length * 2);
            const view = new DataView(arrayBuffer);
            
            // WAV header
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, buffer.sampleRate, true);
            view.setUint32(28, buffer.sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length * 2, true);
            
            // Convert float samples to 16-bit PCM
            const channelData = buffer.getChannelData(0);
            let offset = 44;
            for (let i = 0; i < length; i++) {
                const sample = Math.max(-1, Math.min(1, channelData[i]));
                view.setInt16(offset, sample * 0x7FFF, true);
                offset += 2;
            }
            
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }
        
        function clearOutput() {
            document.getElementById('output').textContent = 'Output cleared.\n';
        }
        
        // Auto-initialize on page load
        window.addEventListener('load', () => {
            log('Page loaded, ready to initialize worker');
        });
    </script>
</body>
</html>
