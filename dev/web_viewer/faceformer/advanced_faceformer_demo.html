<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced FaceFormer Web - Multi-Backend Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #ffffff;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .backend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .backend-card {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #444;
        }
        .backend-card.active {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        .backend-card.unavailable {
            opacity: 0.5;
            border-color: #666;
        }
        .backend-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }
        .status-indicator.available {
            background: #4CAF50;
        }
        .status-indicator.active {
            background: #2196F3;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .backend-info {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 15px;
        }
        .backend-features {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .backend-features li {
            padding: 5px 0;
            border-bottom: 1px solid #444;
        }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .control-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, button, input {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #444;
            color: white;
            font-size: 14px;
        }
        button {
            background: #4CAF50;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .log {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #444;
        }
        .performance-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            font-size: 12px;
            color: #ccc;
            margin-top: 5px;
        }
        .model-size-warning {
            background: #ff9800;
            color: black;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .demo-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎭 Advanced FaceFormer Web</h1>
        <p>High-Performance Facial Animation with WebGPU, WebNN, ONNX Runtime Web & WASM</p>
    </div>

    <div class="backend-grid" id="backendGrid">
        <!-- Backend cards will be populated by JavaScript -->
    </div>

    <div class="controls">
        <h3>🎮 Model Configuration</h3>
        <div class="control-row">
            <label>Dataset:</label>
            <select id="datasetSelect">
                <option value="vocaset">VOCASET (64-dim, 62MB)</option>
                <option value="biwi">BIWI (128-dim, 549MB)</option>
            </select>
            
            <label>Backend:</label>
            <select id="backendSelect">
                <option value="auto">Auto (Best Available)</option>
                <option value="webgpu">WebGPU</option>
                <option value="webnn">WebNN</option>
                <option value="onnxruntime-web">ONNX Runtime Web</option>
                <option value="wasm">WASM</option>
            </select>
            
            <button id="initializeBtn">Initialize Model</button>
        </div>
        
        <div class="control-row">
            <label>Subject ID:</label>
            <input type="number" id="subjectId" value="0" min="0" max="7">
            
            <label>Sequence Length:</label>
            <input type="number" id="sequenceLength" value="10" min="1" max="100">
            
            <button id="generateBtn" disabled>Generate Animation</button>
            <button id="benchmarkBtn" disabled>Run Benchmark</button>
        </div>
    </div>

    <div class="status">
        <h3>📊 System Status</h3>
        <div id="systemInfo">
            <p>System not initialized</p>
        </div>
        
        <div class="performance-stats" id="performanceStats" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="inferenceTime">--</div>
                <div class="stat-label">Inference Time (ms)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="throughput">--</div>
                <div class="stat-label">Frames/Second</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="memoryUsage">--</div>
                <div class="stat-label">Memory Usage</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="modelSize">--</div>
                <div class="stat-label">Model Size</div>
            </div>
        </div>
    </div>

    <div class="demo-section">
        <h3>📝 Console Log</h3>
        <div class="log" id="consoleLog"></div>
    </div>

    <div class="demo-section" id="resultsSection" style="display: none;">
        <h3>🎯 Generation Results</h3>
        <div id="generationResults"></div>
    </div>

    <!-- Include ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
    
    <!-- Include our advanced implementation -->
    <script src="./advanced_faceformer_web.js"></script>
    
    <script>
        class FaceFormerDemo {
            constructor() {
                this.faceformer = new AdvancedFaceFormerWeb();
                this.logElement = document.getElementById('consoleLog');
                this.setupUI();
                this.setupLogging();
                this.detectBackends();
            }

            setupUI() {
                document.getElementById('initializeBtn').addEventListener('click', () => this.initialize());
                document.getElementById('generateBtn').addEventListener('click', () => this.generateAnimation());
                document.getElementById('benchmarkBtn').addEventListener('click', () => this.runBenchmark());
                
                document.getElementById('datasetSelect').addEventListener('change', (e) => {
                    const dataset = e.target.value;
                    const warning = document.querySelector('.model-size-warning');
                    
                    if (dataset === 'biwi') {
                        if (!warning) {
                            const warningDiv = document.createElement('div');
                            warningDiv.className = 'model-size-warning';
                            warningDiv.innerHTML = '⚠️ BIWI model is 549MB - may require powerful hardware or cause memory issues in some browsers';
                            e.target.parentNode.appendChild(warningDiv);
                        }
                    } else {
                        if (warning) {
                            warning.remove();
                        }
                    }
                    
                    this.updateSubjectRange(dataset);
                });
            }

            updateSubjectRange(dataset) {
                const subjectInput = document.getElementById('subjectId');
                if (dataset === 'vocaset') {
                    subjectInput.max = 7; // 8 subjects (0-7)
                } else if (dataset === 'biwi') {
                    subjectInput.max = 5; // 6 subjects (0-5)
                }
                if (parseInt(subjectInput.value) > parseInt(subjectInput.max)) {
                    subjectInput.value = subjectInput.max;
                }
            }

            setupLogging() {
                // Intercept console.log to show in our log
                const originalLog = console.log;
                console.log = (...args) => {
                    originalLog(...args);
                    this.addLogEntry(args.join(' '));
                };

                const originalError = console.error;
                console.error = (...args) => {
                    originalError(...args);
                    this.addLogEntry('ERROR: ' + args.join(' '), 'error');
                };

                const originalWarn = console.warn;
                console.warn = (...args) => {
                    originalWarn(...args);
                    this.addLogEntry('WARN: ' + args.join(' '), 'warning');
                };
            }

            addLogEntry(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.style.color = type === 'error' ? '#ff6b6b' : type === 'warning' ? '#ffd93d' : '#6bcf7f';
                entry.textContent = `[${timestamp}] ${message}`;
                this.logElement.appendChild(entry);
                this.logElement.scrollTop = this.logElement.scrollHeight;
            }

            async detectBackends() {
                console.log('🔍 Detecting available backends...');
                
                const backends = await this.faceformer.detectAvailableBackends();
                this.updateBackendGrid(backends);
            }

            updateBackendGrid(backends) {
                const grid = document.getElementById('backendGrid');
                grid.innerHTML = '';

                const backendInfo = {
                    webgpu: {
                        name: 'WebGPU',
                        icon: '🎮',
                        description: 'GPU-accelerated compute shaders',
                        features: ['Parallel Processing', 'Large Memory Buffers', 'Compute Shaders', 'High Throughput']
                    },
                    webnn: {
                        name: 'WebNN',
                        icon: '🧠',
                        description: 'Native neural network acceleration',
                        features: ['Hardware NN Units', 'Optimized Inference', 'Power Efficient', 'Native Performance']
                    },
                    onnxruntime: {
                        name: 'ONNX Runtime Web',
                        icon: '📦',
                        description: 'Cross-platform ML inference',
                        features: ['ONNX Model Support', 'WebGPU Backend', 'Optimized Execution', 'Broad Compatibility']
                    },
                    wasm: {
                        name: 'WebAssembly',
                        icon: '🌐',
                        description: 'High-performance fallback',
                        features: ['Universal Support', 'SIMD Instructions', 'Multi-threading', 'Reliable Fallback']
                    }
                };

                for (const [key, available] of Object.entries(backends)) {
                    if (key === 'onnxruntime') continue; // Skip, handled as onnxruntime-web
                    
                    const info = backendInfo[key];
                    if (!info) continue;

                    const card = document.createElement('div');
                    card.className = `backend-card ${available ? 'available' : 'unavailable'}`;
                    
                    card.innerHTML = `
                        <div class="backend-title">
                            ${info.icon} ${info.name}
                            <div class="status-indicator ${available ? 'available' : ''}"></div>
                        </div>
                        <div class="backend-info">${info.description}</div>
                        <ul class="backend-features">
                            ${info.features.map(feature => `<li>${feature}</li>`).join('')}
                        </ul>
                    `;
                    
                    grid.appendChild(card);
                }
            }

            async initialize() {
                const dataset = document.getElementById('datasetSelect').value;
                const backend = document.getElementById('backendSelect').value;
                const initBtn = document.getElementById('initializeBtn');
                
                initBtn.disabled = true;
                initBtn.textContent = 'Initializing...';
                
                try {
                    console.log(`🚀 Initializing ${dataset.toUpperCase()} model with ${backend} backend...`);
                    
                    const success = await this.faceformer.initialize(dataset, backend);
                    
                    if (success) {
                        console.log('✅ Initialization successful!');
                        this.updateSystemInfo();
                        this.updateActiveBackend();
                        
                        document.getElementById('generateBtn').disabled = false;
                        document.getElementById('benchmarkBtn').disabled = false;
                        
                        initBtn.textContent = 'Reinitialize';
                    } else {
                        console.error('❌ Initialization failed');
                        initBtn.textContent = 'Initialize Model';
                    }
                } catch (error) {
                    console.error('❌ Initialization error:', error);
                    initBtn.textContent = 'Initialize Model';
                } finally {
                    initBtn.disabled = false;
                }
            }

            updateSystemInfo() {
                const info = this.faceformer.getSystemInfo();
                const infoElement = document.getElementById('systemInfo');
                
                infoElement.innerHTML = `
                    <p><strong>Status:</strong> ${info.initialized ? '✅ Ready' : '❌ Not Initialized'}</p>
                    <p><strong>Active Backend:</strong> ${info.activeBackend || 'None'}</p>
                    <p><strong>Dataset:</strong> ${info.dataset ? info.dataset.toUpperCase() : 'None'}</p>
                    ${info.config ? `
                        <p><strong>Model Config:</strong></p>
                        <ul>
                            <li>Vertex Dimension: ${info.config.vertice_dim}</li>
                            <li>Feature Dimension: ${info.config.feature_dim}</li>
                            <li>Subjects: ${info.config.num_subjects}</li>
                            <li>Audio Input: ${info.config.audio_input_dim}</li>
                        </ul>
                    ` : ''}
                    ${info.backend ? `
                        <p><strong>Backend Details:</strong></p>
                        <ul>
                            ${info.backend.features ? `<li>GPU Features: ${info.backend.features.join(', ')}</li>` : ''}
                            ${info.backend.maxBufferSize ? `<li>Max Buffer: ${(info.backend.maxBufferSize / (1024*1024)).toFixed(1)}MB</li>` : ''}
                            ${info.backend.providers ? `<li>Providers: ${info.backend.providers.join(', ')}</li>` : ''}
                            ${info.backend.threads ? `<li>Threads: ${info.backend.threads}</li>` : ''}
                            ${info.backend.simd ? `<li>SIMD: Enabled</li>` : ''}
                        </ul>
                    ` : ''}
                `;

                // Update model size
                if (info.dataset) {
                    const modelSizes = { vocaset: '62.3', biwi: '548.9' };
                    document.getElementById('modelSize').textContent = `${modelSizes[info.dataset]}MB`;
                }
            }

            updateActiveBackend() {
                const cards = document.querySelectorAll('.backend-card');
                cards.forEach(card => card.classList.remove('active'));
                
                const activeBackend = this.faceformer.activeBackend;
                if (activeBackend) {
                    cards.forEach(card => {
                        if (card.textContent.toLowerCase().includes(activeBackend.replace('-', ' ').toLowerCase())) {
                            card.classList.add('active');
                            const indicator = card.querySelector('.status-indicator');
                            indicator.classList.add('active');
                        }
                    });
                }
            }

            generateMockAudioFeatures(sequenceLength, audioDim = 768) {
                const features = [];
                for (let t = 0; t < sequenceLength; t++) {
                    const frame = [];
                    for (let i = 0; i < audioDim; i++) {
                        frame.push(Math.random() * 0.1 - 0.05); // Small random values
                    }
                    features.push(frame);
                }
                return features;
            }

            generateMockTemplate(verticeDim) {
                const template = [];
                for (let i = 0; i < verticeDim; i++) {
                    template.push(Math.random() * 0.01); // Small template values
                }
                return template;
            }

            async generateAnimation() {
                const subjectId = parseInt(document.getElementById('subjectId').value);
                const sequenceLength = parseInt(document.getElementById('sequenceLength').value);
                const generateBtn = document.getElementById('generateBtn');
                
                generateBtn.disabled = true;
                generateBtn.textContent = 'Generating...';
                
                try {
                    console.log(`🎭 Generating ${sequenceLength} frame animation for subject ${subjectId}...`);
                    
                    const config = this.faceformer.config;
                    const audioFeatures = this.generateMockAudioFeatures(sequenceLength, config.audio_input_dim);
                    const template = this.generateMockTemplate(config.vertice_dim);
                    
                    const result = await this.faceformer.generateVertices(audioFeatures, template, subjectId);
                    
                    console.log(`✅ Generated ${result.vertices.length} frames in ${result.inferenceTime.toFixed(2)}ms`);
                    
                    this.updatePerformanceStats(result, sequenceLength);
                    this.showResults(result);
                    
                } catch (error) {
                    console.error('❌ Generation failed:', error);
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate Animation';
                }
            }

            updatePerformanceStats(result, sequenceLength) {
                document.getElementById('performanceStats').style.display = 'grid';
                document.getElementById('inferenceTime').textContent = `${result.inferenceTime.toFixed(2)}`;
                document.getElementById('throughput').textContent = `${(sequenceLength / (result.inferenceTime / 1000)).toFixed(1)}`;
                
                // Estimate memory usage
                const vertexCount = result.vertices[0].length;
                const memoryMB = (sequenceLength * vertexCount * 4) / (1024 * 1024); // 4 bytes per float
                document.getElementById('memoryUsage').textContent = `${memoryMB.toFixed(1)}MB`;
            }

            showResults(result) {
                const resultsSection = document.getElementById('resultsSection');
                const resultsElement = document.getElementById('generationResults');
                
                resultsElement.innerHTML = `
                    <p><strong>Backend:</strong> ${result.backend}</p>
                    <p><strong>Frames Generated:</strong> ${result.vertices.length}</p>
                    <p><strong>Vertices per Frame:</strong> ${result.vertices[0].length}</p>
                    <p><strong>Inference Time:</strong> ${result.inferenceTime.toFixed(2)}ms</p>
                    <p><strong>Sample Frame (first 10 vertices):</strong></p>
                    <pre>${JSON.stringify(result.vertices[0].slice(0, 10), null, 2)}</pre>
                `;
                
                resultsSection.style.display = 'block';
            }

            async runBenchmark() {
                const benchmarkBtn = document.getElementById('benchmarkBtn');
                benchmarkBtn.disabled = true;
                benchmarkBtn.textContent = 'Running Benchmark...';
                
                try {
                    console.log('🏃 Running performance benchmark...');
                    
                    const config = this.faceformer.config;
                    const sequenceLengths = [1, 5, 10, 20];
                    const results = [];
                    
                    for (const seqLen of sequenceLengths) {
                        console.log(`📊 Testing sequence length: ${seqLen}`);
                        
                        const audioFeatures = this.generateMockAudioFeatures(seqLen, config.audio_input_dim);
                        const template = this.generateMockTemplate(config.vertice_dim);
                        
                        const start = performance.now();
                        const result = await this.faceformer.generateVertices(audioFeatures, template, 0);
                        const totalTime = performance.now() - start;
                        
                        results.push({
                            sequenceLength: seqLen,
                            inferenceTime: result.inferenceTime,
                            totalTime: totalTime,
                            throughput: seqLen / (totalTime / 1000)
                        });
                        
                        console.log(`  ⏱️ ${seqLen} frames: ${totalTime.toFixed(2)}ms (${(seqLen / (totalTime / 1000)).toFixed(1)} fps)`);
                    }
                    
                    console.log('📈 Benchmark Results:');
                    results.forEach(r => {
                        console.log(`  ${r.sequenceLength} frames: ${r.totalTime.toFixed(2)}ms (${r.throughput.toFixed(1)} fps)`);
                    });
                    
                } catch (error) {
                    console.error('❌ Benchmark failed:', error);
                } finally {
                    benchmarkBtn.disabled = false;
                    benchmarkBtn.textContent = 'Run Benchmark';
                }
            }
        }

        // Initialize demo when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new FaceFormerDemo();
        });
    </script>
</body>
</html>
