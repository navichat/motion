<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM AI Conversation - Diagnostics Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f0f0f;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #1a1a1a;
            border-radius: 8px;
            border-left: 4px solid #00d4ff;
        }
        .test-section h2 {
            color: #00d4ff;
            margin-top: 0;
        }
        .test-button {
            background-color: #00d4ff;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .test-button:hover {
            background-color: #0099cc;
        }
        .test-button:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }
        .log-output {
            background-color: #000;
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 10px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .status-item {
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid #ff6b6b;
        }
        .status-item.success {
            border-left-color: #51cf66;
        }
        .status-item.warning {
            border-left-color: #ffd43b;
        }
        .status-item.info {
            border-left-color: #339af0;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            height: 600px;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            overflow: hidden;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .console-monitor {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 10px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VRM AI Conversation - Enhanced Diagnostics Test</h1>
        
        <div class="test-section">
            <h2>🔍 System Environment Check</h2>
            <button class="test-button" onclick="checkEnvironment()">Check Environment</button>
            <button class="test-button" onclick="checkAudioSupport()">Check Audio Support</button>
            <button class="test-button" onclick="checkWebGPU()">Check WebGPU</button>
            <div class="status-grid" id="env-status">
                <!-- Environment status will be populated here -->
            </div>
        </div>
        
        <div class="test-section">
            <h2>🎵 Audio Device Testing</h2>
            <button class="test-button" onclick="enumerateDevices()">Enumerate Devices</button>
            <button class="test-button" onclick="testMicrophone()">Test Microphone</button>
            <button class="test-button" onclick="testSpeakers()">Test Speakers</button>
            <div class="log-output" id="audio-log"></div>
        </div>
        
        <div class="test-section">
            <h2>👷 Worker and Worklet Testing</h2>
            <button class="test-button" onclick="testWorkerCreation()">Test Worker Creation</button>
            <button class="test-button" onclick="testWorkletLoading()">Test Worklet Loading</button>
            <button class="test-button" onclick="cleanupWorkers()">Cleanup Workers</button>
            <div class="log-output" id="worker-log"></div>
        </div>
        
        <div class="test-section">
            <h2>🧠 AI Model Testing</h2>
            <button class="test-button" onclick="testTransformersJS()">Test Transformers.js</button>
            <button class="test-button" onclick="testModelLoading()">Test Model Loading</button>
            <button class="test-button" onclick="testTTSFallback()">Test TTS Fallback</button>
            <div class="log-output" id="model-log"></div>
        </div>
        
        <div class="test-section">
            <h2>🖥️ Live VRM AI Interface</h2>
            <button class="test-button" onclick="loadInterface()">Load Interface</button>
            <button class="test-button" onclick="monitorConsole()">Monitor Console</button>
            <button class="test-button" onclick="injectDebugTools()">Inject Debug Tools</button>
            <div class="iframe-container">
                <iframe id="vrm-interface" src="about:blank"></iframe>
                <div class="console-monitor" id="console-monitor" style="display: none;"></div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>📊 Real-time Diagnostics</h2>
            <div class="log-output" id="diagnostics-log"></div>
        </div>
    </div>

    <script>
        // Global test state
        let testWorkers = [];
        let testAudioContexts = [];
        let consoleMonitor = null;
        let diagnosticsInterval = null;
        
        // Logging functions
        function logToSection(sectionId, message, type = 'info') {
            const section = document.getElementById(sectionId);
            if (section) {
                const timestamp = new Date().toISOString();
                const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
                section.textContent += `${timestamp} ${prefix} ${message}\n`;
                section.scrollTop = section.scrollHeight;
            }
        }
        
        function updateStatus(statusId, items) {
            const statusDiv = document.getElementById(statusId);
            if (statusDiv) {
                statusDiv.innerHTML = items.map(item => 
                    `<div class="status-item ${item.type}">
                        <strong>${item.title}</strong><br>
                        ${item.description}
                    </div>`
                ).join('');
            }
        }
        
        // Environment checks
        async function checkEnvironment() {
            logToSection('diagnostics-log', 'Starting environment check...');
            
            const checks = [
                {
                    title: 'User Agent',
                    description: navigator.userAgent,
                    type: 'info'
                },
                {
                    title: 'WebGL Support',
                    description: checkWebGLSupport() ? 'Supported' : 'Not supported',
                    type: checkWebGLSupport() ? 'success' : 'error'
                },
                {
                    title: 'Web Workers',
                    description: typeof Worker !== 'undefined' ? 'Supported' : 'Not supported',
                    type: typeof Worker !== 'undefined' ? 'success' : 'error'
                },
                {
                    title: 'Audio Worklets',
                    description: typeof AudioWorklet !== 'undefined' ? 'Supported' : 'Not supported',
                    type: typeof AudioWorklet !== 'undefined' ? 'success' : 'error'
                },
                {
                    title: 'Media Devices',
                    description: navigator.mediaDevices ? 'Supported' : 'Not supported',
                    type: navigator.mediaDevices ? 'success' : 'error'
                }
            ];
            
            updateStatus('env-status', checks);
            logToSection('diagnostics-log', 'Environment check complete');
        }
        
        function checkWebGLSupport() {
            try {
                const canvas = document.createElement('canvas');
                return !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
            } catch (e) {
                return false;
            }
        }
        
        async function checkAudioSupport() {
            logToSection('audio-log', 'Checking audio support...');
            
            try {
                const audioContext = new AudioContext();
                logToSection('audio-log', `AudioContext created: ${audioContext.sampleRate}Hz, ${audioContext.state}`, 'success');
                
                if (audioContext.audioWorklet) {
                    logToSection('audio-log', 'AudioWorklet supported', 'success');
                } else {
                    logToSection('audio-log', 'AudioWorklet not supported', 'error');
                }
                
                await audioContext.close();
                logToSection('audio-log', 'AudioContext closed');
            } catch (error) {
                logToSection('audio-log', `Audio support check failed: ${error.message}`, 'error');
            }
        }
        
        async function checkWebGPU() {
            logToSection('diagnostics-log', 'Checking WebGPU support...');
            
            if (!navigator.gpu) {
                logToSection('diagnostics-log', 'WebGPU not supported', 'error');
                return;
            }
            
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (adapter) {
                    logToSection('diagnostics-log', 'WebGPU adapter found', 'success');
                    const device = await adapter.requestDevice();
                    logToSection('diagnostics-log', `WebGPU device: ${device.label}`, 'success');
                } else {
                    logToSection('diagnostics-log', 'No WebGPU adapter available', 'warning');
                }
            } catch (error) {
                logToSection('diagnostics-log', `WebGPU check failed: ${error.message}`, 'error');
            }
        }
        
        // Audio device testing
        async function enumerateDevices() {
            logToSection('audio-log', 'Enumerating media devices...');
            
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                devices.forEach(device => {
                    logToSection('audio-log', `${device.kind}: ${device.label || 'Unknown'} (${device.deviceId})`);
                });
                logToSection('audio-log', `Total devices: ${devices.length}`, 'success');
            } catch (error) {
                logToSection('audio-log', `Device enumeration failed: ${error.message}`, 'error');
            }
        }
        
        async function testMicrophone() {
            logToSection('audio-log', 'Testing microphone access...');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                logToSection('audio-log', 'Microphone access granted', 'success');
                
                const tracks = stream.getTracks();
                tracks.forEach(track => {
                    logToSection('audio-log', `Track: ${track.kind} - ${track.label} (${track.readyState})`);
                    track.stop();
                });
                
                logToSection('audio-log', 'Microphone test complete');
            } catch (error) {
                logToSection('audio-log', `Microphone test failed: ${error.message}`, 'error');
            }
        }
        
        async function testSpeakers() {
            logToSection('audio-log', 'Testing speaker output...');
            
            try {
                const audioContext = new AudioContext();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 440;
                gainNode.gain.value = 0.1;
                
                oscillator.start();
                
                setTimeout(() => {
                    oscillator.stop();
                    audioContext.close();
                    logToSection('audio-log', 'Speaker test complete', 'success');
                }, 500);
                
                logToSection('audio-log', 'Playing test tone...');
            } catch (error) {
                logToSection('audio-log', `Speaker test failed: ${error.message}`, 'error');
            }
        }
        
        // Worker testing
        async function testWorkerCreation() {
            logToSection('worker-log', 'Testing worker creation...');
            
            try {
                const workerCode = `
                    self.onmessage = function(e) {
                        if (e.data.type === 'test') {
                            self.postMessage({
                                type: 'test_response',
                                message: 'Worker is functioning correctly',
                                timestamp: new Date().toISOString()
                            });
                        }
                    };
                `;
                
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(blob);
                const worker = new Worker(workerUrl);
                
                worker.onmessage = function(e) {
                    if (e.data.type === 'test_response') {
                        logToSection('worker-log', `Worker response: ${e.data.message}`, 'success');
                    }
                };
                
                worker.onerror = function(error) {
                    logToSection('worker-log', `Worker error: ${error.message}`, 'error');
                };
                
                worker.postMessage({ type: 'test' });
                testWorkers.push(worker);
                
                logToSection('worker-log', 'Worker created successfully');
            } catch (error) {
                logToSection('worker-log', `Worker creation failed: ${error.message}`, 'error');
            }
        }
        
        async function testWorkletLoading() {
            logToSection('worker-log', 'Testing worklet loading...');
            
            try {
                const audioContext = new AudioContext();
                testAudioContexts.push(audioContext);
                
                const workletCode = `
                    class TestProcessor extends AudioWorkletProcessor {
                        process(inputs, outputs, parameters) {
                            // Simple pass-through processor
                            const output = outputs[0];
                            const input = inputs[0];
                            
                            for (let channel = 0; channel < output.length; ++channel) {
                                const inputChannel = input[channel];
                                const outputChannel = output[channel];
                                
                                if (inputChannel) {
                                    for (let i = 0; i < outputChannel.length; ++i) {
                                        outputChannel[i] = inputChannel[i] || 0;
                                    }
                                }
                            }
                            
                            return true;
                        }
                    }
                    
                    registerProcessor('test-processor', TestProcessor);
                `;
                
                const blob = new Blob([workletCode], { type: 'application/javascript' });
                const workletUrl = URL.createObjectURL(blob);
                
                await audioContext.audioWorklet.addModule(workletUrl);
                const workletNode = new AudioWorkletNode(audioContext, 'test-processor');
                
                logToSection('worker-log', 'Worklet loaded successfully', 'success');
                
                URL.revokeObjectURL(workletUrl);
            } catch (error) {
                logToSection('worker-log', `Worklet loading failed: ${error.message}`, 'error');
            }
        }
        
        function cleanupWorkers() {
            logToSection('worker-log', 'Cleaning up test workers and contexts...');
            
            testWorkers.forEach(worker => {
                worker.terminate();
            });
            testWorkers = [];
            
            testAudioContexts.forEach(ctx => {
                ctx.close();
            });
            testAudioContexts = [];
            
            logToSection('worker-log', 'Cleanup complete', 'success');
        }
        
        // Model testing
        async function testTransformersJS() {
            logToSection('model-log', 'Testing Transformers.js availability...');
            
            try {
                // Test if we can load the library
                const script = document.createElement('script');
                script.type = 'module';
                script.textContent = `
                    import { env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js';
                    
                    window.postMessage({
                        type: 'transformers_test',
                        success: true,
                        env: {
                            allowRemoteModels: env.allowRemoteModels,
                            allowLocalModels: env.allowLocalModels
                        }
                    });
                `;
                
                window.addEventListener('message', function(event) {
                    if (event.data.type === 'transformers_test') {
                        if (event.data.success) {
                            logToSection('model-log', 'Transformers.js loaded successfully', 'success');
                            logToSection('model-log', `Environment: ${JSON.stringify(event.data.env)}`);
                        } else {
                            logToSection('model-log', 'Transformers.js test failed', 'error');
                        }
                    }
                });
                
                document.head.appendChild(script);
                
                setTimeout(() => {
                    document.head.removeChild(script);
                }, 2000);
                
            } catch (error) {
                logToSection('model-log', `Transformers.js test failed: ${error.message}`, 'error');
            }
        }
        
        async function testModelLoading() {
            logToSection('model-log', 'Testing model loading capabilities...');
            
            // This would normally test actual model loading
            // For now, we'll just test the infrastructure
            try {
                if (typeof importScripts === 'undefined') {
                    logToSection('model-log', 'Running in main thread - model loading would use dynamic imports');
                } else {
                    logToSection('model-log', 'Running in worker thread - model loading would use importScripts');
                }
                
                // Test fetch capabilities
                const response = await fetch('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/package.json');
                if (response.ok) {
                    logToSection('model-log', 'CDN access test successful', 'success');
                } else {
                    logToSection('model-log', 'CDN access test failed', 'warning');
                }
            } catch (error) {
                logToSection('model-log', `Model loading test failed: ${error.message}`, 'error');
            }
        }
        
        async function testTTSFallback() {
            logToSection('model-log', 'Testing TTS fallback (Web Speech API)...');
            
            try {
                if ('speechSynthesis' in window) {
                    logToSection('model-log', 'Web Speech API available', 'success');
                    
                    const voices = speechSynthesis.getVoices();
                    logToSection('model-log', `Available voices: ${voices.length}`);
                    
                    if (voices.length > 0) {
                        const utterance = new SpeechSynthesisUtterance('Testing TTS fallback system');
                        utterance.volume = 0.1;
                        utterance.rate = 1.0;
                        
                        utterance.onstart = () => {
                            logToSection('model-log', 'TTS playback started', 'success');
                        };
                        
                        utterance.onend = () => {
                            logToSection('model-log', 'TTS playback ended', 'success');
                        };
                        
                        utterance.onerror = (event) => {
                            logToSection('model-log', `TTS error: ${event.error}`, 'error');
                        };
                        
                        speechSynthesis.speak(utterance);
                        logToSection('model-log', 'TTS test initiated');
                    } else {
                        logToSection('model-log', 'No voices available', 'warning');
                    }
                } else {
                    logToSection('model-log', 'Web Speech API not available', 'error');
                }
            } catch (error) {
                logToSection('model-log', `TTS fallback test failed: ${error.message}`, 'error');
            }
        }
        
        // Interface testing
        function loadInterface() {
            logToSection('diagnostics-log', 'Loading VRM AI interface...');
            
            const iframe = document.getElementById('vrm-interface');
            iframe.src = './vrm_ai_conversation_enhanced.html';
            
            iframe.onload = () => {
                logToSection('diagnostics-log', 'Interface loaded successfully', 'success');
                
                // Try to access the iframe's console
                try {
                    const iframeWindow = iframe.contentWindow;
                    if (iframeWindow) {
                        logToSection('diagnostics-log', 'Interface window accessible');
                    }
                } catch (error) {
                    logToSection('diagnostics-log', `Interface access limited: ${error.message}`, 'warning');
                }
            };
            
            iframe.onerror = () => {
                logToSection('diagnostics-log', 'Interface loading failed', 'error');
            };
        }
        
        function monitorConsole() {
            const monitor = document.getElementById('console-monitor');
            
            if (consoleMonitor) {
                // Stop monitoring
                clearInterval(consoleMonitor);
                consoleMonitor = null;
                monitor.style.display = 'none';
                logToSection('diagnostics-log', 'Console monitoring stopped');
                return;
            }
            
            // Start monitoring
            monitor.style.display = 'block';
            monitor.textContent = 'Monitoring console...\n';
            
            // Override console methods to capture logs
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;
            
            console.log = function(...args) {
                monitor.textContent += `[LOG] ${args.join(' ')}\n`;
                monitor.scrollTop = monitor.scrollHeight;
                originalLog.apply(console, args);
            };
            
            console.error = function(...args) {
                monitor.textContent += `[ERROR] ${args.join(' ')}\n`;
                monitor.scrollTop = monitor.scrollHeight;
                originalError.apply(console, args);
            };
            
            console.warn = function(...args) {
                monitor.textContent += `[WARN] ${args.join(' ')}\n`;
                monitor.scrollTop = monitor.scrollHeight;
                originalWarn.apply(console, args);
            };
            
            logToSection('diagnostics-log', 'Console monitoring started');
        }
        
        function injectDebugTools() {
            logToSection('diagnostics-log', 'Injecting debug tools into interface...');
            
            const iframe = document.getElementById('vrm-interface');
            
            try {
                const iframeWindow = iframe.contentWindow;
                const iframeDoc = iframe.contentDocument;
                
                if (iframeWindow && iframeDoc) {
                    // Inject debug panel
                    const debugPanel = iframeDoc.createElement('div');
                    debugPanel.id = 'external-debug-panel';
                    debugPanel.style.cssText = `
                        position: fixed;
                        top: 10px;
                        left: 10px;
                        background: rgba(0,0,0,0.9);
                        color: #00ff00;
                        padding: 10px;
                        border-radius: 4px;
                        font-family: monospace;
                        font-size: 12px;
                        z-index: 10000;
                        max-width: 300px;
                        max-height: 200px;
                        overflow-y: auto;
                    `;
                    
                    iframeDoc.body.appendChild(debugPanel);
                    
                    // Monitor iframe events
                    iframeWindow.addEventListener('error', (event) => {
                        debugPanel.textContent += `ERROR: ${event.error.message}\n`;
                        debugPanel.scrollTop = debugPanel.scrollHeight;
                    });
                    
                    logToSection('diagnostics-log', 'Debug tools injected successfully', 'success');
                } else {
                    logToSection('diagnostics-log', 'Cannot access iframe content', 'warning');
                }
            } catch (error) {
                logToSection('diagnostics-log', `Debug injection failed: ${error.message}`, 'error');
            }
        }
        
        // Auto-start diagnostics
        function startDiagnostics() {
            logToSection('diagnostics-log', '🚀 Starting comprehensive diagnostics...');
            
            // Run initial checks
            checkEnvironment();
            
            // Start real-time monitoring
            diagnosticsInterval = setInterval(() => {
                const timestamp = new Date().toISOString();
                const memoryInfo = performance.memory ? {
                    used: Math.round(performance.memory.usedJSHeapSize / 1024 / 1024),
                    total: Math.round(performance.memory.totalJSHeapSize / 1024 / 1024)
                } : null;
                
                logToSection('diagnostics-log', 
                    `[${timestamp}] Memory: ${memoryInfo ? `${memoryInfo.used}MB/${memoryInfo.total}MB` : 'N/A'} | ` +
                    `Workers: ${testWorkers.length} | AudioContexts: ${testAudioContexts.length}`
                );
            }, 5000);
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            cleanupWorkers();
            if (diagnosticsInterval) {
                clearInterval(diagnosticsInterval);
            }
        });
        
        // Start diagnostics when page loads
        window.addEventListener('load', startDiagnostics);
        
    </script>
</body>
</html>
