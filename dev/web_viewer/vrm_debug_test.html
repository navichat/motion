<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Loading Test - Debug Mode</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        
        #container {
            width: 800px;
            height: 600px;
            background: white;
            margin: 20px auto;
            border: 2px solid #ccc;
            border-radius: 10px;
            position: relative;
        }
        
        #controls {
            padding: 20px;
            background: #333;
            color: white;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        #log {
            background: black;
            color: lime;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: scroll;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        #status {
            background: #ffffcc;
            padding: 10px;
            border-left: 4px solid #ff9900;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h2>🎭 VRM Loading Test - Debug Mode</h2>
        <button onclick="testVRMLoaderAvailability()">Test VRMLoader Availability</button>
        <button onclick="testDirectVRMLoad()">Test Direct VRM Load</button>
        <button onclick="test3DScene()">Test 3D Scene</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>
    
    <div id="status">
        <strong>Status:</strong> <span id="status-text">Ready for testing</span>
    </div>
    
    <div id="log"></div>
    
    <div id="container"></div>

    <!-- Import maps for Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
        }
    }
    </script>
    
    <!-- Load VRM Components -->
    <script src="../src/components/animation/vrm/VRMLoader.js"></script>
    
    <script type="module">
        // Import Three.js modules
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';
        
        // Make THREE available globally
        window.THREE = THREE;
        window.THREELoaders = { GLTFLoader, VRMLoaderPlugin };
        
        let scene, renderer, camera;
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function setStatus(text) {
            document.getElementById('status-text').textContent = text;
        }
        
        window.testVRMLoaderAvailability = function() {
            log('🔍 Testing VRMLoader availability...');
            
            // Test if VRMLoaderLite is available
            if (typeof VRMLoaderLite !== 'undefined') {
                log('✅ VRMLoaderLite is available');
                setStatus('VRMLoaderLite is available');
            } else {
                log('❌ VRMLoaderLite is NOT available');
                setStatus('VRMLoaderLite is NOT available');
            }
            
            // Test if Three.js is available
            if (typeof THREE !== 'undefined') {
                log('✅ Three.js is available');
            } else {
                log('❌ Three.js is NOT available');
            }
            
            // Test if VRM modules are available
            if (typeof VRMLoaderPlugin !== 'undefined') {
                log('✅ VRMLoaderPlugin is available');
            } else {
                log('❌ VRMLoaderPlugin is NOT available');
            }
        };
        
        window.testDirectVRMLoad = async function() {
            log('🎭 Testing direct VRM loading...');
            
            if (typeof VRMLoaderLite === 'undefined') {
                log('❌ VRMLoaderLite not available, cannot test VRM loading');
                setStatus('VRMLoaderLite not available');
                return;
            }
            
            const vrmPaths = [
                './assets/avatars/ichika.vrm',
                './assets/avatars/buny.vrm',
                './assets/avatars/kaede.vrm'
            ];
            
            for (const vrmPath of vrmPaths) {
                try {
                    log(`📥 Attempting to load VRM: ${vrmPath}`);
                    
                    // Fetch VRM file
                    const response = await fetch(vrmPath);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const buffer = await response.arrayBuffer();
                    log(`✅ VRM file fetched (${(buffer.byteLength / 1024 / 1024).toFixed(2)} MB)`);
                    
                    // Load VRM using VRMLoaderLite
                    const loader = new VRMLoaderLite();
                    const result = await loader.loadFromArrayBuffer(buffer, vrmPath.split('/').pop());
                    
                    if (result && result.vrm) {
                        log(`✅ VRM loaded successfully! Scene has ${result.vrm.scene.children.length} children`);
                        setStatus(`VRM loaded successfully: ${vrmPath}`);
                        return result;
                    } else {
                        log(`❌ VRM load result invalid`);
                    }
                    
                } catch (error) {
                    log(`❌ Failed to load VRM ${vrmPath}: ${error.message}`);
                    continue;
                }
            }
            
            log('❌ All VRM loading attempts failed');
            setStatus('All VRM loading attempts failed');
        };
        
        window.test3DScene = function() {
            log('🎮 Testing 3D scene setup...');
            
            try {
                // Create scene
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0xcccccc);
                log('✅ Scene created');
                
                // Create camera
                camera = new THREE.PerspectiveCamera(75, 800/600, 0.1, 1000);
                camera.position.set(0, 1, 3);
                log('✅ Camera created');
                
                // Create renderer
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(800, 600);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                log('✅ Renderer created');
                
                // Add to container
                const container = document.getElementById('container');
                container.innerHTML = '';
                container.appendChild(renderer.domElement);
                
                // Add lighting
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(5, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
                
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                scene.add(ambientLight);
                log('✅ Lighting added');
                
                // Add test cube
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);
                log('✅ Test cube added');
                
                // Render
                renderer.render(scene, camera);
                log('✅ Initial render complete');
                
                setStatus('3D scene test complete');
                
                // Start animation loop
                function animate() {
                    requestAnimationFrame(animate);
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    renderer.render(scene, camera);
                }
                animate();
                log('🎬 Animation loop started');
                
            } catch (error) {
                log(`❌ 3D scene test failed: ${error.message}`);
                setStatus('3D scene test failed');
            }
        };
        
        window.clearLogs = function() {
            document.getElementById('log').innerHTML = '';
        };
        
        // Auto-test on load
        log('🚀 VRM Debug Test Ready');
        log('📝 Click buttons above to run tests');
    </script>
</body>
</html>
