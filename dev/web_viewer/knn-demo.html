<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNN Interface Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            line-height: 1.6;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .demo-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .demo-section h3 {
            color: #ffeb3b;
            margin-top: 0;
        }
        button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .output {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status.success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4CAF50;
        }
        .status.error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
        }
        .status.info {
            background: rgba(33, 150, 243, 0.3);
            border: 1px solid #2196F3;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .metric {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffeb3b;
        }
        .metric-label {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 K-Nearest Neighbors Interface Demo</h1>
        
        <div id="status" class="status info">
            Ready to test KNN interfaces
        </div>

        <div class="demo-section">
            <h3>🚀 Initialize KNN Systems</h3>
            <button onclick="initializeCloseVector()">Initialize CloseVector</button>
            <button onclick="initializeHNSW()">Initialize HNSW</button>
            <button onclick="initializeUnifiedKNN()">Initialize Unified KNN</button>
            <div id="init-output" class="output"></div>
        </div>

        <div class="demo-section">
            <h3>📊 Add Test Vectors</h3>
            <button onclick="addTestVectors('closevector')">Add Vectors to CloseVector</button>
            <button onclick="addTestVectors('hnsw')">Add Vectors to HNSW</button>
            <button onclick="addTestVectors('unified')">Add Vectors to Unified KNN</button>
            <div id="vectors-output" class="output"></div>
        </div>

        <div class="demo-section">
            <h3>🔍 Perform KNN Search</h3>
            <button onclick="performKNNSearch('closevector')">Search with CloseVector</button>
            <button onclick="performKNNSearch('hnsw')">Search with HNSW</button>
            <button onclick="performKNNSearch('unified')">Search with Unified KNN</button>
            <button onclick="benchmarkKNN()">🏁 Benchmark All</button>
            <div id="search-output" class="output"></div>
        </div>

        <div class="demo-section">
            <h3>📈 Performance Metrics</h3>
            <div class="grid" id="metrics">
                <!-- Metrics will be populated here -->
            </div>
        </div>

        <div class="demo-section">
            <h3>🔧 System Status</h3>
            <button onclick="getSystemStats()">Get All Statistics</button>
            <div id="stats-output" class="output"></div>
        </div>
    </div>

    <!-- Load KNN interfaces -->
    <script src="close-vector/closevector-interface.js"></script>
    <script src="hsnwlib/hnsw-interface.js"></script>
    <script src="close-vector/unified-knn-interface.js"></script>

    <script>
        // Global instances
        let closeVectorInstance = null;
        let hnswInstance = null;
        let unifiedKNNInstance = null;
        let testVectors = [];
        let performanceMetrics = {};

        // Generate test vectors
        function generateTestVectors(count = 50, dimensions = 128) {
            const vectors = [];
            const categories = ['documents', 'images', 'audio', 'embeddings', 'features'];
            
            for (let i = 0; i < count; i++) {
                const vector = Array.from({ length: dimensions }, () => Math.random() * 2 - 1);
                vectors.push({
                    id: `test_vector_${i}`,
                    vector: vector,
                    metadata: {
                        category: categories[i % categories.length],
                        index: i,
                        timestamp: Date.now(),
                        cluster: Math.floor(i / 10)
                    }
                });
            }
            
            return vectors;
        }

        // Update status
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        // Log output to specified element
        function logOutput(elementId, message) {
            const outputEl = document.getElementById(elementId);
            outputEl.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        // Initialize CloseVector
        async function initializeCloseVector() {
            try {
                updateStatus('Initializing CloseVector...', 'info');
                closeVectorInstance = new CloseVectorInterface();
                
                const result = await closeVectorInstance.initialize(128, 'cosine');
                logOutput('init-output', `CloseVector initialized: ${JSON.stringify(result, null, 2)}`);
                
                if (result.success) {
                    updateStatus('CloseVector initialized successfully', 'success');
                } else {
                    updateStatus('CloseVector initialization failed', 'error');
                }
            } catch (error) {
                logOutput('init-output', `Error: ${error.message}`);
                updateStatus('CloseVector initialization error', 'error');
            }
        }

        // Initialize HNSW
        async function initializeHNSW() {
            try {
                updateStatus('Initializing HNSW...', 'info');
                hnswInstance = new HNSWInterface();
                
                const result = await hnswInstance.initialize(128, 10000, 'l2', { M: 16, efConstruction: 200 });
                logOutput('init-output', `HNSW initialized: ${JSON.stringify(result, null, 2)}`);
                
                if (result.success) {
                    updateStatus('HNSW initialized successfully', 'success');
                } else {
                    updateStatus('HNSW initialization failed', 'error');
                }
            } catch (error) {
                logOutput('init-output', `Error: ${error.message}`);
                updateStatus('HNSW initialization error', 'error');
            }
        }

        // Initialize Unified KNN
        async function initializeUnifiedKNN() {
            try {
                updateStatus('Initializing Unified KNN...', 'info');
                unifiedKNNInstance = new UnifiedKNNInterface();
                
                const result = await unifiedKNNInstance.initialize({
                    implementation: 'auto',
                    dimensions: 128,
                    maxElements: 10000,
                    distanceMetric: 'cosine'
                });
                
                logOutput('init-output', `Unified KNN initialized: ${JSON.stringify(result, null, 2)}`);
                
                if (result.success) {
                    updateStatus('Unified KNN initialized successfully', 'success');
                } else {
                    updateStatus('Unified KNN initialization failed', 'error');
                }
            } catch (error) {
                logOutput('init-output', `Error: ${error.message}`);
                updateStatus('Unified KNN initialization error', 'error');
            }
        }

        // Add test vectors
        async function addTestVectors(implementation) {
            try {
                if (testVectors.length === 0) {
                    testVectors = generateTestVectors(50, 128);
                    logOutput('vectors-output', `Generated ${testVectors.length} test vectors`);
                }

                let instance, name;
                switch (implementation) {
                    case 'closevector':
                        instance = closeVectorInstance;
                        name = 'CloseVector';
                        break;
                    case 'hnsw':
                        instance = hnswInstance;
                        name = 'HNSW';
                        break;
                    case 'unified':
                        instance = unifiedKNNInstance;
                        name = 'Unified KNN';
                        break;
                    default:
                        throw new Error('Unknown implementation');
                }

                if (!instance) {
                    throw new Error(`${name} not initialized`);
                }

                updateStatus(`Adding vectors to ${name}...`, 'info');
                const startTime = performance.now();
                const result = await instance.addVectors(testVectors);
                const addTime = performance.now() - startTime;

                logOutput('vectors-output', `${name} add result: ${JSON.stringify(result, null, 2)}`);
                logOutput('vectors-output', `Add time: ${addTime.toFixed(2)}ms`);

                performanceMetrics[`${implementation}_add_time`] = addTime;
                updateStatus(`Vectors added to ${name} successfully`, 'success');
                updateMetricsDisplay();

            } catch (error) {
                logOutput('vectors-output', `Error: ${error.message}`);
                updateStatus('Vector addition failed', 'error');
            }
        }

        // Perform KNN search
        async function performKNNSearch(implementation) {
            try {
                let instance, name;
                switch (implementation) {
                    case 'closevector':
                        instance = closeVectorInstance;
                        name = 'CloseVector';
                        break;
                    case 'hnsw':
                        instance = hnswInstance;
                        name = 'HNSW';
                        break;
                    case 'unified':
                        instance = unifiedKNNInstance;
                        name = 'Unified KNN';
                        break;
                    default:
                        throw new Error('Unknown implementation');
                }

                if (!instance) {
                    throw new Error(`${name} not initialized`);
                }

                // Generate a random query vector
                const queryVector = Array.from({ length: 128 }, () => Math.random() * 2 - 1);
                
                updateStatus(`Searching with ${name}...`, 'info');
                const startTime = performance.now();
                
                const searchOptions = implementation === 'unified' ? 
                    { compareImplementations: true } : 
                    { includeMetadata: true };
                
                const result = await instance.knnSearch(queryVector, 5, searchOptions);
                const searchTime = performance.now() - startTime;

                logOutput('search-output', `${name} search result: ${JSON.stringify(result, null, 2)}`);
                logOutput('search-output', `Total search time: ${searchTime.toFixed(2)}ms`);

                performanceMetrics[`${implementation}_search_time`] = searchTime;
                performanceMetrics[`${implementation}_accuracy`] = result.success ? 1.0 : 0.0;
                
                updateStatus(`${name} search completed`, 'success');
                updateMetricsDisplay();

            } catch (error) {
                logOutput('search-output', `Error: ${error.message}`);
                updateStatus('Search failed', 'error');
            }
        }

        // Benchmark all implementations
        async function benchmarkKNN() {
            try {
                updateStatus('Running comprehensive benchmark...', 'info');
                
                if (!unifiedKNNInstance) {
                    throw new Error('Unified KNN not initialized');
                }

                const result = await unifiedKNNInstance.benchmark({
                    testVectors: 20,
                    dimensions: 128,
                    k: 5,
                    iterations: 3
                });

                logOutput('search-output', `Benchmark results: ${JSON.stringify(result, null, 2)}`);
                
                // Update metrics with benchmark data
                Object.entries(result.implementations).forEach(([impl, stats]) => {
                    performanceMetrics[`${impl}_avg_add_time`] = stats.avg_add_time_ms;
                    performanceMetrics[`${impl}_avg_search_time`] = stats.avg_search_time_ms;
                    performanceMetrics[`${impl}_avg_accuracy`] = stats.avg_accuracy;
                });

                updateStatus('Benchmark completed successfully', 'success');
                updateMetricsDisplay();

            } catch (error) {
                logOutput('search-output', `Benchmark error: ${error.message}`);
                updateStatus('Benchmark failed', 'error');
            }
        }

        // Get system statistics
        async function getSystemStats() {
            try {
                updateStatus('Collecting system statistics...', 'info');
                
                const stats = {};
                
                if (closeVectorInstance) {
                    stats.closevector = closeVectorInstance.getStats();
                }
                
                if (hnswInstance) {
                    stats.hnsw = hnswInstance.getStats();
                }
                
                if (unifiedKNNInstance) {
                    stats.unified = await unifiedKNNInstance.getStats();
                }

                logOutput('stats-output', `System Statistics: ${JSON.stringify(stats, null, 2)}`);
                updateStatus('Statistics collected', 'success');

            } catch (error) {
                logOutput('stats-output', `Error: ${error.message}`);
                updateStatus('Statistics collection failed', 'error');
            }
        }

        // Update performance metrics display
        function updateMetricsDisplay() {
            const metricsEl = document.getElementById('metrics');
            metricsEl.innerHTML = '';

            Object.entries(performanceMetrics).forEach(([key, value]) => {
                const metricDiv = document.createElement('div');
                metricDiv.className = 'metric';
                
                const valueDiv = document.createElement('div');
                valueDiv.className = 'metric-value';
                valueDiv.textContent = typeof value === 'number' ? 
                    (value < 1 ? value.toFixed(3) : value.toFixed(1)) : 
                    value;
                
                const labelDiv = document.createElement('div');
                labelDiv.className = 'metric-label';
                labelDiv.textContent = key.replace(/_/g, ' ').toUpperCase();
                
                metricDiv.appendChild(valueDiv);
                metricDiv.appendChild(labelDiv);
                metricsEl.appendChild(metricDiv);
            });
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('KNN Interface Demo loaded - Initialize systems to begin', 'info');
            
            // Add some sample metrics
            performanceMetrics = {
                'vectors_generated': 0,
                'searches_performed': 0,
                'avg_precision': 0,
                'total_operations': 0
            };
            updateMetricsDisplay();
        });
    </script>
</body>
</html>
