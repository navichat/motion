<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Benchmark Integration Tests</title>
    <style>
        body {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #252526;
            border-radius: 8px;
            border: 1px solid #3c3c3c;
        }
        
        .header h1 {
            color: #569cd6;
            margin: 0 0 10px 0;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        .btn {
            background: #0e639c;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #1177bb;
        }
        
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .btn-success {
            background: #16825d;
        }
        
        .btn-success:hover {
            background: #1a9972;
        }
        
        .btn-danger {
            background: #a1260d;
        }
        
        .btn-danger:hover {
            background: #c42b1c;
        }
        
        .test-output {
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            max-height: 600px;
            overflow-y: auto;
            font-size: 14px;
        }
        
        .test-status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid;
        }
        
        .status-running {
            background: #1e3a8a20;
            border-left-color: #3b82f6;
            color: #93c5fd;
        }
        
        .status-success {
            background: #15803d20;
            border-left-color: #22c55e;
            color: #86efac;
        }
        
        .status-error {
            background: #dc262620;
            border-left-color: #ef4444;
            color: #fca5a5;
        }
        
        .status-warning {
            background: #d9780320;
            border-left-color: #f59e0b;
            color: #fcd34d;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #3c3c3c;
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0e639c, #16825d);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .test-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .summary-card {
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        
        .summary-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .summary-label {
            color: #b0b0b0;
            font-size: 0.9em;
        }
        
        .error-details {
            background: #3c1e1e;
            border: 1px solid #6b2c2c;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            font-size: 12px;
        }
        
        /* Console output styling */
        .console-line {
            margin: 2px 0;
        }
        
        .console-error {
            color: #f87171;
        }
        
        .console-warn {
            color: #fbbf24;
        }
        
        .console-info {
            color: #60a5fa;
        }
        
        .console-success {
            color: #34d399;
        }
        
        .timestamp {
            color: #9ca3af;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Performance Benchmark Integration Tests</h1>
            <p>Comprehensive testing suite for hardware performance monitoring system</p>
        </div>
        
        <div class="controls">
            <button id="runTestsBtn" class="btn" onclick="runIntegrationTests()">
                🚀 Run All Tests
            </button>
            <button id="runQuickBtn" class="btn" onclick="runQuickTests()">
                ⚡ Quick Test
            </button>
            <button id="stopTestsBtn" class="btn btn-danger" onclick="stopTests()" disabled>
                ⏹️ Stop Tests
            </button>
            <button id="clearOutputBtn" class="btn" onclick="clearOutput()">
                🗑️ Clear Output
            </button>
            <button id="exportResultsBtn" class="btn btn-success" onclick="exportResults()" disabled>
                📄 Export Results
            </button>
        </div>
        
        <div id="testStatus" class="test-status" style="display: none;">
            <div id="statusMessage"></div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>
        
        <div class="test-summary" id="testSummary" style="display: none;">
            <div class="summary-card">
                <div id="totalTests" class="summary-number">0</div>
                <div class="summary-label">Total Tests</div>
            </div>
            <div class="summary-card">
                <div id="passedTests" class="summary-number" style="color: #22c55e;">0</div>
                <div class="summary-label">Passed</div>
            </div>
            <div class="summary-card">
                <div id="failedTests" class="summary-number" style="color: #ef4444;">0</div>
                <div class="summary-label">Failed</div>
            </div>
            <div class="summary-card">
                <div id="testDuration" class="summary-number">0ms</div>
                <div class="summary-label">Duration</div>
            </div>
        </div>
        
        <div class="test-output" id="testOutput">
            <div class="console-line">
                <span class="timestamp">[Ready]</span>
                <span>Integration test runner initialized. Click "Run All Tests" to begin.</span>
            </div>
        </div>
    </div>

    <!-- Load all dependencies -->
    <script src="./js/FibonacciHeap.js"></script>
    <script src="./js/TaskManager.js"></script>
    <script src="./js/PerformanceBenchmarkJobs.js"></script>
    <script src="./js/RealTimePerformanceMonitor.js"></script>
    <script src="./js/SystemPerformanceAnalyzer.js"></script>
    <script src="./js/IntegrationTestSuite.js"></script>
    
    <script>
        let currentTestSuite = null;
        let testResults = null;
        let isTestRunning = false;
        
        // Override console methods to capture output
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn,
            info: console.info
        };
        
        function logToOutput(message, type = 'log') {
            const output = document.getElementById('testOutput');
            const timestamp = new Date().toLocaleTimeString();
            
            const line = document.createElement('div');
            line.className = `console-line console-${type}`;
            
            line.innerHTML = `
                <span class="timestamp">[${timestamp}]</span>
                <span>${escapeHtml(message)}</span>
            `;
            
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
            
            // Also log to original console
            originalConsole[type](message);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Override console methods
        console.log = (message) => logToOutput(message, 'log');
        console.error = (message) => logToOutput(message, 'error');
        console.warn = (message) => logToOutput(message, 'warn');
        console.info = (message) => logToOutput(message, 'info');
        
        async function runIntegrationTests() {
            if (isTestRunning) return;
            
            isTestRunning = true;
            updateButtons();
            showStatus('Running comprehensive integration tests...', 'running');
            
            try {
                currentTestSuite = new IntegrationTestSuite();
                await currentTestSuite.runAllTests();
                
                // Get final results
                testResults = currentTestSuite.generateTestReport();
                updateSummary(testResults);
                
                const status = testResults.overallStatus === 'PASSED' ? 'success' : 'error';
                showStatus(`Tests completed: ${testResults.overallStatus}`, status);
                
            } catch (error) {
                logToOutput(`Test suite failed: ${error.message}`, 'error');
                showStatus('Test suite encountered an error', 'error');
            } finally {
                isTestRunning = false;
                updateButtons();
                
                if (currentTestSuite) {
                    currentTestSuite.cleanup();
                }
            }
        }
        
        async function runQuickTests() {
            if (isTestRunning) return;
            
            isTestRunning = true;
            updateButtons();
            showStatus('Running quick validation tests...', 'running');
            
            try {
                currentTestSuite = new IntegrationTestSuite();
                
                // Run only essential tests
                await currentTestSuite.testSystemAnalyzer();
                await currentTestSuite.testTaskManager();
                await currentTestSuite.testBenchmarkJobs();
                
                const quickResults = {
                    overallStatus: Object.values(currentTestSuite.testResults).every(r => r.status === 'PASSED') ? 'PASSED' : 'FAILED',
                    totalTests: Object.keys(currentTestSuite.testResults).length,
                    passedTests: Object.values(currentTestSuite.testResults).filter(r => r.status === 'PASSED').length,
                    failedTests: Object.values(currentTestSuite.testResults).filter(r => r.status === 'FAILED').length,
                    totalTime: Object.values(currentTestSuite.testResults).reduce((sum, r) => sum + r.duration, 0)
                };
                
                testResults = quickResults;
                updateSummary(quickResults);
                
                const status = quickResults.overallStatus === 'PASSED' ? 'success' : 'error';
                showStatus(`Quick tests completed: ${quickResults.overallStatus}`, status);
                
            } catch (error) {
                logToOutput(`Quick test failed: ${error.message}`, 'error');
                showStatus('Quick test encountered an error', 'error');
            } finally {
                isTestRunning = false;
                updateButtons();
                
                if (currentTestSuite) {
                    currentTestSuite.cleanup();
                }
            }
        }
        
        function stopTests() {
            if (currentTestSuite) {
                currentTestSuite.cleanup();
                currentTestSuite = null;
            }
            
            isTestRunning = false;
            updateButtons();
            showStatus('Tests stopped by user', 'warning');
            logToOutput('Test execution stopped by user', 'warn');
        }
        
        function clearOutput() {
            const output = document.getElementById('testOutput');
            output.innerHTML = `
                <div class="console-line">
                    <span class="timestamp">[${new Date().toLocaleTimeString()}]</span>
                    <span>Output cleared</span>
                </div>
            `;
            
            // Hide summary
            document.getElementById('testSummary').style.display = 'none';
            document.getElementById('testStatus').style.display = 'none';
        }
        
        function exportResults() {
            if (!testResults) {
                logToOutput('No test results to export', 'warn');
                return;
            }
            
            const exportData = {
                timestamp: new Date().toISOString(),
                results: testResults,
                systemInfo: {
                    userAgent: navigator.userAgent,
                    hardwareConcurrency: navigator.hardwareConcurrency,
                    deviceMemory: navigator.deviceMemory
                }
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { 
                type: 'application/json' 
            });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `integration-test-results-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            logToOutput('Test results exported successfully', 'success');
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('testStatus');
            const messageDiv = document.getElementById('statusMessage');
            
            statusDiv.className = `test-status status-${type}`;
            statusDiv.style.display = 'block';
            messageDiv.textContent = message;
            
            // Update progress bar (simplified)
            const progressFill = document.getElementById('progressFill');
            if (type === 'running') {
                progressFill.style.width = '50%';
            } else {
                progressFill.style.width = '100%';
                setTimeout(() => {
                    progressFill.style.width = '0%';
                }, 2000);
            }
        }
        
        function updateSummary(results) {
            const summaryDiv = document.getElementById('testSummary');
            summaryDiv.style.display = 'grid';
            
            document.getElementById('totalTests').textContent = results.totalTests;
            document.getElementById('passedTests').textContent = results.passedTests;
            document.getElementById('failedTests').textContent = results.failedTests;
            document.getElementById('testDuration').textContent = `${Math.round(results.totalTime)}ms`;
        }
        
        function updateButtons() {
            document.getElementById('runTestsBtn').disabled = isTestRunning;
            document.getElementById('runQuickBtn').disabled = isTestRunning;
            document.getElementById('stopTestsBtn').disabled = !isTestRunning;
            document.getElementById('exportResultsBtn').disabled = !testResults;
        }
        
        // Initialize page
        window.addEventListener('load', () => {
            logToOutput('Integration test runner loaded successfully', 'success');
            logToOutput('System capabilities being detected...', 'info');
            
            // Show basic system info
            logToOutput(`CPU cores: ${navigator.hardwareConcurrency || 'unknown'}`, 'info');
            logToOutput(`Memory: ${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'unknown'}`, 'info');
            logToOutput(`User agent: ${navigator.userAgent}`, 'info');
            
            logToOutput('Ready to run tests!', 'success');
        });
        
        // Auto-run if requested
        if (window.location.search.includes('autorun=true')) {
            window.addEventListener('load', () => {
                setTimeout(() => {
                    runIntegrationTests();
                }, 1000);
            });
        }
    </script>
</body>
</html>
