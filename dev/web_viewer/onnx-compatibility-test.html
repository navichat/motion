<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONNX Compatibility Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .warning { background-color: #fff3cd; color: #856404; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    <h1>🔧 ONNX Compatibility Test</h1>
    <p>This page tests our ONNX Runtime compatibility fixes for wire type 4 errors.</p>
    
    <div id="status-container"></div>
    
    <button class="btn-primary" onclick="testAllModels()">🚀 Test All Models</button>
    <button class="btn-secondary" onclick="testWorkers()">👷 Test Workers</button>
    <button class="btn-secondary" onclick="clearResults()">🧹 Clear Results</button>
    
    <div id="results-container"></div>

    <!-- Include our compatibility fixes -->
    <script src="js/workers/onnx-runtime-fixer.js"></script>
    <script src="onnx-version-manager.js"></script>
    
    <script>
        let testResults = [];
        
        function addStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            container.appendChild(div);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function addResult(title, content, success = true) {
            const container = document.getElementById('results-container');
            const div = document.createElement('div');
            div.innerHTML = `
                <h3>${success ? '✅' : '❌'} ${title}</h3>
                <pre>${content}</pre>
            `;
            container.appendChild(div);
            testResults.push({ title, content, success, timestamp: new Date() });
        }
        
        function clearResults() {
            document.getElementById('results-container').innerHTML = '';
            document.getElementById('status-container').innerHTML = '';
            testResults = [];
            addStatus('Results cleared', 'info');
        }
        
        // Test model loading with compatibility fixes
        async function testModelLoading(modelName, modelPath) {
            addStatus(`Testing ${modelName} model loading...`);
            
            try {
                // First load ONNX Runtime
                await loadONNXRuntime();
                
                // Test with our compatibility fixer
                const session = await ONNXRuntimeFixer.createSession(modelPath);
                
                const result = {
                    model: modelName,
                    path: modelPath,
                    success: true,
                    inputNames: session.inputNames,
                    outputNames: session.outputNames,
                    executionProviders: session.executionProviders || ['unknown']
                };
                
                addResult(`${modelName} Model Loading`, JSON.stringify(result, null, 2), true);
                addStatus(`✅ ${modelName} loaded successfully`, 'success');
                return result;
                
            } catch (error) {
                const result = {
                    model: modelName,
                    path: modelPath,
                    success: false,
                    error: error.message,
                    stack: error.stack
                };
                
                addResult(`${modelName} Model Loading`, JSON.stringify(result, null, 2), false);
                addStatus(`❌ ${modelName} failed: ${error.message}`, 'error');
                return result;
            }
        }
        
        // Test all models
        async function testAllModels() {
            addStatus('Starting comprehensive model test...', 'info');
            
            const models = [
                { name: 'RSMT', path: './models/RSMT/deepphase.onnx' },
                { name: 'DeepMimic', path: './models/DeepMimic/deepmimic.onnx' },
                { name: 'Audio2Gesture', path: './models/Audio2Gesture/audio2gesture.onnx' },
                { name: 'FaceFormer', path: './models/FaceFormer/faceformer.onnx' }
            ];
            
            const results = [];
            let successCount = 0;
            
            for (const model of models) {
                const result = await testModelLoading(model.name, model.path);
                results.push(result);
                if (result.success) successCount++;
                
                // Wait a bit between tests
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            // Summary
            const summary = {
                totalModels: models.length,
                successful: successCount,
                failed: models.length - successCount,
                successRate: `${((successCount / models.length) * 100).toFixed(1)}%`,
                timestamp: new Date().toISOString()
            };
            
            addResult('Test Summary', JSON.stringify(summary, null, 2), successCount === models.length);
            
            if (successCount === models.length) {
                addStatus('🎉 All models loaded successfully!', 'success');
            } else {
                addStatus(`⚠️ ${models.length - successCount} models failed to load`, 'warning');
            }
        }
        
        // Load ONNX Runtime
        async function loadONNXRuntime() {
            if (typeof ort !== 'undefined') {
                addStatus('ONNX Runtime already loaded', 'info');
                return;
            }
            
            addStatus('Loading ONNX Runtime...');
            
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js';
                script.onload = () => {
                    addStatus('✅ ONNX Runtime loaded successfully', 'success');
                    resolve();
                };
                script.onerror = () => {
                    addStatus('❌ Failed to load ONNX Runtime', 'error');
                    reject(new Error('Failed to load ONNX Runtime'));
                };
                document.head.appendChild(script);
            });
        }
        
        // Test workers
        async function testWorkers() {
            addStatus('Testing worker functionality...', 'info');
            
            try {
                const worker = new Worker('js/workers/model-loader-webnn.js');
                
                worker.onmessage = (event) => {
                    const { type, success, data, error } = event.data;
                    
                    if (success) {
                        addResult('Worker Test', `Worker responded successfully:\\n${JSON.stringify(data, null, 2)}`, true);
                        addStatus('✅ Worker test passed', 'success');
                    } else {
                        addResult('Worker Test', `Worker error:\\n${error}`, false);
                        addStatus(`❌ Worker test failed: ${error}`, 'error');
                    }
                };
                
                worker.onerror = (error) => {
                    addResult('Worker Test', `Worker startup error:\\n${error.message}`, false);
                    addStatus(`❌ Worker startup failed: ${error.message}`, 'error');
                };
                
                // Send test message
                worker.postMessage({
                    type: 'load_model',
                    modelType: 'RSMT',
                    complexity: 1
                });
                
                // Timeout after 10 seconds
                setTimeout(() => {
                    worker.terminate();
                    addStatus('⏰ Worker test timed out after 10 seconds', 'warning');
                }, 10000);
                
            } catch (error) {
                addResult('Worker Test', `Worker creation failed:\\n${error.message}`, false);
                addStatus(`❌ Failed to create worker: ${error.message}`, 'error');
            }
        }
        
        // Initialize on page load
        window.addEventListener('load', () => {
            addStatus('🔧 ONNX Compatibility Test initialized', 'info');
            addStatus('Click "Test All Models" to verify the wire type 4 fixes', 'info');
        });
    </script>
</body>
</html>
