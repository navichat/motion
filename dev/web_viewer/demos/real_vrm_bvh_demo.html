<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real VRM Avatar with BVH Animations - Working Demo</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff; 
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans;
    }
    #app { 
      display: grid; 
      grid-template-rows: auto 1fr auto; 
      height: 100%; 
    }
    header, footer { 
      padding: 15px 20px; 
      background: rgba(0, 0, 0, 0.2); 
      backdrop-filter: blur(10px);
    }
    .controls { 
      display: flex; 
      gap: 12px; 
      align-items: center; 
      flex-wrap: wrap;
    }
    .btn { 
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white; 
      border: none; 
      padding: 12px 20px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .btn:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #log { 
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace; 
      font-size: 12px; 
      height: 120px; 
      overflow: auto; 
      background: rgba(0, 0, 0, 0.3); 
      border-radius: 8px; 
      padding: 12px; 
      margin-top: 10px;
    }
    #stage { 
      position: relative; 
      overflow: hidden;
    }
    canvas { 
      display: block; 
      width: 100%; 
      height: 100%; 
    }
    #status {
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
    }
    #performance {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      z-index: 1000;
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-active { background: #4CAF50; }
    .status-inactive { background: #f44336; }
    .status-loading { background: #ff9800; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader": "https://unpkg.com/three@0.159.0/examples/jsm/loaders/GLTFLoader.js",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header>
      <div class="controls">
        <button class="btn" id="btn-load">Load VRM Avatar</button>
        <button class="btn" id="btn-animations" disabled>Load BVH Animations</button>
        <button class="btn" id="btn-idle" disabled>Start Idle Animations</button>
        <button class="btn" id="btn-conversation" disabled>Test Conversation</button>
        <span id="status">Ready to load VRM</span>
      </div>
    </header>
    
    <div id="stage">
      <!-- Performance monitor -->
      <div id="performance">
        <div>FPS: <span id="fps">--</span></div>
        <div>Render: <span id="render-mode">WebGL</span></div>
        <div><span class="status-indicator status-inactive" id="vrm-status"></span>VRM: <span id="vrm-text">Not Loaded</span></div>
        <div><span class="status-indicator status-inactive" id="bvh-status"></span>BVH: <span id="bvh-text">Not Loaded</span></div>
        <div><span class="status-indicator status-inactive" id="anim-status"></span>Animations: <span id="anim-text">Idle</span></div>
      </div>
      <canvas id="c"></canvas>
    </div>
    
    <footer>
      <div id="log"></div>
    </footer>
  </div>

  <!-- Load VRM and BVH Components -->
  <script src="../src/components/animation/vrm/AdvancedVRMLoader.js"></script>
  <script src="../src/components/animation/vrm/VRMBVHAdapter.js"></script>
  <script src="../src/components/animation/timeline/BVHTimeline.js"></script>

  <script type="module">
    import * as THREE from 'three';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader';

    // Global state
    let scene, camera, renderer, vrm, vrmModel, bvhAdapter, bvhTimeline;
    let clock = new THREE.Clock();
    let frameCount = 0;
    let lastTime = performance.now();
    
    // UI elements
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    
    function log(msg) { 
      console.log(msg);
      logEl.innerText += msg + '\n'; 
      logEl.scrollTop = logEl.scrollHeight; 
    }
    function status(msg) { statusEl.textContent = msg; }
    
    function updateStatus(type, state, text) {
      const indicator = document.getElementById(`${type}-status`);
      const textEl = document.getElementById(`${type}-text`);
      
      indicator.className = `status-indicator status-${state}`;
      textEl.textContent = text;
    }

    // Initialize Three.js scene
    const canvas = document.getElementById('c');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight - 200);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight - 200), 0.1, 100);
    camera.position.set(0, 1.6, 3);
    
    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(1, 2, 2);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);
    
    // Create simple classroom
    const floorGeometry = new THREE.PlaneGeometry(10, 10);
    const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    
    // Back wall
    const wallGeometry = new THREE.PlaneGeometry(10, 5);
    const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xE6E6FA });
    const wall = new THREE.Mesh(wallGeometry, wallMaterial);
    wall.position.set(0, 2.5, -3);
    scene.add(wall);

    log('🏫 Simple classroom created');
    log('💡 Lighting setup complete');
    
    // Load VRM Avatar
    async function loadVRMAvatar() {
      status('Loading VRM avatar...');
      updateStatus('vrm', 'loading', 'Loading...');
      
      try {
        log('🎭 Starting VRM avatar loading...');
        
        // Try using AdvancedVRMLoader first
        if (typeof AdvancedVRMLoader !== 'undefined') {
          log('Using AdvancedVRMLoader...');
          const loader = new AdvancedVRMLoader();
          
          const vrmPaths = [
            '../assets/avatars/ichika.vrm',
            '../assets/avatars/buny.vrm',
            '../assets/avatars/kaede.vrm'
          ];
          
          for (const vrmPath of vrmPaths) {
            try {
              log(`Attempting to load: ${vrmPath}`);
              vrmModel = await loader.loadVRMCharacter(vrmPath, scene);
              
              if (vrmModel && vrmModel.vrm) {
                vrm = vrmModel.vrm;
                break;
              }
            } catch (error) {
              log(`❌ Failed to load ${vrmPath}: ${error.message}`);
              continue;
            }
          }
        }
        
        // Fallback to manual VRM loading
        if (!vrm) {
          log('📦 Using manual VRM loading...');
          const loader = new GLTFLoader();
          loader.register((parser) => new VRMLoaderPlugin(parser));
          
          const vrmPaths = [
            '../assets/avatars/ichika.vrm',
            '../assets/avatars/buny.vrm',
            '../assets/avatars/kaede.vrm'
          ];
          
          for (const vrmPath of vrmPaths) {
            try {
              log(`Manually loading: ${vrmPath}`);
              
              const gltf = await new Promise((resolve, reject) => {
                loader.load(vrmPath, resolve, 
                  (progress) => {
                    const percent = (progress.loaded / progress.total * 100).toFixed(1);
                    if (Math.random() < 0.2) log(`📈 Loading progress: ${percent}%`);
                  },
                  reject);
              });
              
              vrm = gltf.userData.vrm;
              if (vrm) {
                await vrm.ready;
                scene.add(vrm.scene);
                vrmModel = { vrm, scene: vrm.scene, gltf };
                break;
              }
            } catch (error) {
              log(`❌ Manual load failed ${vrmPath}: ${error.message}`);
              continue;
            }
          }
        }
        
        if (vrm) {
          // Position VRM in classroom
          vrm.scene.position.set(0, 0, -1);
          vrm.scene.rotation.y = 0;
          
          // Configure VRM
          vrm.scene.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          
          updateStatus('vrm', 'active', 'Loaded');
          status('VRM avatar loaded successfully!');
          log('✅ VRM avatar positioned in classroom');
          
          // Enable animation buttons
          document.getElementById('btn-animations').disabled = false;
          document.getElementById('btn-idle').disabled = false;
          document.getElementById('btn-conversation').disabled = false;
          
          return true;
        } else {
          throw new Error('No VRM could be loaded');
        }
        
      } catch (error) {
        updateStatus('vrm', 'inactive', 'Failed');
        status('VRM loading failed');
        log('❌ VRM loading failed: ' + error.message);
        return false;
      }
    }
    
    // Load BVH Animations
    async function loadBVHAnimations() {
      if (!vrm) {
        log('❌ Load VRM first');
        return false;
      }
      
      status('Loading BVH animations...');
      updateStatus('bvh', 'loading', 'Loading...');
      
      try {
        log('🎬 Loading BVH animation data...');
        
        // Load BVH files
        const bvhPaths = [
          '../assets/bvh/minimal_idle.bvh',
          '../assets/animations/neutral_reference.bvh',
          '../assets/animations/test_neutral.bvh'
        ];
        
        let bvhData = null;
        for (const bvhPath of bvhPaths) {
          try {
            log(`Loading BVH: ${bvhPath}`);
            const response = await fetch(bvhPath);
            if (response.ok) {
              const bvhText = await response.text();
              bvhData = parseBVH(bvhText);
              log(`✅ BVH loaded: ${bvhPath} (${bvhData.bones.length} bones)`);
              break;
            }
          } catch (error) {
            log(`❌ BVH load failed: ${bvhPath}`);
            continue;
          }
        }
        
        // Create minimal BVH if no files loaded
        if (!bvhData) {
          log('📝 Creating minimal BVH skeleton...');
          bvhData = createMinimalBVH();
        }
        
        // Setup VRM-BVH adapter
        if (typeof VRMBVHAdapter !== 'undefined') {
          log('🔧 Setting up VRM-BVH adapter...');
          bvhAdapter = new VRMBVHAdapter(vrmModel, bvhData);
          
          // Enable idle animations
          bvhAdapter.setIdleAnimations({
            breathing: { enabled: true, amplitude: 0.01, frequency: 0.3 },
            blinking: { enabled: true, interval: 3000 },
            headMovement: { enabled: true, amplitude: 0.05, frequency: 0.1 }
          });
          
          // Look at camera
          bvhAdapter.lookAtCameraAsIfHuman(camera);
          
          log('✅ VRM-BVH adapter configured');
        }
        
        // Setup BVH Timeline
        if (typeof BVHTimeline !== 'undefined') {
          log('⏱️ Setting up BVH timeline...');
          const BVHTLCtor = (window.BVHTimeline && window.BVHTimeline.BVHTimeline) || window.BVHTimeline;
          bvhTimeline = new BVHTLCtor({ 
            framerate: 30, 
            lookaheadFrames: 60,
            maxBufferSize: 300 
          });
          log('✅ BVH timeline initialized');
        }
        
        updateStatus('bvh', 'active', 'Loaded');
        status('BVH animations loaded!');
        log('🎉 BVH animation system ready');
        
        return true;
        
      } catch (error) {
        updateStatus('bvh', 'inactive', 'Failed');
        status('BVH loading failed');
        log('❌ BVH loading failed: ' + error.message);
        return false;
      }
    }
    
    // Simple BVH parser
    function parseBVH(bvhText) {
      const lines = bvhText.split('\n');
      const bones = [];
      
      let inHierarchy = false;
      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed === 'HIERARCHY') {
          inHierarchy = true;
          continue;
        }
        if (trimmed === 'MOTION') break;
        if (inHierarchy && (trimmed.startsWith('ROOT') || trimmed.startsWith('JOINT'))) {
          const boneName = trimmed.split(' ')[1];
          bones.push(boneName);
        }
      }
      
      return {
        bones: bones,
        frameRate: 30,
        frames: [],
        skeleton: { 
          bones: bones.map(name => ({ 
            name, 
            parent: name === 'Hips' ? null : 'Hips', 
            position: [0,0,0], 
            rotation: [0,0,0] 
          })) 
        }
      };
    }
    
    // Create minimal BVH skeleton
    function createMinimalBVH() {
      const bones = ['Hips', 'Spine', 'Head', 'LeftArm', 'RightArm', 'LeftLeg', 'RightLeg'];
      return {
        bones: bones,
        frameRate: 30,
        frames: [],
        skeleton: {
          bones: bones.map(name => ({
            name: name,
            parent: name === 'Hips' ? null : 'Hips',
            position: [0, 0, 0],
            rotation: [0, 0, 0]
          }))
        }
      };
    }
    
    // Start idle animations
    function startIdleAnimations() {
      if (!bvhAdapter) {
        log('❌ Load BVH animations first');
        return;
      }
      
      updateStatus('anim', 'active', 'Idle Active');
      status('Idle animations started');
      log('✅ Idle animations activated');
    }
    
    // Test conversation
    function testConversation() {
      if (!vrm) {
        log('❌ Load VRM first');
        return;
      }
      
      updateStatus('anim', 'active', 'Talking');
      status('Testing conversation...');
      log('💬 Ichika: Hello! How are you doing today?');
      
      // Simulate conversation response after a delay
      setTimeout(() => {
        updateStatus('anim', 'active', 'Listening');
        log('🎤 Listening for your response...');
        
        setTimeout(() => {
          updateStatus('anim', 'active', 'Idle');
          status('Conversation test complete');
          log('✅ Conversation test completed');
        }, 3000);
      }, 2000);
    }
    
    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      
      const deltaTime = clock.getDelta();
      
      // Update VRM
      if (vrm) {
        try {
          vrm.update(deltaTime);
        } catch (error) {
          // Ignore VRM update errors
        }
      }
      
      // Update BVH adapter
      if (bvhAdapter) {
        try {
          bvhAdapter.tick(deltaTime);
        } catch (error) {
          // Ignore BVH adapter errors
        }
      }
      
      // Update BVH timeline
      if (bvhTimeline) {
        try {
          bvhTimeline.update(deltaTime);
        } catch (error) {
          // Ignore timeline errors
        }
      }
      
      // Update performance stats
      frameCount++;
      const currentTime = performance.now();
      if (currentTime >= lastTime + 1000) {
        const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
        document.getElementById('fps').textContent = fps;
        frameCount = 0;
        lastTime = currentTime;
      }
      
      // Render
      renderer.render(scene, camera);
    }
    
    // Event listeners
    document.getElementById('btn-load').addEventListener('click', loadVRMAvatar);
    document.getElementById('btn-animations').addEventListener('click', loadBVHAnimations);
    document.getElementById('btn-idle').addEventListener('click', startIdleAnimations);
    document.getElementById('btn-conversation').addEventListener('click', testConversation);
    
    // Handle resize
    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight - 200;
      
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
    
    // Start animation loop
    animate();
    
    log('🚀 Real VRM + BVH system initialized');
    log('📝 Click "Load VRM Avatar" to begin');
  </script>
</body>
</html>
