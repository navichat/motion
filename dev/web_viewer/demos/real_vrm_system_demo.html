<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real VRM System Demo - Ichika 3D Avatar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        #main-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 400px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-active { background: #4CAF50; }
        .status-inactive { background: #f44336; }
        .status-processing { background: #ff9800; }

        #status-display {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #fps-display {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            z-index: 1000;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="scene-container"></div>
        
        <div id="fps-display">
            FPS: <span id="fps-value">0</span><br>
            Render: <span id="render-info">Object</span><br>
            Avatar: <span id="avatar-status">Loading</span><br>
            Conversation: <span id="conversation-status">idle</span>
        </div>

        <div id="ui-overlay">
            <div class="control-group">
                <h3>🎭 Real VRM Avatar System</h3>
                <button id="init-system">Initialize System</button>
                <button id="start-conversation">Start Conversation</button>
                <button id="stop-conversation">Stop Conversation</button>
            </div>

            <div class="control-group">
                <h3>📊 System Status</h3>
                <div>
                    <span class="status-indicator status-inactive" id="status-3d"></span>
                    3D Scene: <span id="status-3d-text">Not Loaded</span>
                </div>
                <div>
                    <span class="status-indicator status-inactive" id="status-avatar"></span>
                    Avatar: <span id="status-avatar-text">Not Loaded</span>
                </div>
                <div>
                    <span class="status-indicator status-inactive" id="status-conversation"></span>
                    Conversation: <span id="status-conversation-text">Not Ready</span>
                </div>
                <div>
                    <span class="status-indicator status-inactive" id="status-speech"></span>
                    Speech Sync: <span id="status-speech-text">Not Ready</span>
                </div>
            </div>

            <div class="control-group">
                <h3>🎤 Voice Controls</h3>
                <button id="test-voice">Test Voice</button>
                <button id="test-animation">Test Animation</button>
                <div style="margin-top: 10px;">
                    <label>
                        <input type="checkbox" id="auto-listen" checked> Auto Listen
                    </label>
                </div>
            </div>

            <div id="status-display">
                <strong>System Log</strong>
                <div id="log-messages"></div>
            </div>
        </div>
    </div>

    <!-- Three.js and VRM Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
        }
    }
    </script>

    <!-- Load Existing VRM Infrastructure in Correct Order -->
    <script src="../src/components/animation/vrm/VRMLoader.js"></script>
    <script src="../src/components/animation/vrm/AdvancedVRMLoader.js"></script>
    <script src="../src/components/animation/vrm/AvatarBinder.js"></script>
    <script src="../src/components/animation/vrm/VRMBVHAdapter.js"></script>
    <script src="../src/components/animation/timeline/BVHTimeline.js"></script>
    <script src="../src/components/animation/vrm/BVHTimelineVRMIntegration.js"></script>
    
    <!-- Scene and Conversation Components -->
    <script src="../src/scene/ClassroomAvatarIntegration.js"></script>
    <script src="../src/core/ConversationManager.js"></script>
    <script src="../src/audio/EnhancedSpeechSync.js"></script>

    <!-- Main Application -->
    <script type="module">
        // Import Three.js and VRM modules
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin } from '@pixiv/three-vrm';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Make modules available globally for the integration components
        window.THREE = THREE;
        window.THREELoaders = { GLTFLoader, VRMLoaderPlugin };
        window.THREE.GLTFLoader = GLTFLoader;
        window.THREE.VRMLoaderPlugin = VRMLoaderPlugin;
        window.THREE.OrbitControls = OrbitControls;

        class RealVRMSystemApp {
            constructor() {
                this.classroomIntegration = null;
                this.conversationManager = null;
                this.speechSync = null;
                
                this.initialized = false;
                this.isConversing = false;
                
                this.ui = {
                    initButton: document.getElementById('init-system'),
                    startButton: document.getElementById('start-conversation'),
                    stopButton: document.getElementById('stop-conversation'),
                    testVoiceButton: document.getElementById('test-voice'),
                    testAnimButton: document.getElementById('test-animation'),
                    logMessages: document.getElementById('log-messages'),
                    fpsValue: document.getElementById('fps-value'),
                    renderInfo: document.getElementById('render-info'),
                    avatarStatus: document.getElementById('avatar-status'),
                    conversationStatus: document.getElementById('conversation-status')
                };
                
                this.setupEventHandlers();
                this.setupFPSDisplay();
                this.log('🚀 Real VRM System App initialized');
            }

            setupEventHandlers() {
                this.ui.initButton.addEventListener('click', () => this.initializeSystem());
                this.ui.startButton.addEventListener('click', () => this.startConversation());
                this.ui.stopButton.addEventListener('click', () => this.stopConversation());
                this.ui.testVoiceButton.addEventListener('click', () => this.testVoice());
                this.ui.testAnimButton.addEventListener('click', () => this.testAnimation());
            }

            setupFPSDisplay() {
                let frameCount = 0;
                let lastTime = performance.now();
                
                const updateFPS = () => {
                    frameCount++;
                    const currentTime = performance.now();
                    
                    if (currentTime >= lastTime + 1000) {
                        const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                        this.ui.fpsValue.textContent = fps;
                        
                        frameCount = 0;
                        lastTime = currentTime;
                    }
                    
                    requestAnimationFrame(updateFPS);
                };
                
                updateFPS();
            }

            async initializeSystem() {
                try {
                    this.log('🔄 Initializing Real VRM System...');
                    this.ui.initButton.disabled = true;
                    this.updateStatus('3d', 'processing');
                    
                    // Initialize Classroom Avatar Integration with existing infrastructure
                    this.classroomIntegration = new ClassroomAvatarIntegration(
                        document.getElementById('scene-container')
                    );
                    
                    this.log('📦 ClassroomAvatarIntegration created');
                    
                    // Initialize 3D scene with VRM avatar using existing infrastructure
                    await this.classroomIntegration.initializeScene();
                    
                    this.log('✅ 3D classroom scene initialized');
                    this.updateStatus('3d', 'active');
                    this.updateStatusText('3d', 'Loaded');
                    this.ui.renderInfo.textContent = 'WebGL';
                    
                    if (this.classroomIntegration.vrmReady) {
                        this.log('✅ Real VRM avatar loaded and ready');
                        this.updateStatus('avatar', 'active');
                        this.updateStatusText('avatar', 'Ready');
                        this.ui.avatarStatus.textContent = 'Ready';
                    } else {
                        this.log('⚠️ VRM avatar not ready');
                        this.ui.avatarStatus.textContent = 'Failed';
                    }
                    
                    // Initialize conversation manager with existing infrastructure
                    if (typeof ConversationManager !== 'undefined') {
                        this.conversationManager = new ConversationManager();
                        await this.conversationManager.initialize();
                        this.log('✅ Conversation manager initialized');
                        this.updateStatus('conversation', 'active');
                        this.updateStatusText('conversation', 'Ready');
                    }
                    
                    // Initialize speech sync with existing infrastructure
                    if (typeof EnhancedSpeechSync !== 'undefined') {
                        this.speechSync = new EnhancedSpeechSync();
                        await this.speechSync.initialize();
                        this.log('✅ Enhanced speech sync initialized');
                        this.updateStatus('speech', 'active');
                        this.updateStatusText('speech', 'Ready');
                    }
                    
                    this.initialized = true;
                    this.ui.startButton.disabled = false;
                    this.ui.testVoiceButton.disabled = false;
                    this.ui.testAnimButton.disabled = false;
                    
                    this.log('🎉 Real VRM System initialization complete!');
                    
                } catch (error) {
                    this.log(`❌ System initialization failed: ${error.message}`);
                    console.error('System initialization error:', error);
                    this.updateStatus('3d', 'inactive');
                    this.ui.initButton.disabled = false;
                }
            }

            async startConversation() {
                if (!this.initialized) {
                    this.log('⚠️ Please initialize system first');
                    return;
                }
                
                try {
                    this.log('🎤 Starting conversation...');
                    this.isConversing = true;
                    this.ui.conversationStatus.textContent = 'listening';
                    
                    if (this.conversationManager) {
                        await this.conversationManager.startListening();
                        this.log('✅ Voice conversation started');
                    }
                    
                    this.ui.startButton.disabled = true;
                    this.ui.stopButton.disabled = false;
                    
                } catch (error) {
                    this.log(`❌ Failed to start conversation: ${error.message}`);
                }
            }

            stopConversation() {
                this.log('🛑 Stopping conversation...');
                this.isConversing = false;
                this.ui.conversationStatus.textContent = 'idle';
                
                if (this.conversationManager) {
                    this.conversationManager.stopListening();
                }
                
                this.ui.startButton.disabled = false;
                this.ui.stopButton.disabled = true;
                this.log('✅ Conversation stopped');
            }

            async testVoice() {
                if (!this.initialized) {
                    this.log('⚠️ Please initialize system first');
                    return;
                }
                
                this.log('🎵 Testing voice system...');
                
                if (this.speechSync && this.classroomIntegration?.vrm) {
                    await this.speechSync.playTestPhrase("Hello! I'm Ichika, your 3D animated VRM avatar assistant.");
                    this.log('✅ Voice test completed');
                } else {
                    this.log('⚠️ Voice system not ready');
                }
            }

            async testAnimation() {
                if (!this.initialized) {
                    this.log('⚠️ Please initialize system first');
                    return;
                }
                
                this.log('💃 Testing animation system...');
                
                if (this.classroomIntegration?.animationsReady) {
                    // Trigger a test animation using BVH timeline
                    this.classroomIntegration.testAnimation();
                    this.log('✅ Animation test started');
                } else {
                    this.log('⚠️ Animation system not ready');
                }
            }

            updateStatus(statusId, state) {
                const indicator = document.getElementById(`status-${statusId}`);
                if (indicator) {
                    indicator.className = `status-indicator status-${state}`;
                }
            }

            updateStatusText(statusId, text) {
                const textElement = document.getElementById(`status-${statusId}-text`);
                if (textElement) {
                    textElement.textContent = text;
                }
            }

            log(message) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = `[${timestamp}] ${message}`;
                console.log(logEntry);
                
                if (this.ui.logMessages) {
                    const div = document.createElement('div');
                    div.textContent = logEntry;
                    this.ui.logMessages.appendChild(div);
                    this.ui.logMessages.scrollTop = this.ui.logMessages.scrollHeight;
                    
                    // Limit log entries to prevent memory issues
                    while (this.ui.logMessages.children.length > 50) {
                        this.ui.logMessages.removeChild(this.ui.logMessages.firstChild);
                    }
                }
            }
        }

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            window.realVRMApp = new RealVRMSystemApp();
        });
        
    </script>
</body>
</html>
