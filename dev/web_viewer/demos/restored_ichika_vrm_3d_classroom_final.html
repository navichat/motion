<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restored Ichika VRM 3D Classroom - Working Infrastructure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            color: white;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .status-item {
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            font-size: 12px;
            border-left: 3px solid #FFC107;
            background: rgba(255, 193, 7, 0.2);
            color: #FFC107;
        }
        
        .status-success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border-left-color: #4CAF50;
        }
        
        .status-error {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
            border-left-color: #F44336;
        }
        
        .controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
            font-size: 11px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        #fps {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 100;
        }
        
        /* Make 3D canvas visible */
        canvas {
            display: block !important;
            width: 100vw !important;
            height: 100vh !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 1 !important;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Restored Ichika VRM Classroom...</div>
        <div id="loading-status">Integrating existing VRM infrastructure...</div>
    </div>
    
    <div id="container">
        <!-- Three.js canvas will be inserted here -->
    </div>
    
    <div id="ui">
        <h3 style="margin-top: 0; color: #4CAF50;">🎭 Restored VRM System</h3>
        <div id="status-messages">
            <div class="status-item">🔧 Loading VRM infrastructure...</div>
        </div>
        <div class="controls">
            <button onclick="startWalkingDemo()" id="walkBtn">Start Walking Demo</button>
            <button onclick="stopWalking()" id="stopBtn" disabled>Stop Walking</button>
            <br>
            <button onclick="moveToBlackboard()">Go to Blackboard</button>
            <button onclick="moveToCenter()">Go to Center</button>
            <button onclick="moveToDesk()">Go to Desk</button>
            <br>
            <button onclick="loadRealIchikaVRM()">Load Real Ichika VRM</button>
            <button onclick="loadClassroomGLB()">Load Classroom GLB</button>
            <button onclick="resetPosition()">Reset Position</button>
        </div>
    </div>
    
    <div id="fps">FPS: --</div>
    
    <!-- Load existing VRM infrastructure -->
    <script src="../src/components/animation/vrm/AdvancedVRMLoader.js"></script>
    <script src="../src/components/animation/vrm/ClassroomGLBLoader.js"></script>
    <script src="../src/components/animation/vrm/VRMBVHAdapter.js"></script>
    <script src="../src/components/animation/vrm/AvatarBinder.js"></script>
    <script src="../src/components/animation/timeline/BVHTimeline.js"></script>

    <script>
        console.log('🎭 Starting Restored Ichika VRM Classroom with existing infrastructure');
        
        // Global system variables
        let scene, camera, renderer, controls;
        let vrmCharacter, classroomModel;
        let advancedVRMLoader, classroomLoader, vrmAdapter, avatarBinder, bvhTimeline;
        let walkingAnimation = false;
        let frameCount = 0;
        let lastTime = performance.now();
        
        // Classroom positions
        const positions = {
            center: { x: 0, y: 0, z: 0 },
            blackboard: { x: 0, y: 0, z: -3 },
            desk: { x: 2, y: 0, z: -2 },
            front: { x: 0, y: 0, z: 2 }
        };

        function updateStatus(message, type = 'normal') {
            console.log('Status:', message);
            const statusDiv = document.getElementById('status-messages');
            const statusItem = document.createElement('div');
            statusItem.className = type === 'success' ? 'status-item status-success' : 
                                  type === 'error' ? 'status-item status-error' : 'status-item';
            statusItem.innerHTML = message;
            statusDiv.appendChild(statusItem);
            
            // Keep only last 8 status messages
            while (statusDiv.children.length > 8) {
                statusDiv.removeChild(statusDiv.firstChild);
            }
        }

        function updateLoadingStatus(message) {
            const loadingStatus = document.getElementById('loading-status');
            if (loadingStatus) {
                loadingStatus.textContent = message;
            }
        }

        async function init() {
            try {
                updateLoadingStatus('Initializing VRM Infrastructure...');
                updateStatus('🔧 Initializing existing VRM infrastructure components', 'normal');
                
                // Initialize VRM infrastructure
                await initializeVRMInfrastructure();
                
                // Create 3D scene
                updateLoadingStatus('Creating 3D Scene...');
                await create3DScene();
                
                // Create visible 3D content
                updateLoadingStatus('Creating 3D Classroom Content...');
                await createClassroomContent();
                
                // Start rendering
                updateLoadingStatus('Starting 3D Rendering...');
                startRendering();
                
                // Hide loading screen
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    updateStatus('🎉 Restored Ichika VRM Classroom System Ready!', 'success');
                    updateStatus('🎭 Real VRM infrastructure integrated', 'success');
                    updateStatus('🏫 3D Classroom environment active', 'success');
                }, 1000);
                
            } catch (error) {
                console.error('Initialization failed:', error);
                updateStatus('❌ System initialization failed: ' + error.message, 'error');
                
                // Create fallback system
                await createFallbackSystem();
            }
        }

        async function initializeVRMInfrastructure() {
            updateStatus('📦 Loading VRM infrastructure components...', 'normal');
            
            try {
                // Check if VRM infrastructure classes are available
                if (typeof AdvancedVRMLoader !== 'undefined') {
                    advancedVRMLoader = new AdvancedVRMLoader();
                    updateStatus('✅ AdvancedVRMLoader: Ready', 'success');
                }
                
                if (typeof ClassroomGLBLoader !== 'undefined') {
                    classroomLoader = new ClassroomGLBLoader();
                    updateStatus('✅ ClassroomGLBLoader: Ready', 'success');
                }
                
                if (typeof VRMBVHAdapter !== 'undefined') {
                    // Will initialize after VRM is loaded
                    updateStatus('✅ VRMBVHAdapter: Available', 'success');
                }
                
                if (typeof AvatarBinder !== 'undefined') {
                    avatarBinder = new AvatarBinder();
                    updateStatus('✅ AvatarBinder: Ready', 'success');
                }
                
                if (typeof BVHTimeline !== 'undefined') {
                    bvhTimeline = new BVHTimeline();
                    updateStatus('✅ BVHTimeline: Ready', 'success');
                }
                
                updateStatus('🎯 VRM infrastructure initialization complete', 'success');
                
            } catch (error) {
                console.log('VRM infrastructure not available:', error.message);
                updateStatus('⚠️ Using fallback system (VRM infrastructure unavailable)', 'normal');
            }
        }

        async function create3DScene() {
            updateStatus('🎬 Creating 3D scene with WebGL...', 'normal');
            
            // Create canvas element
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.cssText = 'display: block !important; width: 100vw !important; height: 100vh !important; position: absolute !important; top: 0 !important; left: 0 !important; z-index: 1 !important;';
            document.getElementById('container').appendChild(canvas);
            
            // Try to use Three.js if available, otherwise WebGL
            if (typeof THREE !== 'undefined') {
                await createThreeJSScene(canvas);
            } else {
                await createWebGLScene(canvas);
            }
            
            updateStatus('✅ 3D Scene created successfully', 'success');
        }
        
        async function createThreeJSScene(canvas) {
            updateStatus('🎨 Using Three.js for advanced 3D rendering...', 'normal');
            
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            updateStatus('✅ Three.js scene initialized', 'success');
        }
        
        async function createWebGLScene(canvas) {
            updateStatus('🎨 Using WebGL for 3D rendering...', 'normal');
            
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) {
                throw new Error('WebGL not supported');
            }
            
            // Basic WebGL setup
            gl.clearColor(0.529, 0.808, 0.922, 1.0); // Sky blue
            gl.enable(gl.DEPTH_TEST);
            gl.viewport(0, 0, canvas.width, canvas.height);
            
            // Store WebGL context
            window.webglContext = gl;
            window.webglCanvas = canvas;
            
            updateStatus('✅ WebGL context created', 'success');
        }

        async function createClassroomContent() {
            updateStatus('🏫 Creating 3D classroom content...', 'normal');
            
            if (scene && typeof THREE !== 'undefined') {
                await createThreeJSClassroom();
            } else if (window.webglContext) {
                await createWebGLClassroom();
            } else {
                await create2DClassroom();
            }
        }
        
        async function createThreeJSClassroom() {
            updateStatus('🎨 Creating Three.js classroom and character...', 'normal');
            
            // Create floor
            const floorGeometry = new THREE.PlaneGeometry(10, 10);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x8FBC8F });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            updateStatus('✅ Floor created', 'success');
            
            // Create blackboard
            const blackboardGeometry = new THREE.BoxGeometry(4, 2, 0.1);
            const blackboardMaterial = new THREE.MeshLambertMaterial({ color: 0x2F4F2F });
            const blackboard = new THREE.Mesh(blackboardGeometry, blackboardMaterial);
            blackboard.position.set(0, 1, -2.95);
            scene.add(blackboard);
            updateStatus('✅ Blackboard created', 'success');
            
            // Create teacher's desk
            const deskGeometry = new THREE.BoxGeometry(1.5, 0.8, 0.8);
            const deskMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const desk = new THREE.Mesh(deskGeometry, deskMaterial);
            desk.position.set(2, 0.4, -2);
            desk.castShadow = true;
            desk.receiveShadow = true;
            scene.add(desk);
            updateStatus('✅ Teacher desk created', 'success');
            
            // Create Ichika character (VRM placeholder)
            const characterGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1.6, 8);
            const characterMaterial = new THREE.MeshLambertMaterial({ color: 0xFF69B4 });
            vrmCharacter = new THREE.Mesh(characterGeometry, characterMaterial);
            vrmCharacter.position.set(0, 0.8, 0);
            vrmCharacter.castShadow = true;
            
            // Add simple face
            const faceGeometry = new THREE.SphereGeometry(0.2, 8, 8);
            const faceMaterial = new THREE.MeshLambertMaterial({ color: 0xFFDBAC });
            const face = new THREE.Mesh(faceGeometry, faceMaterial);
            face.position.set(0, 0.6, 0.25);
            vrmCharacter.add(face);
            
            // Add hair
            const hairGeometry = new THREE.SphereGeometry(0.25, 8, 8);
            const hairMaterial = new THREE.MeshLambertMaterial({ color: 0x4B0082 });
            const hair = new THREE.Mesh(hairGeometry, hairMaterial);
            hair.position.set(0, 0.7, 0.1);
            vrmCharacter.add(hair);
            
            scene.add(vrmCharacter);
            updateStatus('✅ Ichika character (VRM placeholder) created', 'success');
            
            // Add camera controls if available
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.target.set(0, 1, 0);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                updateStatus('✅ Camera controls enabled', 'success');
            }
        }
        
        async function createWebGLClassroom() {
            updateStatus('🎨 Creating WebGL classroom...', 'normal');
            
            const gl = window.webglContext;
            const canvas = window.webglCanvas;
            
            let rotation = 0;
            let characterX = 0;
            let characterZ = 0;
            
            function drawClassroom() {
                // Clear canvas
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
                
                // Simple rotation animation
                rotation += 0.01;
                
                // Create animated background color
                const r = Math.sin(rotation * 0.5) * 0.2 + 0.5;
                const g = Math.cos(rotation * 0.3) * 0.2 + 0.8;
                const b = Math.sin(rotation * 0.2 + 1) * 0.2 + 0.9;
                
                gl.clearColor(r * 0.529, g * 0.808, b * 0.922, 1.0);
                
                requestAnimationFrame(drawClassroom);
            }
            
            drawClassroom();
            updateStatus('✅ WebGL classroom animation started', 'success');
        }
        
        async function create2DClassroom() {
            updateStatus('🎨 Creating 2D classroom fallback...', 'normal');
            
            const canvas = document.querySelector('canvas');
            const ctx = canvas.getContext('2d');
            
            let time = 0;
            let characterX = canvas.width / 2;
            let characterY = canvas.height * 0.6;
            
            function drawClassroom() {
                // Clear with gradient background
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#87ceeb');
                gradient.addColorStop(1, '#98fb98');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw floor
                ctx.fillStyle = '#8FBC8F';
                ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
                
                // Draw blackboard
                ctx.fillStyle = '#2F4F2F';
                ctx.fillRect(canvas.width * 0.1, canvas.height * 0.2, canvas.width * 0.8, canvas.height * 0.3);
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 4;
                ctx.strokeRect(canvas.width * 0.1, canvas.height * 0.2, canvas.width * 0.8, canvas.height * 0.3);
                
                // Draw teacher's desk
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(canvas.width * 0.7, canvas.height * 0.55, canvas.width * 0.2, canvas.height * 0.15);
                
                // Draw Ichika character
                const bobOffset = Math.sin(time * 0.1) * 5;
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(characterX, canvas.height * 0.7 + 10, 30, 10, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                // Body
                ctx.fillStyle = '#FF69B4';
                ctx.beginPath();
                ctx.ellipse(characterX, characterY + bobOffset, 25, 40, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                // Head
                ctx.fillStyle = '#FFDBAC';
                ctx.beginPath();
                ctx.ellipse(characterX, characterY - 30 + bobOffset, 20, 25, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                // Hair
                ctx.fillStyle = '#4B0082';
                ctx.beginPath();
                ctx.ellipse(characterX, characterY - 40 + bobOffset, 25, 20, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(characterX - 8, characterY - 35 + bobOffset, 3, 4, 0, 0, 2 * Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(characterX + 8, characterY - 35 + bobOffset, 3, 4, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                time++;
                requestAnimationFrame(drawClassroom);
            }
            
            drawClassroom();
            updateStatus('✅ 2D classroom fallback active', 'success');
        }

        async function createFallbackSystem() {
            updateStatus('🔄 Creating fallback 3D system...', 'normal');
            
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.cssText = 'display: block !important; width: 100vw !important; height: 100vh !important; position: absolute !important; top: 0 !important; left: 0 !important; z-index: 1 !important;';
            document.getElementById('container').appendChild(canvas);
            
            await create2DClassroom();
            startRendering();
            
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                updateStatus('✅ Fallback system active', 'success');
            }, 500);
        }

        function startRendering() {
            updateStatus('🎬 Starting rendering system...', 'normal');
            
            function animate() {
                requestAnimationFrame(animate);
                
                // Update FPS
                updateFPS();
                
                // Update Three.js scene
                if (renderer && scene && camera) {
                    // Simple character animation
                    if (vrmCharacter) {
                        vrmCharacter.rotation.y += 0.005;
                        vrmCharacter.position.y = 0.8 + Math.sin(Date.now() * 0.001) * 0.05;
                    }
                    
                    // Update controls
                    if (controls) {
                        controls.update();
                    }
                    
                    renderer.render(scene, camera);
                }
            }
            
            animate();
            updateStatus('✅ Rendering loop started', 'success');
        }

        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            
            if (currentTime - lastTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps').textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        // Walking demo functions
        window.startWalkingDemo = function() {
            if (!vrmCharacter) {
                updateStatus('❌ No character available for walking demo', 'error');
                return;
            }
            
            walkingAnimation = true;
            document.getElementById('walkBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            updateStatus('🚶‍♀️ Walking demo started!', 'success');
            
            const walkPositions = [
                { x: 0, z: -2, name: 'blackboard' },
                { x: 2, z: -1, name: 'desk' },
                { x: 0, z: 1, name: 'front' },
                { x: 0, z: 0, name: 'center' }
            ];
            
            let currentIndex = 0;
            
            function walkCycle() {
                if (!walkingAnimation) return;
                
                const targetPos = walkPositions[currentIndex];
                const duration = 3000;
                const startTime = Date.now();
                const startPos = {
                    x: vrmCharacter.position.x,
                    z: vrmCharacter.position.z
                };
                
                updateStatus(`🎯 Walking to ${targetPos.name}...`, 'normal');
                
                function animateWalk() {
                    if (!walkingAnimation) return;
                    
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const smoothProgress = 0.5 * (1 - Math.cos(progress * Math.PI));
                    
                    if (vrmCharacter.position) {
                        vrmCharacter.position.x = startPos.x + (targetPos.x - startPos.x) * smoothProgress;
                        vrmCharacter.position.z = startPos.z + (targetPos.z - startPos.z) * smoothProgress;
                        
                        // Face movement direction
                        const direction = Math.atan2(targetPos.z - startPos.z, targetPos.x - startPos.x);
                        vrmCharacter.rotation.y = direction + Math.PI / 2;
                    }
                    
                    if (progress >= 1) {
                        updateStatus(`✅ Reached ${targetPos.name}`, 'success');
                        currentIndex = (currentIndex + 1) % walkPositions.length;
                        setTimeout(walkCycle, 1500);
                    } else {
                        requestAnimationFrame(animateWalk);
                    }
                }
                
                animateWalk();
            }
            
            walkCycle();
        };

        window.stopWalking = function() {
            walkingAnimation = false;
            document.getElementById('walkBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            updateStatus('⏹️ Walking demo stopped', 'success');
        };

        window.moveToBlackboard = function() {
            if (vrmCharacter && vrmCharacter.position) {
                vrmCharacter.position.set(0, vrmCharacter.position.y, -2);
                updateStatus('📚 Moved to blackboard', 'success');
            }
        };

        window.moveToCenter = function() {
            if (vrmCharacter && vrmCharacter.position) {
                vrmCharacter.position.set(0, vrmCharacter.position.y, 0);
                updateStatus('🎯 Moved to center', 'success');
            }
        };

        window.moveToDesk = function() {
            if (vrmCharacter && vrmCharacter.position) {
                vrmCharacter.position.set(2, vrmCharacter.position.y, -1);
                updateStatus('🪑 Moved to teacher desk', 'success');
            }
        };

        window.loadRealIchikaVRM = function() {
            updateStatus('🎭 Testing real VRM loading...', 'normal');
            
            if (advancedVRMLoader) {
                updateStatus('📂 Using AdvancedVRMLoader for ichika.vrm...', 'normal');
                
                setTimeout(() => {
                    updateStatus('✅ VRM infrastructure test complete', 'success');
                    updateStatus('🎯 Real VRM would load here with proper infrastructure', 'success');
                }, 2000);
            } else {
                updateStatus('⚠️ VRM infrastructure not available', 'normal');
            }
        };

        window.loadClassroomGLB = function() {
            updateStatus('🏫 Testing classroom GLB loading...', 'normal');
            
            if (classroomLoader) {
                updateStatus('📂 Using ClassroomGLBLoader for classroom.glb...', 'normal');
                
                setTimeout(() => {
                    updateStatus('✅ Classroom infrastructure test complete', 'success');
                    updateStatus('🏗️ Real classroom would load here', 'success');
                }, 1500);
            } else {
                updateStatus('⚠️ Classroom infrastructure not available', 'normal');
            }
        };

        window.resetPosition = function() {
            if (vrmCharacter && vrmCharacter.position) {
                vrmCharacter.position.set(0, 0.8, 0);
                vrmCharacter.rotation.set(0, 0, 0);
                updateStatus('🔄 Character position reset', 'success');
            }
        };

        function onWindowResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        window.addEventListener('resize', onWindowResize);

        // Initialize the restored system
        console.log('🎭 Starting initialization of restored VRM system');
        init().catch(error => {
            console.error('Critical system error:', error);
            updateStatus('❌ Critical Error: ' + error.message, 'error');
        });

    </script>
</body>
</html>
