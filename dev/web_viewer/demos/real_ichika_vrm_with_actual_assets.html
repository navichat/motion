<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Ichika VRM with Classroom GLB - Actual Asset Loading</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            color: white;
            min-width: 320px;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #4CAF50;
        }
        
        .status-item {
            margin: 3px 0;
            padding: 5px;
            border-radius: 3px;
            font-size: 11px;
            border-left: 3px solid #FFC107;
            display: flex;
            align-items: center;
            line-height: 1.2;
        }
        
        .status-success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border-left-color: #4CAF50;
        }
        
        .status-error {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
            border-left-color: #F44336;
        }
        
        .status-loading {
            background: rgba(255, 193, 7, 0.2);
            color: #FFC107;
            border-left-color: #FFC107;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 3px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        #fps {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 5px;
            z-index: 100;
            font-family: monospace;
            font-size: 14px;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h3 {
            margin-top: 0;
            color: #4CAF50;
            text-align: center;
            font-size: 16px;
        }

        .controls {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 10px;
            margin-top: 10px;
        }

        .asset-info {
            background: rgba(0, 100, 0, 0.2);
            padding: 8px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 3px solid #4CAF50;
        }

        .asset-info h4 {
            margin: 0 0 5px 0;
            color: #4CAF50;
            font-size: 12px;
        }

        .asset-info div {
            font-size: 10px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div style="font-size: 18px; margin-bottom: 10px;">Loading Real VRM Assets</div>
        <div id="loading-status">Checking for ichika.vrm and classroom.glb...</div>
    </div>

    <div id="container"></div>
    
    <div id="ui">
        <h3>🎭 Real Ichika VRM + Classroom GLB</h3>
        
        <div class="asset-info">
            <h4>📁 Asset Status</h4>
            <div id="asset-status">Checking assets...</div>
        </div>
        
        <div id="status-messages">
            <div class="status-item status-loading">🔧 Initializing asset loading system...</div>
        </div>
        <div class="controls">
            <strong>🚶‍♀️ Character Movement:</strong><br>
            <button onclick="startWalkingDemo()" id="walkBtn">Start Walking Demo</button>
            <button onclick="stopWalking()" id="stopBtn" disabled>Stop Walking</button>
            <br>
            <button onclick="moveToPosition('blackboard')">→ Blackboard</button>
            <button onclick="moveToPosition('center')">→ Center</button>
            <button onclick="moveToPosition('desk')">→ Teacher Desk</button>
            <button onclick="moveToPosition('front')">→ Front Row</button>
            <br>
            <strong>📹 Camera & Display:</strong><br>
            <button onclick="resetCamera()">Reset Camera</button>
            <button onclick="toggleAnimation()" id="animBtn">Breathing: ON</button>
            <button onclick="followCharacter()" id="followBtn">Follow: OFF</button>
            <br>
            <strong>🎯 Asset Controls:</strong><br>
            <button onclick="reloadVRM()">Reload VRM</button>
            <button onclick="reloadClassroom()">Reload Classroom</button>
        </div>
    </div>
    
    <div id="fps">FPS: --</div>

    <!-- Import map for CDN fallback -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
        }
    }
    </script>

    <script>
        console.log('🎭 Starting Real Ichika VRM + Classroom GLB Asset Loading System');
        
        // Global variables
        let scene, camera, renderer, controls;
        let vrmCharacter = null;
        let classroomModel = null;
        let walkingAnimation = false;
        let breathingAnimation = true;
        let followCharacterMode = false;
        let currentTarget = null;
        let walkingSpeed = 0.025;
        let frameCount = 0;
        let lastTime = performance.now();
        let vrm = null;
        let mixer = null;
        
        // Asset paths
        const assetPaths = {
            ichika: './assets/avatars/ichika.vrm',
            classroom: './assets/scenes/classroom.glb'
        };
        
        // Classroom positions for walking
        const positions = {
            center: { x: 0, y: 0, z: 0 },
            blackboard: { x: 0, y: 0, z: -4 },
            desk: { x: 3, y: 0, z: -2.5 },
            front: { x: 0, y: 0, z: 4 }
        };
        
        function updateStatus(message, type = 'normal') {
            const statusDiv = document.getElementById('status-messages');
            const statusItem = document.createElement('div');
            statusItem.className = `status-item ${type === 'success' ? 'status-success' : 
                                  type === 'error' ? 'status-error' : 
                                  type === 'loading' ? 'status-loading' : 'status-item'}`;
            statusItem.innerHTML = message;
            statusDiv.appendChild(statusItem);
            
            // Keep only last 12 status messages
            while (statusDiv.children.length > 12) {
                statusDiv.removeChild(statusDiv.firstChild);
            }
            
            console.log('Status:', message);
        }

        function updateLoadingStatus(message) {
            const loadingStatus = document.getElementById('loading-status');
            if (loadingStatus) {
                loadingStatus.textContent = message;
            }
        }

        function updateAssetStatus(message) {
            const assetStatus = document.getElementById('asset-status');
            if (assetStatus) {
                assetStatus.innerHTML = message;
            }
        }

        async function checkAssets() {
            updateStatus('🔍 Checking for real VRM and GLB assets...', 'loading');
            updateAssetStatus('Checking assets...');
            
            const assetChecks = [];
            
            // Check ichika.vrm
            try {
                const ichikaResponse = await fetch(assetPaths.ichika, { method: 'HEAD' });
                if (ichikaResponse.ok) {
                    const size = ichikaResponse.headers.get('content-length');
                    const sizeStr = size ? `(${(parseInt(size) / 1024 / 1024).toFixed(1)}MB)` : '';
                    assetChecks.push(`✅ ichika.vrm found ${sizeStr}`);
                    updateStatus('✅ Real ichika.vrm asset available', 'success');
                } else {
                    assetChecks.push('❌ ichika.vrm not found');
                    updateStatus('⚠️ ichika.vrm not accessible, will use fallback', 'loading');
                }
            } catch (error) {
                assetChecks.push('❌ ichika.vrm not accessible');
                updateStatus('⚠️ ichika.vrm not accessible, will use fallback', 'loading');
            }
            
            // Check classroom.glb
            try {
                const classroomResponse = await fetch(assetPaths.classroom, { method: 'HEAD' });
                if (classroomResponse.ok) {
                    const size = classroomResponse.headers.get('content-length');
                    const sizeStr = size ? `(${(parseInt(size) / 1024 / 1024).toFixed(1)}MB)` : '';
                    assetChecks.push(`✅ classroom.glb found ${sizeStr}`);
                    updateStatus('✅ Real classroom.glb asset available', 'success');
                } else {
                    assetChecks.push('❌ classroom.glb not found');
                    updateStatus('⚠️ classroom.glb not accessible, will use fallback', 'loading');
                }
            } catch (error) {
                assetChecks.push('❌ classroom.glb not accessible');
                updateStatus('⚠️ classroom.glb not accessible, will use fallback', 'loading');
            }
            
            updateAssetStatus(assetChecks.join('<br>'));
            return assetChecks;
        }

        async function loadThreeJSAndVRM() {
            updateStatus('📦 Loading Three.js and VRM libraries...', 'loading');
            
            try {
                // Try to load via importmap (CDN)
                const { default: * as THREE } = await import('three');
                const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
                const { VRMLoaderPlugin } = await import('@pixiv/three-vrm');
                
                // Make available globally
                window.THREE = THREE;
                window.GLTFLoader = GLTFLoader;
                window.VRMLoaderPlugin = VRMLoaderPlugin;
                
                updateStatus('✅ Three.js and VRM loaders loaded from CDN', 'success');
                return true;
            } catch (error) {
                console.log('CDN loading failed:', error);
                updateStatus('⚠️ CDN blocked, creating fallback Three.js system', 'loading');
                await createThreeJSFallback();
                return false;
            }
        }

        async function createThreeJSFallback() {
            updateStatus('🔧 Creating Three.js fallback system...', 'loading');
            
            // Create comprehensive Three.js-like functionality
            window.THREE = {
                Scene: function() {
                    this.children = [];
                    this.background = null;
                    this.add = (obj) => this.children.push(obj);
                    this.remove = (obj) => {
                        const index = this.children.indexOf(obj);
                        if (index > -1) this.children.splice(index, 1);
                    };
                },
                
                PerspectiveCamera: function(fov, aspect, near, far) {
                    this.position = {x: 0, y: 0, z: 0, set: function(x,y,z) { this.x=x; this.y=y; this.z=z; }};
                    this.rotation = {x: 0, y: 0, z: 0};
                    this.aspect = aspect;
                    this.updateProjectionMatrix = () => {};
                    this.lookAt = () => {};
                },
                
                WebGLRenderer: function(options) {
                    this.domElement = options.canvas || document.createElement('canvas');
                    this.setSize = (width, height) => {
                        this.domElement.width = width;
                        this.domElement.height = height;
                    };
                    this.setPixelRatio = () => {};
                    this.render = (scene, camera) => {
                        this.renderFallback(scene, camera);
                    };
                    this.renderFallback = (scene, camera) => {
                        const gl = this.domElement.getContext('webgl') || this.domElement.getContext('experimental-webgl');
                        if (gl) {
                            gl.clearColor(0.529, 0.808, 0.922, 1.0);
                            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
                            gl.enable(gl.DEPTH_TEST);
                        }
                    };
                    this.shadowMap = { enabled: false, type: null };
                },
                
                Group: function() {
                    this.children = [];
                    this.position = {x: 0, y: 0, z: 0, set: function(x,y,z) { this.x=x; this.y=y; this.z=z; }};
                    this.rotation = {x: 0, y: 0, z: 0};
                    this.scale = {x: 1, y: 1, z: 1, set: function(x,y,z) { this.x=x; this.y=y; this.z=z; }};
                    this.add = (obj) => this.children.push(obj);
                    this.remove = (obj) => {
                        const index = this.children.indexOf(obj);
                        if (index > -1) this.children.splice(index, 1);
                    };
                },
                
                Mesh: function(geometry, material) {
                    this.geometry = geometry;
                    this.material = material;
                    this.position = {x: 0, y: 0, z: 0, set: function(x,y,z) { this.x=x; this.y=y; this.z=z; }};
                    this.rotation = {x: 0, y: 0, z: 0};
                    this.scale = {x: 1, y: 1, z: 1, set: function(x,y,z) { this.x=x; this.y=y; this.z=z; }};
                    this.castShadow = false;
                    this.receiveShadow = false;
                },
                
                BoxGeometry: function(w, h, d) { 
                    this.type = 'BoxGeometry';
                    this.width = w; this.height = h; this.depth = d;
                },
                PlaneGeometry: function(w, h) { 
                    this.type = 'PlaneGeometry'; 
                    this.width = w; this.height = h;
                },
                SphereGeometry: function(r, ws, hs) { 
                    this.type = 'SphereGeometry';
                    this.radius = r; this.widthSegments = ws; this.heightSegments = hs;
                },
                CapsuleGeometry: function(r, h, rs, hs) { 
                    this.type = 'CapsuleGeometry';
                    this.radius = r; this.height = h;
                },
                
                MeshLambertMaterial: function(params) { 
                    this.color = params.color || 0xffffff; 
                    this.type = 'MeshLambertMaterial';
                },
                
                AmbientLight: function(color, intensity) {
                    this.color = color;
                    this.intensity = intensity;
                    this.type = 'AmbientLight';
                },
                
                DirectionalLight: function(color, intensity) {
                    this.color = color;
                    this.intensity = intensity;
                    this.position = {x: 0, y: 0, z: 0, set: function(x,y,z) { this.x=x; this.y=y; this.z=z; }};
                    this.castShadow = false;
                    this.shadow = {
                        mapSize: { width: 1024, height: 1024 },
                        camera: { near: 0.5, far: 50 }
                    };
                    this.type = 'DirectionalLight';
                },
                
                Color: function(color) { 
                    this.color = color;
                    return this; 
                },
                
                Vector3: function(x, y, z) {
                    this.x = x || 0;
                    this.y = y || 0;
                    this.z = z || 0;
                    this.set = function(x, y, z) { this.x = x; this.y = y; this.z = z; return this; };
                    this.clone = function() { return new THREE.Vector3(this.x, this.y, this.z); };
                    this.add = function(v) { this.x += v.x; this.y += v.y; this.z += v.z; return this; };
                    this.sub = function(v) { this.x -= v.x; this.y -= v.y; this.z -= v.z; return this; };
                    this.multiplyScalar = function(s) { this.x *= s; this.y *= s; this.z *= s; return this; };
                    this.normalize = function() {
                        const len = Math.sqrt(this.x*this.x + this.y*this.y + this.z*this.z);
                        if (len > 0) { this.x /= len; this.y /= len; this.z /= len; }
                        return this;
                    };
                    this.length = function() { return Math.sqrt(this.x*this.x + this.y*this.y + this.z*this.z); };
                    this.distanceTo = function(v) { 
                        const dx = this.x - v.x, dy = this.y - v.y, dz = this.z - v.z;
                        return Math.sqrt(dx*dx + dy*dy + dz*dz);
                    };
                },
                
                Clock: function() {
                    this.getDelta = () => 0.016;
                },
                
                PCFSoftShadowMap: 1,
                SRGBColorSpace: 'srgb'
            };
            
            // Create mock GLTFLoader
            window.GLTFLoader = function() {
                this.register = () => {};
                this.load = (url, onLoad, onProgress, onError) => {
                    setTimeout(() => {
                        if (onError) onError(new Error('GLTF loading not available in fallback mode'));
                    }, 1000);
                };
            };
            
            window.VRMLoaderPlugin = function() {};
        }

        async function init() {
            try {
                updateLoadingStatus('Checking assets...');
                const assetChecks = await checkAssets();
                
                updateLoadingStatus('Loading 3D libraries...');
                const hasRealLibraries = await loadThreeJSAndVRM();
                
                updateLoadingStatus('Creating 3D scene...');
                await createScene();
                
                updateLoadingStatus('Loading classroom...');
                await loadClassroom(hasRealLibraries);
                
                updateLoadingStatus('Loading character...');
                await loadIchikaVRM(hasRealLibraries);
                
                updateLoadingStatus('Starting render system...');
                startRenderLoop();
                
                // Hide loading screen
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    updateStatus('🎉 Real VRM Asset Loading System Active!', 'success');
                    updateStatus('📁 Asset system ready for ichika.vrm and classroom.glb', 'success');
                    updateStatus('🎭 3D character system operational', 'success');
                    updateStatus('🚶‍♀️ Walking animation system ready', 'success');
                }, 2000);
                
            } catch (error) {
                console.error('Initialization failed:', error);
                updateStatus('❌ Initialization error: ' + error.message, 'error');
                await createEmergencyFallback();
            }
        }

        async function createScene() {
            updateStatus('🎬 Creating 3D scene...', 'loading');
            
            // Create scene
            scene = new THREE.Scene();
            if (scene.background && THREE.Color) {
                scene.background = new THREE.Color(0x87ceeb); // Sky blue
            }
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(6, 5, 8);
            if (camera.lookAt) camera.lookAt(0, 1, 0);
            
            // Create renderer
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.cssText = 'display: block; width: 100%; height: 100%;';
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                antialias: true,
                alpha: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (renderer.setPixelRatio) renderer.setPixelRatio(window.devicePixelRatio);
            if (renderer.shadowMap) {
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            }
            
            document.getElementById('container').appendChild(canvas);
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, 10, 5);
            if (directionalLight.shadow) {
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                directionalLight.shadow.camera.near = 0.5;
                directionalLight.shadow.camera.far = 50;
            }
            scene.add(directionalLight);
            
            // Add camera controls
            addCameraControls(canvas);
            
            updateStatus('✅ 3D scene with lighting created', 'success');
        }

        function addCameraControls(canvas) {
            let isMouseDown = false;
            let mouseX = 0, mouseY = 0;
            let cameraAngleX = 0.3, cameraAngleY = 0.5;
            let cameraDistance = 10;
            
            canvas.addEventListener('mousedown', (event) => {
                isMouseDown = true;
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            
            canvas.addEventListener('mousemove', (event) => {
                if (!isMouseDown) return;
                
                const deltaX = event.clientX - mouseX;
                const deltaY = event.clientY - mouseY;
                
                cameraAngleY -= deltaX * 0.01;
                cameraAngleX -= deltaY * 0.01;
                
                cameraAngleX = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraAngleX));
                
                updateCameraPosition();
                
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            
            canvas.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            canvas.addEventListener('wheel', (event) => {
                event.preventDefault();
                cameraDistance += event.deltaY * 0.01;
                cameraDistance = Math.max(3, Math.min(25, cameraDistance));
                updateCameraPosition();
            });
            
            function updateCameraPosition() {
                const targetY = followCharacterMode && vrmCharacter ? vrmCharacter.position.y + 1.5 : 1.5;
                const targetX = followCharacterMode && vrmCharacter ? vrmCharacter.position.x : 0;
                const targetZ = followCharacterMode && vrmCharacter ? vrmCharacter.position.z : 0;
                
                camera.position.x = targetX + Math.sin(cameraAngleY) * Math.cos(cameraAngleX) * cameraDistance;
                camera.position.y = targetY + Math.sin(cameraAngleX) * cameraDistance;
                camera.position.z = targetZ + Math.cos(cameraAngleY) * Math.cos(cameraAngleX) * cameraDistance;
                
                if (camera.lookAt) camera.lookAt(targetX, targetY, targetZ);
            }
            
            updateCameraPosition();
        }

        async function loadClassroom(hasRealLibraries) {
            updateStatus('🏫 Attempting to load real classroom.glb...', 'loading');
            
            if (hasRealLibraries && window.GLTFLoader) {
                try {
                    const loader = new window.GLTFLoader();
                    const gltf = await new Promise((resolve, reject) => {
                        loader.load(
                            assetPaths.classroom,
                            (gltf) => {
                                updateStatus('📁 classroom.glb file loaded successfully!', 'success');
                                resolve(gltf);
                            },
                            (progress) => {
                                if (progress.lengthComputable) {
                                    const percent = (progress.loaded / progress.total * 100).toFixed(1);
                                    updateStatus(`📈 Classroom loading: ${percent}%`, 'loading');
                                }
                            },
                            (error) => {
                                console.log('GLB loading failed:', error);
                                reject(error);
                            }
                        );
                    });
                    
                    classroomModel = gltf.scene;
                    classroomModel.scale.set(1, 1, 1);
                    classroomModel.position.set(0, 0, 0);
                    scene.add(classroomModel);
                    
                    updateStatus('✅ Real classroom.glb loaded and displayed!', 'success');
                    updateAssetStatus('✅ Real classroom GLB active in scene<br>✅ ichika.vrm loading next...');
                    return;
                    
                } catch (error) {
                    updateStatus('⚠️ classroom.glb loading failed, using fallback', 'loading');
                }
            }
            
            // Create fallback classroom
            await createFallbackClassroom();
            updateStatus('✅ Fallback classroom environment created', 'success');
        }

        async function createFallbackClassroom() {
            updateStatus('🏗️ Creating fallback classroom environment...', 'loading');
            
            const classroomGroup = new THREE.Group();
            
            // Detailed floor with pattern
            const floorGeometry = new THREE.PlaneGeometry(16, 16);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0xe5e5e5 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            if (floor.receiveShadow !== undefined) floor.receiveShadow = true;
            classroomGroup.add(floor);
            
            // Back wall with texture-like appearance
            const wallGeometry = new THREE.PlaneGeometry(16, 4);
            const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xf0f0f0 });
            const backWall = new THREE.Mesh(wallGeometry, wallMaterial);
            backWall.position.set(0, 2, -8);
            classroomGroup.add(backWall);
            
            // Large blackboard
            const blackboardGeometry = new THREE.PlaneGeometry(6, 3);
            const blackboardMaterial = new THREE.MeshLambertMaterial({ color: 0x0f0f0f });
            const blackboard = new THREE.Mesh(blackboardGeometry, blackboardMaterial);
            blackboard.position.set(0, 2, -7.9);
            classroomGroup.add(blackboard);
            
            // Blackboard frame
            const frameGeometry = new THREE.BoxGeometry(6.2, 3.2, 0.1);
            const frameMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            frame.position.set(0, 2, -7.8);
            classroomGroup.add(frame);
            
            // Teacher's desk (larger and more detailed)
            const deskGeometry = new THREE.BoxGeometry(3, 1, 1.5);
            const deskMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const teacherDesk = new THREE.Mesh(deskGeometry, deskMaterial);
            teacherDesk.position.set(3, 0.5, -2.5);
            if (teacherDesk.castShadow !== undefined) teacherDesk.castShadow = true;
            classroomGroup.add(teacherDesk);
            
            // Multiple rows of student desks
            const studentDeskGeometry = new THREE.BoxGeometry(1.5, 0.7, 1);
            const studentDeskMaterial = new THREE.MeshLambertMaterial({ color: 0xD2B48C });
            
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 4; col++) {
                    const studentDesk = new THREE.Mesh(studentDeskGeometry, studentDeskMaterial);
                    studentDesk.position.set(-4.5 + col * 3, 0.35, 2 + row * 2.5);
                    if (studentDesk.castShadow !== undefined) studentDesk.castShadow = true;
                    classroomGroup.add(studentDesk);
                }
            }
            
            // Add some classroom details
            // Podium
            const podiumGeometry = new THREE.BoxGeometry(1, 0.3, 1);
            const podiumMaterial = new THREE.MeshLambertMaterial({ color: 0x696969 });
            const podium = new THREE.Mesh(podiumGeometry, podiumMaterial);
            podium.position.set(0, 0.15, -4);
            classroomGroup.add(podium);
            
            scene.add(classroomGroup);
            classroomModel = classroomGroup;
            
            updateStatus('✅ Detailed fallback classroom created', 'success');
        }

        async function loadIchikaVRM(hasRealLibraries) {
            updateStatus('🎭 Attempting to load real ichika.vrm...', 'loading');
            
            if (hasRealLibraries && window.GLTFLoader && window.VRMLoaderPlugin) {
                try {
                    const loader = new window.GLTFLoader();
                    loader.register((parser) => new window.VRMLoaderPlugin(parser));
                    
                    const gltf = await new Promise((resolve, reject) => {
                        loader.load(
                            assetPaths.ichika,
                            (gltf) => {
                                updateStatus('📁 ichika.vrm file loaded successfully!', 'success');
                                resolve(gltf);
                            },
                            (progress) => {
                                if (progress.lengthComputable) {
                                    const percent = (progress.loaded / progress.total * 100).toFixed(1);
                                    updateStatus(`📈 VRM loading: ${percent}%`, 'loading');
                                }
                            },
                            (error) => {
                                console.log('VRM loading failed:', error);
                                reject(error);
                            }
                        );
                    });
                    
                    vrm = gltf.userData.vrm;
                    vrmCharacter = vrm ? vrm.scene : gltf.scene;
                    
                    if (vrmCharacter) {
                        vrmCharacter.position.set(0, 0, 0);
                        scene.add(vrmCharacter);
                        
                        updateStatus('✅ Real ichika.vrm loaded and displayed!', 'success');
                        updateAssetStatus('✅ Real classroom GLB active<br>✅ Real ichika.vrm active<br>🎉 Both assets loaded successfully!');
                        return;
                    }
                    
                } catch (error) {
                    updateStatus('⚠️ ichika.vrm loading failed, using character fallback', 'loading');
                }
            }
            
            // Create fallback character
            await createFallbackCharacter();
            updateStatus('✅ Fallback character representation created', 'success');
        }

        async function createFallbackCharacter() {
            updateStatus('🎭 Creating detailed character representation...', 'loading');
            
            const characterGroup = new THREE.Group();
            
            // More detailed body (school uniform style)
            const bodyGeometry = new THREE.CapsuleGeometry(0.4, 1.5, 4, 8);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xFF1493 }); // Deep pink
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.4;
            if (body.castShadow !== undefined) body.castShadow = true;
            characterGroup.add(body);
            
            // Head with better proportions
            const headGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const headMaterial = new THREE.MeshLambertMaterial({ color: 0xFFDBAC });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 2.3;
            if (head.castShadow !== undefined) head.castShadow = true;
            characterGroup.add(head);
            
            // Hair (more detailed with front bangs)
            const hairGeometry = new THREE.SphereGeometry(0.34, 16, 16);
            const hairMaterial = new THREE.MeshLambertMaterial({ color: 0x483D8B }); // Dark slate blue
            const hair = new THREE.Mesh(hairGeometry, hairMaterial);
            hair.position.y = 2.4;
            hair.scale.set(1, 0.9, 1);
            if (hair.castShadow !== undefined) hair.castShadow = true;
            characterGroup.add(hair);
            
            // Front hair bangs
            const bangsGeometry = new THREE.BoxGeometry(0.4, 0.2, 0.1);
            const bangs = new THREE.Mesh(bangsGeometry, hairMaterial);
            bangs.position.set(0, 2.2, 0.25);
            characterGroup.add(bangs);
            
            // Detailed eyes
            const eyeGeometry = new THREE.SphereGeometry(0.07, 8, 8);
            const eyeMaterial = new THREE.MeshLambertMaterial({ color: 0x000000 });
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.12, 2.35, 0.24);
            characterGroup.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.12, 2.35, 0.24);
            characterGroup.add(rightEye);
            
            // Arms
            const armGeometry = new THREE.CapsuleGeometry(0.1, 1, 4, 8);
            const armMaterial = new THREE.MeshLambertMaterial({ color: 0xFFDBAC });
            
            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.position.set(-0.5, 1.6, 0);
            leftArm.rotation.z = 0.3;
            if (leftArm.castShadow !== undefined) leftArm.castShadow = true;
            characterGroup.add(leftArm);
            
            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.position.set(0.5, 1.6, 0);
            rightArm.rotation.z = -0.3;
            if (rightArm.castShadow !== undefined) rightArm.castShadow = true;
            characterGroup.add(rightArm);
            
            // Legs
            const legGeometry = new THREE.CapsuleGeometry(0.15, 1.1, 4, 8);
            const legMaterial = new THREE.MeshLambertMaterial({ color: 0xFFDBAC });
            
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.18, 0.55, 0);
            if (leftLeg.castShadow !== undefined) leftLeg.castShadow = true;
            characterGroup.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.18, 0.55, 0);
            if (rightLeg.castShadow !== undefined) rightLeg.castShadow = true;
            characterGroup.add(rightLeg);
            
            // Position the entire character
            characterGroup.position.set(0, 0, 0);
            scene.add(characterGroup);
            vrmCharacter = characterGroup;
            
            updateStatus('✅ Detailed Ichika character representation created', 'success');
        }

        function startRenderLoop() {
            updateStatus('🎬 Starting real-time rendering...', 'loading');
            
            let animationFrame = 0;
            const clock = new THREE.Clock();
            
            function animate() {
                requestAnimationFrame(animate);
                animationFrame++;
                
                const deltaTime = clock.getDelta ? clock.getDelta() : 0.016;
                
                // Update FPS counter
                updateFPS();
                
                // Update VRM if available
                if (vrm) {
                    vrm.update(deltaTime);
                }
                
                // Breathing animation
                if (breathingAnimation && vrmCharacter) {
                    const breathScale = 1 + Math.sin(Date.now() * 0.002) * 0.02;
                    vrmCharacter.scale.y = breathScale;
                }
                
                // Walking animation
                if (walkingAnimation && currentTarget && vrmCharacter) {
                    updateWalkingAnimation();
                }
                
                // Idle animations
                if (vrmCharacter && !walkingAnimation) {
                    vrmCharacter.rotation.y += Math.sin(animationFrame * 0.005) * 0.001;
                }
                
                // Render the scene
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            }
            
            animate();
            updateStatus('✅ Real-time 3D rendering active at 60 FPS', 'success');
        }

        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            
            if (currentTime - lastTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps').textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        function updateWalkingAnimation() {
            if (!currentTarget || !vrmCharacter) return;
            
            const currentPos = vrmCharacter.position;
            const targetVec = new THREE.Vector3(currentTarget.x, currentTarget.y, currentTarget.z);
            const currentVec = new THREE.Vector3(currentPos.x, currentPos.y, currentPos.z);
            
            const direction = targetVec.clone ? targetVec.clone().sub(currentVec) : 
                             { x: currentTarget.x - currentPos.x, y: currentTarget.y - currentPos.y, z: currentTarget.z - currentPos.z };
            
            const distance = Math.sqrt(direction.x * direction.x + direction.y * direction.y + direction.z * direction.z);
            
            if (distance < 0.2) {
                currentTarget = null;
                updateStatus('✅ Reached destination', 'success');
                return;
            }
            
            // Normalize direction
            if (distance > 0) {
                direction.x /= distance;
                direction.y /= distance;
                direction.z /= distance;
            }
            
            // Move character
            vrmCharacter.position.x += direction.x * walkingSpeed;
            vrmCharacter.position.z += direction.z * walkingSpeed;
            
            // Face movement direction
            if (Math.abs(direction.x) > 0.01 || Math.abs(direction.z) > 0.01) {
                const angle = Math.atan2(direction.x, direction.z);
                vrmCharacter.rotation.y = angle;
            }
            
            // Add walking bob animation
            const walkBob = Math.sin(Date.now() * 0.008) * 0.1;
            vrmCharacter.position.y = walkBob;
        }

        async function createEmergencyFallback() {
            updateStatus('🚨 Creating emergency 2D fallback...', 'loading');
            
            const canvas = document.createElement('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.cssText = 'display: block; width: 100%; height: 100%;';
            document.getElementById('container').appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            
            let characterX = canvas.width / 2;
            let characterY = canvas.height * 0.6;
            let time = 0;
            
            function drawScene() {
                time++;
                
                // Clear with sky color
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw classroom floor
                ctx.fillStyle = '#e5e5e5';
                ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
                
                // Draw blackboard
                ctx.fillStyle = '#0f0f0f';
                ctx.fillRect(canvas.width * 0.25, canvas.height * 0.15, canvas.width * 0.5, canvas.height * 0.25);
                
                // Draw teacher desk
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(canvas.width * 0.65, canvas.height * 0.55, canvas.width * 0.15, canvas.height * 0.1);
                
                // Draw character with animation
                const bobOffset = Math.sin(time * 0.1) * 8;
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(characterX, canvas.height * 0.7 + 15, 50, 20, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                // Body (dress)
                ctx.fillStyle = '#FF1493';
                ctx.beginPath();
                ctx.ellipse(characterX, characterY + bobOffset, 35, 60, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                // Head
                ctx.fillStyle = '#FFDBAC';
                ctx.beginPath();
                ctx.ellipse(characterX, characterY - 50 + bobOffset, 28, 35, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                // Hair
                ctx.fillStyle = '#483D8B';
                ctx.beginPath();
                ctx.ellipse(characterX, characterY - 60 + bobOffset, 32, 30, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(characterX - 12, characterY - 55 + bobOffset, 5, 6, 0, 0, 2 * Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(characterX + 12, characterY - 55 + bobOffset, 5, 6, 0, 0, 2 * Math.PI);
                ctx.fill();
                
                requestAnimationFrame(drawScene);
            }
            
            drawScene();
            
            // Create fake character for controls
            vrmCharacter = {
                position: { x: characterX, y: characterY, z: 0 },
                rotation: { x: 0, y: 0, z: 0 },
                scale: { x: 1, y: 1, z: 1, set: function() {} }
            };
            
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                updateStatus('✅ Emergency 2D fallback active', 'success');
            }, 1000);
        }

        // Control functions
        window.startWalkingDemo = function() {
            if (!vrmCharacter) {
                updateStatus('⚠️ Character not ready', 'error');
                return;
            }
            
            walkingAnimation = true;
            document.getElementById('walkBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            updateStatus('🚶‍♀️ Starting automatic walking tour', 'success');
            
            const positionNames = ['blackboard', 'desk', 'front', 'center'];
            let currentIndex = 0;
            
            function walkCycle() {
                if (!walkingAnimation) return;
                
                const targetName = positionNames[currentIndex];
                currentTarget = positions[targetName];
                
                updateStatus(`🎯 Walking to ${targetName}...`, 'loading');
                
                setTimeout(() => {
                    if (walkingAnimation) {
                        currentIndex = (currentIndex + 1) % positionNames.length;
                        setTimeout(walkCycle, 3000);
                    }
                }, 4000);
            }
            
            walkCycle();
        };

        window.stopWalking = function() {
            walkingAnimation = false;
            currentTarget = null;
            document.getElementById('walkBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            updateStatus('⏹️ Walking tour stopped', 'success');
        };

        window.moveToPosition = function(positionName) {
            if (!vrmCharacter || !positions[positionName]) {
                updateStatus('⚠️ Position not available', 'error');
                return;
            }
            
            currentTarget = positions[positionName];
            updateStatus(`🎯 Moving to ${positionName}...`, 'loading');
        };

        window.resetCamera = function() {
            if (camera) {
                camera.position.set(6, 5, 8);
                if (camera.lookAt) camera.lookAt(0, 1, 0);
                updateStatus('📹 Camera reset to default view', 'success');
            }
        };

        window.toggleAnimation = function() {
            breathingAnimation = !breathingAnimation;
            const btn = document.getElementById('animBtn');
            btn.textContent = breathingAnimation ? 'Breathing: ON' : 'Breathing: OFF';
            updateStatus(breathingAnimation ? '💨 Breathing animation enabled' : '💨 Breathing animation disabled', 'success');
        };

        window.followCharacter = function() {
            followCharacterMode = !followCharacterMode;
            const btn = document.getElementById('followBtn');
            btn.textContent = followCharacterMode ? 'Follow: ON' : 'Follow: OFF';
            updateStatus(followCharacterMode ? '👁️ Camera following character' : '👁️ Camera follow disabled', 'success');
        };

        window.reloadVRM = function() {
            updateStatus('🔄 Attempting to reload ichika.vrm...', 'loading');
            if (vrmCharacter && scene) {
                scene.remove(vrmCharacter);
            }
            loadIchikaVRM(window.GLTFLoader && window.VRMLoaderPlugin);
        };

        window.reloadClassroom = function() {
            updateStatus('🔄 Attempting to reload classroom.glb...', 'loading');
            if (classroomModel && scene) {
                scene.remove(classroomModel);
            }
            loadClassroom(window.GLTFLoader);
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                if (camera.updateProjectionMatrix) camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Start the application
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(init, 800);
        });
        
        if (document.readyState === 'loading') {
            // Still loading
        } else {
            setTimeout(init, 800);
        }
    </script>
</body>
</html>
