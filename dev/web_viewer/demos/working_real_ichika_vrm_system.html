<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Ichika VRM Classroom System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            color: white;
            min-width: 350px;
            max-height: 75vh;
            overflow-y: auto;
            border: 2px solid #4CAF50;
        }
        
        .status-item {
            margin: 3px 0;
            padding: 5px;
            border-radius: 3px;
            font-size: 12px;
            border-left: 3px solid #FFC107;
            display: flex;
            align-items: center;
        }
        
        .status-success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border-left-color: #4CAF50;
        }
        
        .status-error {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
            border-left-color: #F44336;
        }
        
        .status-loading {
            background: rgba(255, 193, 7, 0.2);
            color: #FFC107;
            border-left-color: #FFC107;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 3px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        #fps {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
            font-family: monospace;
            font-size: 14px;
        }

        .demo-title {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .section-header {
            color: #FFC107;
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0 5px 0;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <div id="ui">
            <div class="demo-title">🎭 Real Ichika VRM Classroom</div>
            
            <div class="section-header">📊 System Status</div>
            <div id="status-messages"></div>
            
            <div class="section-header">🎮 Controls</div>
            <div class="button-group">
                <button id="initSystem" onclick="initializeSystem()">🚀 Initialize System</button>
                <button id="loadAssets" onclick="loadAssets()" disabled>📦 Load Assets</button>
                <button id="startDemo" onclick="startWalkingDemo()" disabled>🚶‍♀️ Start Walking</button>
            </div>
            
            <div class="button-group">
                <button onclick="moveToPosition('center')">🎯 Center</button>
                <button onclick="moveToPosition('blackboard')">📋 Blackboard</button>
                <button onclick="moveToPosition('desk')">🪑 Teacher Desk</button>
                <button onclick="moveToPosition('front')">👥 Front of Class</button>
            </div>

            <div class="button-group">
                <button onclick="testAnimation('wave')">👋 Wave</button>
                <button onclick="testAnimation('bow')">🙇 Bow</button>
                <button onclick="testAnimation('point')">👉 Point</button>
            </div>
        </div>
        
        <div id="fps">FPS: --</div>
    </div>

    <!-- Load Three.js and VRM libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.6/lib/three-vrm.min.js"></script>
    
    <script>
        let scene, camera, renderer, clock;
        let vrmCharacter = null;
        let classroomModel = null;
        let isInitialized = false;
        let isAssetsLoaded = false;
        let currentAnimation = null;
        let walkingSequence = null;
        let frameCount = 0;
        let lastTime = performance.now();
        
        // Classroom positions
        const CLASSROOM_POSITIONS = {
            center: { x: 0, y: 0, z: 0 },
            blackboard: { x: 0, y: 0, z: -3 },
            desk: { x: 2, y: 0, z: -2 },
            front: { x: 0, y: 0, z: 3.5 }
        };

        function updateStatus(message, type = 'normal') {
            const statusDiv = document.getElementById('status-messages');
            const statusItem = document.createElement('div');
            statusItem.className = `status-item ${type === 'success' ? 'status-success' : 
                                  type === 'error' ? 'status-error' : 
                                  type === 'loading' ? 'status-loading' : 'status-item'}`;
            statusItem.innerHTML = message;
            statusDiv.appendChild(statusItem);
            
            // Keep only last 10 status messages
            while (statusDiv.children.length > 10) {
                statusDiv.removeChild(statusDiv.firstChild);
            }
            
            console.log('Status:', message);
        }

        async function initializeSystem() {
            updateStatus('🚀 Initializing Real Ichika VRM System...', 'loading');
            
            try {
                // Initialize Three.js scene
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB); // Sky blue background
                
                // Setup camera
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 1.6, 5);
                camera.lookAt(0, 1, 0);
                
                // Setup renderer with better quality settings
                const canvas = document.getElementById('canvas');
                renderer = new THREE.WebGLRenderer({ 
                    canvas: canvas, 
                    antialias: true,
                    alpha: false
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                
                // Setup clock for animations
                clock = new THREE.Clock();
                
                // Add lighting for the classroom
                setupLighting();
                
                updateStatus('✅ Three.js scene initialized', 'success');
                
                // Enable asset loading
                document.getElementById('initSystem').disabled = true;
                document.getElementById('loadAssets').disabled = false;
                
                isInitialized = true;
                
                // Start render loop
                animate();
                updateStatus('✅ Real Ichika VRM System Ready!', 'success');
                
            } catch (error) {
                console.error('Failed to initialize system:', error);
                updateStatus('❌ Failed to initialize: ' + error.message, 'error');
            }
        }

        function setupLighting() {
            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            // Add directional light (sunlight)
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Add point lights for classroom ambiance
            const pointLight1 = new THREE.PointLight(0xffffff, 0.3, 10);
            pointLight1.position.set(-2, 3, -2);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xffffff, 0.3, 10);
            pointLight2.position.set(2, 3, 2);
            scene.add(pointLight2);
        }

        async function loadAssets() {
            updateStatus('📦 Loading Ichika VRM and Classroom GLB...', 'loading');
            
            try {
                // Load VRM character first
                await loadIchikaVRM();
                
                // Load classroom environment
                await loadClassroomGLB();
                
                document.getElementById('loadAssets').disabled = true;
                document.getElementById('startDemo').disabled = false;
                
                isAssetsLoaded = true;
                updateStatus('✅ All assets loaded successfully!', 'success');
                
            } catch (error) {
                console.error('Failed to load assets:', error);
                updateStatus('❌ Asset loading failed: ' + error.message, 'error');
            }
        }

        async function loadIchikaVRM() {
            updateStatus('👩 Loading Ichika VRM model (16MB)...', 'loading');
            
            try {
                const loader = new THREE.GLTFLoader();
                
                // Add VRM support
                await import('https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.6/lib/three-vrm.min.js');
                loader.register((parser) => new VRM.VRMLoaderPlugin(parser));
                
                const gltf = await new Promise((resolve, reject) => {
                    loader.load(
                        './assets/avatars/ichika.vrm',
                        (gltf) => resolve(gltf),
                        (progress) => {
                            if (progress.total > 0) {
                                const percent = Math.round((progress.loaded / progress.total) * 100);
                                if (percent % 20 === 0) { // Update every 20%
                                    updateStatus(`📈 Loading Ichika VRM: ${percent}%`, 'loading');
                                }
                            }
                        },
                        (error) => reject(error)
                    );
                });
                
                vrmCharacter = gltf.userData.vrm;
                if (vrmCharacter) {
                    // Position the character
                    vrmCharacter.scene.position.set(0, 0, 0);
                    vrmCharacter.scene.scale.setScalar(1);
                    vrmCharacter.scene.castShadow = true;
                    vrmCharacter.scene.receiveShadow = true;
                    
                    // Enable shadows for VRM meshes
                    vrmCharacter.scene.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    scene.add(vrmCharacter.scene);
                    updateStatus('✅ Ichika VRM character loaded and positioned', 'success');
                } else {
                    throw new Error('VRM data not found in loaded file');
                }
                
            } catch (error) {
                console.error('VRM loading error:', error);
                // Create fallback character representation
                await createFallbackCharacter();
                updateStatus('⚠️ Using fallback character (VRM load failed)', 'error');
            }
        }

        async function createFallbackCharacter() {
            updateStatus('🔧 Creating fallback character...', 'loading');
            
            // Create a simple character representation
            const group = new THREE.Group();
            
            // Body (pink cylinder)
            const bodyGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1.6, 8);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xffb6c1 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.8;
            body.castShadow = true;
            group.add(body);
            
            // Head (sphere)
            const headGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const headMaterial = new THREE.MeshLambertMaterial({ color: 0xfdbcb4 });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.8;
            head.castShadow = true;
            group.add(head);
            
            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.1, 1.85, 0.25);
            group.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.1, 1.85, 0.25);
            group.add(rightEye);
            
            // Hair (top part)
            const hairGeometry = new THREE.SphereGeometry(0.35, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
            const hairMaterial = new THREE.MeshLambertMaterial({ color: 0x4a4a4a });
            const hair = new THREE.Mesh(hairGeometry, hairMaterial);
            hair.position.y = 2.0;
            hair.castShadow = true;
            group.add(hair);
            
            // Arms
            const armGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8);
            const armMaterial = new THREE.MeshLambertMaterial({ color: 0xfdbcb4 });
            
            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.position.set(-0.4, 1.2, 0);
            leftArm.rotation.z = Math.PI / 6;
            leftArm.castShadow = true;
            group.add(leftArm);
            
            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.position.set(0.4, 1.2, 0);
            rightArm.rotation.z = -Math.PI / 6;
            rightArm.castShadow = true;
            group.add(rightArm);
            
            // Legs
            const legGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
            const legMaterial = new THREE.MeshLambertMaterial({ color: 0xfdbcb4 });
            
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.15, 0.0, 0);
            leftLeg.castShadow = true;
            group.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.15, 0.0, 0);
            rightLeg.castShadow = true;
            group.add(rightLeg);
            
            // Store reference for animation
            vrmCharacter = { scene: group };
            scene.add(group);
        }

        async function loadClassroomGLB() {
            updateStatus('🏫 Loading Classroom environment (21MB)...', 'loading');
            
            try {
                const loader = new THREE.GLTFLoader();
                
                const gltf = await new Promise((resolve, reject) => {
                    loader.load(
                        './assets/scenes/classroom.glb',
                        (gltf) => resolve(gltf),
                        (progress) => {
                            if (progress.total > 0) {
                                const percent = Math.round((progress.loaded / progress.total) * 100);
                                if (percent % 25 === 0) { // Update every 25%
                                    updateStatus(`📈 Loading Classroom: ${percent}%`, 'loading');
                                }
                            }
                        },
                        (error) => reject(error)
                    );
                });
                
                classroomModel = gltf.scene;
                classroomModel.scale.setScalar(1);
                classroomModel.position.set(0, 0, 0);
                
                // Enable shadows for classroom
                classroomModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(classroomModel);
                updateStatus('✅ Classroom environment loaded', 'success');
                
            } catch (error) {
                console.error('Classroom loading error:', error);
                // Create fallback classroom
                await createFallbackClassroom();
                updateStatus('⚠️ Using fallback classroom (GLB load failed)', 'error');
            }
        }

        async function createFallbackClassroom() {
            updateStatus('🔧 Creating fallback classroom...', 'loading');
            
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(12, 12);
            const floorMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x8B7355,
                side: THREE.DoubleSide
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.1;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Blackboard
            const blackboardGeometry = new THREE.PlaneGeometry(4, 2);
            const blackboardMaterial = new THREE.MeshLambertMaterial({ color: 0x2F4F2F });
            const blackboard = new THREE.Mesh(blackboardGeometry, blackboardMaterial);
            blackboard.position.set(0, 1.5, -4);
            scene.add(blackboard);
            
            // Teacher desk
            const deskGeometry = new THREE.BoxGeometry(1.5, 0.8, 0.8);
            const deskMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const teacherDesk = new THREE.Mesh(deskGeometry, deskMaterial);
            teacherDesk.position.set(2, 0.4, -2.5);
            teacherDesk.castShadow = true;
            scene.add(teacherDesk);
            
            // Student desks
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 2; j++) {
                    const studentDesk = new THREE.Mesh(
                        new THREE.BoxGeometry(0.8, 0.6, 0.6),
                        new THREE.MeshLambertMaterial({ color: 0xA0522D })
                    );
                    studentDesk.position.set(-2 + j * 2, 0.3, 1 + i * 1.5);
                    studentDesk.castShadow = true;
                    scene.add(studentDesk);
                }
            }
        }

        function moveToPosition(positionName) {
            if (!vrmCharacter || !isAssetsLoaded) {
                updateStatus('❌ Character not loaded yet', 'error');
                return;
            }
            
            const targetPos = CLASSROOM_POSITIONS[positionName];
            if (!targetPos) {
                updateStatus('❌ Unknown position: ' + positionName, 'error');
                return;
            }
            
            updateStatus(`🚶‍♀️ Moving to ${positionName}...`, 'loading');
            
            // Smooth movement animation
            const startPos = {
                x: vrmCharacter.scene.position.x,
                y: vrmCharacter.scene.position.y,
                z: vrmCharacter.scene.position.z
            };
            
            let progress = 0;
            const duration = 2000; // 2 seconds
            const startTime = Date.now();
            
            currentAnimation = () => {
                const elapsed = Date.now() - startTime;
                progress = Math.min(elapsed / duration, 1);
                
                // Ease in-out interpolation
                const easedProgress = progress * progress * (3 - 2 * progress);
                
                vrmCharacter.scene.position.x = startPos.x + (targetPos.x - startPos.x) * easedProgress;
                vrmCharacter.scene.position.y = startPos.y + (targetPos.y - startPos.y) * easedProgress;
                vrmCharacter.scene.position.z = startPos.z + (targetPos.z - startPos.z) * easedProgress;
                
                if (progress >= 1) {
                    currentAnimation = null;
                    updateStatus(`✅ Arrived at ${positionName}`, 'success');
                }
            };
        }

        function testAnimation(animationType) {
            if (!vrmCharacter) {
                updateStatus('❌ Character not loaded yet', 'error');
                return;
            }
            
            updateStatus(`🎭 Playing ${animationType} animation`, 'loading');
            
            // Simple animation based on type
            let animationFrames = 0;
            const maxFrames = 60; // 1 second at 60fps
            
            currentAnimation = () => {
                animationFrames++;
                
                switch (animationType) {
                    case 'wave':
                        // Simple wave animation - rotate the character
                        if (vrmCharacter.scene) {
                            vrmCharacter.scene.rotation.y = Math.sin(animationFrames * 0.1) * 0.2;
                        }
                        break;
                        
                    case 'bow':
                        // Simple bow - lean forward
                        if (vrmCharacter.scene) {
                            vrmCharacter.scene.rotation.x = Math.sin(animationFrames * 0.1) * -0.3;
                        }
                        break;
                        
                    case 'point':
                        // Simple point - slight rotation
                        if (vrmCharacter.scene) {
                            vrmCharacter.scene.rotation.y = Math.sin(animationFrames * 0.15) * 0.5;
                        }
                        break;
                }
                
                if (animationFrames >= maxFrames) {
                    // Reset rotation
                    if (vrmCharacter.scene) {
                        vrmCharacter.scene.rotation.x = 0;
                        vrmCharacter.scene.rotation.y = 0;
                        vrmCharacter.scene.rotation.z = 0;
                    }
                    currentAnimation = null;
                    updateStatus(`✅ ${animationType} animation complete`, 'success');
                }
            };
        }

        function startWalkingDemo() {
            if (!vrmCharacter || !isAssetsLoaded) {
                updateStatus('❌ Assets not loaded yet', 'error');
                return;
            }
            
            updateStatus('🚶‍♀️ Starting walking demonstration...', 'loading');
            
            const positions = ['center', 'blackboard', 'desk', 'front', 'center'];
            let currentStep = 0;
            
            const walkSequence = () => {
                if (currentStep < positions.length) {
                    moveToPosition(positions[currentStep]);
                    currentStep++;
                    
                    // Wait for movement to complete, then continue
                    setTimeout(() => {
                        if (currentStep < positions.length) {
                            walkSequence();
                        } else {
                            updateStatus('✅ Walking demonstration complete!', 'success');
                        }
                    }, 2500);
                }
            };
            
            walkSequence();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Update VRM
            if (vrmCharacter && vrmCharacter.update) {
                vrmCharacter.update(clock.getDelta());
            }
            
            // Execute current animation
            if (currentAnimation) {
                currentAnimation();
            }
            
            // Update FPS counter
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = `FPS: ${Math.round(frameCount * 1000 / (now - lastTime))}`;
                frameCount = 0;
                lastTime = now;
            }
            
            // Render scene
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Auto-initialize on page load for demonstration
        window.addEventListener('load', () => {
            updateStatus('🎬 Real Ichika VRM Classroom Demo Ready', 'success');
            updateStatus('👆 Click "Initialize System" to start', 'loading');
        });
    </script>
</body>
</html>
