<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ichika Conversation – Mic + Reply + Audio-driven Animation</title>
  <style>
    body{font-family:sans-serif;padding:16px;background:#0b0f14;color:#d7e1ee}
    button,input{margin-right:8px}
    #log{font:12px ui-monospace,monospace;background:#0a0e13;border:1px solid #16202c;border-radius:6px;padding:8px;height:160px;overflow:auto}
    .row{margin:8px 0}
  </style>
</head>
<body>
  <h1>Ichika Conversation</h1>
  <p>Talk to the avatar via your microphone and trigger a reply; audio energy drives gestures. VRM rendering is optional.</p>

  <div class="row">
    <button id="mic">Start Mic</button>
    <button id="stop">Stop</button>
    <input id="text" placeholder="Type something for Ichika to say" size="42" value="Hello there!" />
    <button id="say">Say</button>
    <label><input id="playAudio" type="checkbox" checked /> play audio</label>
    <label>Backend
      <select id="backend">
        <option value="speech">Speech API</option>
        <option value="kokoro">Kokoro (on-device)</option>
        <option value="speecht5">SpeechT5 (stub/ORT)</option>
        <option value="beeps">Beeps (fallback)</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button id="listen">Listen & Reply</button>
    <label>Voice: <select id="voice"></select></label>
    <label>Rate <input id="rate" type="number" min="0.5" max="2" step="0.1" value="1.0" style="width:64px" /></label>
    <label>Pitch <input id="pitch" type="number" min="0" max="2" step="0.1" value="1.0" style="width:64px" /></label>
  <label><input id="autoListen" type="checkbox" checked /> auto listen after reply</label>
  <label><input id="ptt" type="checkbox" /> push-to-talk (hold Space)</label>
  </div>
  <pre id="log"></pre>

  <!-- UMD modules used by the demo (idempotent loads) -->
  <!-- Dynamic runtime/model loader: honors URL query like ?kokoroJs=/vendor/kokoro.min.js&runtime.ort=/vendor/ort.min.js -->
  <script src="../src/testing/real_inference_bootstrap.js"></script>
  <script src="../src/audio/AudioEnvelope.js"></script>
  <script src="../src/components/animation/timeline/tasks/AudioEnergyGestureTask.js"></script>
  <script src="../src/utils/scheduler/FibonacciHeap.js"></script>
  <script src="../src/utils/scheduler/TaskScheduler.js"></script>
  <script src="../src/components/animation/timeline/TimelineChunkAdapter.js"></script>
  <script src="../src/components/animation/timeline/BVHTimeline.js"></script>
  <script src="../src/orchestrator/SpeechGestureScheduler.js"></script>
  <script src="../src/orchestrator/IchikaOrchestrator.js"></script>
  <script src="../src/components/animation/vrm/AvatarBinder.js"></script>
  <script src="../src/components/animation/vrm/BVHTimelineVRMIntegration.js"></script>
  <script src="../src/components/animation/vrm/VRMLoader.js"></script>
  <script src="../src/components/ai/tasks/SpeechT5StubTask.js"></script>
  <script src="../src/components/ai/tasks/SpeechT5OrtTask.js"></script>

  <script>
    // Lightweight transformers.js loader (deferred)
    async function ensureTransformers(){
      if (window.transformers) return window.transformers;
      try {
        const mod = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js');
        const T = mod?.default || mod; window.transformers = T; return T;
      } catch { return window.transformers; }
    }
  async function ensureWhisper(){ return ensureTransformers(); }
    function getQueryParam(name){ try { const q = new URLSearchParams(location.search); return q.get(name); } catch { return null; } }
  const SPEECHT5_ON_DEVICE = (()=>{ const v = getQueryParam('speecht5OnDevice'); return v === '1' || String(v).toLowerCase() === 'true'; })();
  const SPEECHT5_ON_DEVICE_FAKE = (()=>{ const v = getQueryParam('speecht5OnDeviceFake'); return v === '1' || String(v).toLowerCase() === 'true'; })();
  const DEBUG_AUDIO = (()=>{ const v = getQueryParam('debugAudio'); return v === '1' || String(v).toLowerCase() === 'true'; })();
  const FORCE_WORKLET = (()=>{ const v = getQueryParam('forceWorklet'); return v === '1' || String(v).toLowerCase() === 'true'; })();

    async function getSpeechT5SpeakerEmbeddings(){
      try {
        const spk = (getQueryParam('speecht5Spk') || '').trim();
        if (!spk) { const a = new Float32Array(512); a[0] = 0.1; return a; }
        const lower = spk.toLowerCase();
        if (lower === 'zero') return new Float32Array(512);
        if (lower === 'random') {
          const a = new Float32Array(512); let seed = 42;
          const rnd = ()=>{ seed = (seed * 1664525 + 1013904223) >>> 0; return (seed & 0xffff) / 0xffff; };
          for (let i=0;i<a.length;i++){ a[i] = (rnd()*2 - 1) * 0.1; }
          return a;
        }
        return spk; // URL/path/string handled by transformers.js
      } catch { return new Float32Array(512); }
    }

    async function playPCMFloat32(pcm, sr){
      const ctx = await getPageAudioCtx();
      const buf = ctx.createBuffer(1, pcm.length, sr);
      try { buf.copyToChannel(pcm, 0); } catch { buf.getChannelData(0).set(pcm); }
      const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start();
      logAudio('pcm_play', { frames: pcm.length, sr });
      return new Promise(res => { src.onended = () => { try { src.disconnect(); } catch {} res(); }; });
    }

  async function runOnDeviceSpeechT5(text, playAudio){
      // Deterministic CI-friendly path: skip remote model downloads and synthesize locally
      if (SPEECHT5_ON_DEVICE_FAKE) {
        try {
          const words = (text||'').trim().split(/\s+/).filter(Boolean).length;
          const dur = Math.max(0.8, Math.min(4.0, words ? words / 2.5 : 1.2));
          const tts = buildTtsFromText(text, dur);
          scheduleFromTts(tts);
      if (playAudio) await playBeepsForText(tts.duration);
      logAudio('speecht5_fake_scheduled', { dur: tts.duration });
          log('🔊 SpeechT5 on-device FAKE audio ok');
          return;
        } catch (e) {
          log('speecht5 fake error; fallback to beeps: ' + (e?.message||e));
      const tts = buildTtsFromText(text); scheduleFromTts(tts); if (playAudio) await playBeepsForText(tts.duration); logAudio('speecht5_fake_error', { message: e?.message||String(e) });
          return;
        }
      }
      const T = await ensureTransformers(); const { pipeline } = T || {}; if (!pipeline) throw new Error('transformers pipeline unavailable');
      const model = (getQueryParam('speecht5Model') || 'Xenova/speecht5_tts').trim();
      const synth = (window._ttsPipeline && window._ttsPipeline.__modelId === model) ? window._ttsPipeline : await pipeline('text-to-speech', model, { quantized: true });
      if (!window._ttsPipeline || window._ttsPipeline.__modelId !== model) { synth.__modelId = model; window._ttsPipeline = synth; }
      const speaker_embeddings = await getSpeechT5SpeakerEmbeddings();
      const out = await synth(text, { speaker_embeddings });
      const pcm = out?.audio || out?.audio_buffer || out?.pcm || out?.array; const sr = out?.sampling_rate || out?.sample_rate || 22050;
      if (!(pcm && sr)) throw new Error('SpeechT5 returned no audio');
      const dur = pcm.length / sr; const tts = buildTtsFromText(text, dur);
      // Compute energy envelope from PCM and override
      try {
        const ctx = await getPageAudioCtx();
        const buf = ctx.createBuffer(1, pcm.length, sr);
        try { buf.copyToChannel(pcm, 0); } catch { buf.getChannelData(0).set(pcm); }
        const env = energyFromAudioBuffer(buf);
        if (env && env.length) tts.energy = env;
  scheduleFromTts(tts);
  if (playAudio) { if (!(FORCE_WORKLET && await playViaWorklet(buf))) await playAudioBuffer(buf); }
  logAudio('speecht5_real_play', { dur: tts.duration, sr });
      } catch {
        scheduleFromTts(tts);
  if (playAudio) await playPCMFloat32(pcm, sr); logAudio('speecht5_fallback_play', { dur: tts.duration, sr });
      }
      log('🔊 SpeechT5 on-device audio ok');
    }
    async function ensureKokoroRuntime(maxWaitMs=5000){
      if ((window.kokoro && typeof window.kokoro.create==='function') || (window.KokoroTTS && typeof window.KokoroTTS.from_pretrained==='function')) return true;
      const hinted = getQueryParam('kokoroJs');
      const cdnFallbacks = [
        hinted,
        '/vendor/kokoro.min.js', // local vendor path if provided by deployment
        'https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/dist/kokoro.min.js',
        'https://unpkg.com/kokoro-js@1.2.1/dist/kokoro.min.js'
      ].filter(Boolean);
      for (const url of cdnFallbacks){
        if ((window.kokoro && window.kokoro.create) || (window.KokoroTTS && window.KokoroTTS.from_pretrained)) break;
        try {
          await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=url; s.async=true; s.onload=()=>res(); s.onerror=()=>rej(); document.head.appendChild(s); });
        } catch { /* try next */ }
      }
      const start=performance.now();
      while (performance.now()-start < maxWaitMs){
        if ((window.kokoro && window.kokoro.create) || (window.KokoroTTS && window.KokoroTTS.from_pretrained)) return true;
        await new Promise(r=>setTimeout(r,50));
      }
      return false;
    }

    // Audio diagnostics & worklet playback
    let audioDiagInterval = null; let workletNode = null; let workletReady = false; let workletQueue = [];
    async function maybeInitWorklet(){
      if (!FORCE_WORKLET) return false;
      try {
        const ctx = await getPageAudioCtx();
        if (!ctx.audioWorklet) { log('⚠️ AudioWorklet not supported'); return false; }
        if (!workletReady){
          // Reuse existing bundled worklet if present; else inline minimal processor
          const inline = `class PB extends AudioWorkletProcessor{constructor(){super();this.q=[];this.port.onmessage=e=>{if(e.data&&e.data.buff)this.q.push(e.data.buff)}}process(_,o){const ch=o[0][0];if(!ch)return true;if(this.q.length){const f=this.q.shift();ch.set(f.slice(0,ch.length));for(let i=f.length;i<ch.length;i++)ch[i]=0}else{for(let i=0;i<ch.length;i++)ch[i]=0}return true}};registerProcessor('mini-playback',PB);`;
          const blob = new Blob([inline], { type:'application/javascript' });
          const url = URL.createObjectURL(blob);
          await ctx.audioWorklet.addModule(url);
          workletNode = new AudioWorkletNode(ctx, 'mini-playback');
          workletNode.connect(ctx.destination); workletReady = true; log('🔊 Worklet playback initialized');
        }
        return true;
      } catch (e){ log('Worklet init error: '+(e.message||e)); return false; }
    }
    async function playViaWorklet(abuf){
      try {
        if (!await maybeInitWorklet()) return false;
        const ch0 = abuf.getChannelData(0);
        // Split into 128 frame chunks for smoother supply
        const frame = 128; for (let i=0;i<ch0.length;i+=frame){ workletNode.port.postMessage({ buff: ch0.slice(i,i+frame) }); }
        return true;
      } catch { return false; }
    }
    function startAudioDiagnostics(){
      if (!DEBUG_AUDIO || audioDiagInterval) return;
      audioDiagInterval = setInterval(()=>{
        try {
          const ctx = pageAudioCtx; const st = ctx? ctx.state: 'none';
          const diag = {
            ctxState: st,
            hasSpeechSynthesis: !!(window.speechSynthesis && window.SpeechSynthesisUtterance),
            transformers: !!window.transformers,
            kokoroLegacy: !!(window.kokoro && window.kokoro.create),
            kokoroTTS: !!(window.KokoroTTS && window.KokoroTTS.from_pretrained),
            speecht5Fake: SPEECHT5_ON_DEVICE_FAKE,
            worklet: { forced: FORCE_WORKLET, ready: workletReady }
          };
          console.log('[audio-diagnostics]', diag);
        } catch {}
      }, 2000);
    }
    startAudioDiagnostics();
    const log = (m) => { const el = document.getElementById('log'); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };

    const qs = new URLSearchParams(location.search);
    const WANT_VRM = qs.get('vrm') === '1';
  const ASR_ENGINE = (qs.get('asr')||'').toLowerCase();
  const ASR_MODEL = (qs.get('asrModel')||'').trim();
  const AUTO_LISTEN = (()=>{ const v = qs.get('autoListen'); return v === '1' || String(v).toLowerCase() === 'true'; })();
  let REMAINING_TURNS = (()=>{ const v = parseInt(qs.get('turns')||'0',10); let n = isNaN(v)?0:Math.max(0,v); if (n>25) { n=25; try { console.warn('[conversation] turns capped at 25'); } catch {} } return n; })();
  let conversationStats = { listens: 0, replies: 0 };
  let listeningInProgress = false;

    // Shared page audio context (resumed on first user gesture)
    let pageAudioCtx = null;
    async function getPageAudioCtx() {
      if (!pageAudioCtx) pageAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (pageAudioCtx.state !== 'running') {
        try { await pageAudioCtx.resume(); } catch {}
      }
      return pageAudioCtx;
    }
    // Proactively resume on any user gesture
    ['click','touchstart','keydown'].forEach(evt => {
      window.addEventListener(evt, () => { getPageAudioCtx().catch(()=>{}); }, { once: true, capture: true });
    });

    // Speech Synthesis helpers
    function listVoices() {
      try { return (window.speechSynthesis?.getVoices?.() || []).filter(v => v.lang && v.lang.toLowerCase().startsWith('en')); } catch { return []; }
    }
    function populateVoices() {
      const sel = document.getElementById('voice'); if (!sel) return;
      const voices = listVoices();
      sel.innerHTML = '';
      voices.forEach((v, idx) => {
        const opt = document.createElement('option');
        opt.value = v.name; opt.textContent = `${v.name} (${v.lang})`;
        sel.appendChild(opt);
      });
      if (!voices.length) {
        const opt = document.createElement('option'); opt.value = ''; opt.textContent = 'default (browser)'; sel.appendChild(opt);
      }
    }
    if (window.speechSynthesis) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = () => populateVoices();
    }
    function getSelectedVoice() {
      try {
        const sel = document.getElementById('voice'); const name = sel?.value;
        const v = listVoices().find(v => v.name === name);
        return v || null;
      } catch { return null; }
    }
    async function speakWithSpeechSynthesis(text, { rate = 1.0, pitch = 1.0, voice = null } = {}) {
      if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) throw new Error('speechSynthesis not available');
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = rate; utt.pitch = pitch; if (voice) utt.voice = voice;
      let tStart = 0; let tEnd = 0;
  const started = new Promise(res => { utt.onstart = () => { tStart = performance.now(); log('🔈 Speaking…'); try { getPageAudioCtx(); } catch {} try { logAudio('speech_play', { textLen: (text||'').length }); } catch {} res(); }; });
  const ended = new Promise((res, rej) => { utt.onerror = (e) => { log('Speech error: '+(e?.error||e)); try { logAudio('speech_play_error', { message: e?.error||String(e) }); } catch {} rej(e?.error || e); }; utt.onend = () => { tEnd = performance.now(); log('✅ Finished speaking'); try { logAudio('speech_play_end', { elapsedMs: +(tEnd - tStart).toFixed(1) }); } catch {} res(); }; });
      window.speechSynthesis.speak(utt);
      // Rough estimate if end not awaited
      const words = (text||'').trim().split(/\s+/).filter(Boolean).length;
      const wps = Math.max(1.5, Math.min(4.0, 2.5 * rate)); // words per second
      const estimateSec = Math.max(0.6, words / wps);
      return { utt, started, ended, estimateSec };
    }

    function maybeContinueConversation(){
      if (REMAINING_TURNS > 0) {
        REMAINING_TURNS--;
        try { listenAndReply(); } catch {}
      }
    }

    // Orchestration stack
    const Orch = window.IchikaOrchestrator;
    const BVHTLCtor = (window.BVHTimeline && window.BVHTimeline.BVHTimeline) || window.BVHTimeline;
    const timeline = new BVHTLCtor({ framerate: 30, lookaheadFrames: 30, onFrameUpdate: (frame, t) => {
      // noop; VRM integration will hook if enabled
    }});
    const orch = new Orch({ timeline, quantumMs: 16, onEvent: (e) => {
      if (e.type === 'chunk') log('chunk@'+e.trackId+' t0='+e.t0.toFixed(2));
      if (e.type === 'speech') log('speech@ t0='+ (e.t0!=null? e.t0.toFixed(2):'0'));
    } });
    timeline.play();

  // VRM binder; connect integration even in stub mode so visemes map to expressions.
  let binder = window.AvatarBinder ? new window.AvatarBinder() : new (class { constructor(){ this.stub=true; this.records=[]; this.blendshapeRecords=[];} updateBone(){} update(){} updateBlendshape(n,w){ this.blendshapeRecords.push({name:n,weight:w}); } getStats(){ return {applied:this.records.length,expressions:this.blendshapeRecords.length,stub:true}; } })();
  let vrmIntegration = new window.BVHTimelineVRMIntegration(binder).connectTimeline(timeline);

    async function maybeLoadVRM() {
      if (!WANT_VRM) return false;
      try {
        const VRMLoaderLite = window.VRMLoaderLite;
        if (!VRMLoaderLite) return false;
        // Fetch a small VRM if available locally; otherwise skip in CI
        const res = await fetch('../../assets/avatars/ichika.vrm');
        if (!res.ok) { log('VRM not found locally; running in stub mode.'); return false; }
        const buf = await res.arrayBuffer();
        const loader = new VRMLoaderLite();
        const { vrm } = await loader.loadFromArrayBuffer(buf, 'ichika.vrm');
  binder = new window.AvatarBinder(vrm);
  // Reconnect integration with the real VRM-backed binder
  vrmIntegration?.disconnectTimeline?.();
  vrmIntegration = new window.BVHTimelineVRMIntegration(binder).connectTimeline(timeline);
        log('VRM loaded.');
        return true;
      } catch (e) {
        log('VRM load failed: ' + (e?.message||e));
        return false;
      }
    }

    function getBackend() {
      const sel = document.getElementById('backend');
      return sel ? sel.value : 'speech';
    }

    // Build TTS visemes/energy from text only (used by all backends)
    function buildTtsFromText(text, durationSec) {
      const clean = (text||'').toLowerCase();
      const rate = parseFloat(document.getElementById('rate')?.value || '1');
      const pitch = parseFloat(document.getElementById('pitch')?.value || '1');
      const voice = getSelectedVoice();
      const words = clean.trim().split(/\s+/).filter(Boolean).length;
      const estDur = durationSec ?? Math.max(0.6, Math.min(6.0, words ? Math.max(0.6, words / Math.max(1.5, 2.5 * rate)) : clean.length * 0.08));
      const dur = estDur;
      const visemes = [];
      const vowelToVis = { a:'a', e:'e', i:'i', o:'o', u:'u' };
      let t = 0; const step = Math.max(0.06, dur / Math.max(6, clean.length));
      for (const ch of clean) { const vi = vowelToVis[ch] || 'rest'; visemes.push({ time: t, id: vi }); t += step; }
      const fps = 30; const frames = Math.round(dur * fps);
      const energy = Array.from({length: frames}, (_,i)=> 0.15 + 0.3*Math.abs(Math.sin(i/4)));
      const tts = { duration: dur, visemes, energy, rate, pitch, voice };
      return tts;
    }

    function scheduleFromTts(tts) {
      const { SpeechGestureScheduler } = window.SpeechGestureScheduler || {};
      if (SpeechGestureScheduler) {
        const fps = 30; orch.scheduleSpeechFromTts(tts, { fps });
        // Briefly pump the scheduler so programmatic calls (tests) progress without mic loop
        const start = performance.now();
        (function pump(){ orch.runSlice(8).then(()=>{ if (performance.now()-start < 1200) requestAnimationFrame(pump); }); })();
      }
      log('🗣️ Scheduled TTS for text: '+ JSON.stringify({ dur: +tts.duration.toFixed(2), visemes: tts.visemes?.length||0 }));
      logAudio('tts_scheduled', { duration: tts.duration, visemes: tts.visemes?.length||0 });
    }

    function energyFromAudioBuffer(abuf) {
      try {
        const ch0 = abuf.getChannelData(0);
        const env = window.AudioEnvelope?.computeRmsEnvelope ? window.AudioEnvelope.computeRmsEnvelope(ch0, abuf.sampleRate, 50, 25) : [];
        return env;
      } catch { return []; }
    }
    // --- On-device ASR (Whisper via transformers.js) ---
    function resampleLinear(pcm, srFrom, srTo){
      if (srFrom === srTo) return pcm; const ratio = srTo / srFrom; const outLen = Math.round(pcm.length * ratio);
      const out = new Float32Array(outLen); for (let i=0;i<outLen;i++){ const x=i/ratio; const x0=Math.floor(x); const x1=Math.min(pcm.length-1,x0+1); const a=x-x0; out[i]=(1-a)*pcm[x0]+a*pcm[x1]; }
      return out;
    }
    async function recordMicSeconds(seconds){
      const ms = Math.max(1, Math.min(10, seconds|0));
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const proc = ctx.createScriptProcessor(4096, 1, 1);
      const chunks = [];
      proc.onaudioprocess = (ev) => { const ch = ev.inputBuffer.getChannelData(0); chunks.push(new Float32Array(ch)); };
      src.connect(proc); proc.connect(ctx.destination);
      await new Promise(r => setTimeout(r, ms*1000));
      try { proc.disconnect(); src.disconnect(); } catch {}
      try { stream.getTracks().forEach(t=>t.stop()); } catch {}
      try { await ctx.close(); } catch {}
      const total = chunks.reduce((a,c)=>a+c.length,0); const out = new Float32Array(total);
      let off=0; for (const c of chunks){ out.set(c,off); off+=c.length; }
      return { pcm: out, sr:  48000 };
    }
    async function runOnDeviceAsr(pcm, sr, modelId){
      const T = await ensureWhisper(); const { pipeline } = T || {};
      if (!pipeline) throw new Error('transformers pipeline unavailable');
      const model = (modelId && modelId.trim()) || 'Xenova/whisper-tiny.en';
      const asr = (window._asrPipeline && window._asrPipeline.__modelId === model)
        ? window._asrPipeline
        : await pipeline('automatic-speech-recognition', model, { quantized: true });
      if (!window._asrPipeline || window._asrPipeline.__modelId !== model) { asr.__modelId = model; window._asrPipeline = asr; }
      let out; try { out = await asr(pcm, { sampling_rate: sr }); } catch { out = await asr({ array: pcm, sampling_rate: sr }); }
      const text = (out?.text || out)?.toString?.() || '';
      return text;
    }

    async function playAudioBuffer(abuf) {
      const ctx = await getPageAudioCtx();
      const src = ctx.createBufferSource();
      let buf = abuf;
      try {
        if (abuf.sampleRate !== ctx.sampleRate) {
          const offline = new OfflineAudioContext(abuf.numberOfChannels, Math.ceil(abuf.duration * ctx.sampleRate), ctx.sampleRate);
          const s = offline.createBufferSource(); s.buffer = abuf; s.connect(offline.destination); s.start();
          buf = await offline.startRendering();
        }
      } catch {}
      src.buffer = buf; src.connect(ctx.destination); src.start();
      logAudio('buffer_play', { dur: buf.duration, sr: buf.sampleRate });
      return new Promise(res => { src.onended = () => { try { src.disconnect(); } catch {} res(); }; });
    }

    async function ensureKokoroInstance(maxWaitMs = 2500) {
      const start = performance.now();
      // Wait for either legacy window.kokoro.create or KokoroTTS runtime
      while (!((window.kokoro && typeof window.kokoro.create === 'function') || (window.KokoroTTS && typeof window.KokoroTTS.from_pretrained === 'function'))) {
        if (performance.now() - start > maxWaitMs) break;
        await new Promise(r => setTimeout(r, 50));
      }
      try {
        if (window.__kokoroInstance) return window.__kokoroInstance;
        // Path 1: legacy/simple API providing create()->instance.speak()
        if (window.kokoro && typeof window.kokoro.create === 'function') {
          const inst = await window.kokoro.create();
          window.__kokoroInstance = inst; return inst;
        }
        // Path 2: kokoro-js exposing KokoroTTS.from_pretrained()
        if (window.KokoroTTS && typeof window.KokoroTTS.from_pretrained === 'function') {
          // Model id can be provided via ModelUrlConfig('kokoro') if not a JS URL, else use a default public model id
          let modelId = null;
          try { if (window.ModelUrlConfig?.getModelUrl) { const v = window.ModelUrlConfig.getModelUrl('kokoro'); if (v && !/\.js($|\?)/i.test(v)) modelId = v; } } catch {}
          if (!modelId) modelId = 'onnx-community/Kokoro-82M-v1.0-ONNX';
          const TTS = await window.KokoroTTS.from_pretrained(modelId);
          // Wrap to a simple .speak(text) that returns { buffer: AudioBuffer }
          const synth = {
            async speak(text) {
              const res = await TTS.generate(text);
              const pcm = (res && (res.audio || res.pcm || res.array || (res instanceof Float32Array && res))) || null;
              const sr = (res && (res.sample_rate || res.sampling_rate)) || 24000;
              if (!(pcm && sr)) throw new Error('kokoro: no audio');
              const ctx = await getPageAudioCtx();
              const buf = ctx.createBuffer(1, pcm.length, sr);
              try { buf.copyToChannel(pcm, 0); } catch { const ch = buf.getChannelData(0); ch.set(pcm); }
              return { buffer: buf };
            }
          };
          window.__kokoroInstance = synth; return synth;
        }
      } catch {}
      return null;
    }

    // Schedule speech using selected backend; when real audio is available, compute energy from it for gestures
    async function scheduleTtsFromText(text, playAudio = true) {
      const backend = getBackend();
      const rate = parseFloat(document.getElementById('rate')?.value || '1');
      const pitch = parseFloat(document.getElementById('pitch')?.value || '1');
      const voice = getSelectedVoice();
      if (backend === 'speech') {
        const tts = buildTtsFromText(text);
        scheduleFromTts(tts);
        if (playAudio && window.speechSynthesis && window.SpeechSynthesisUtterance) {
          const auto = !!document.getElementById('autoListen')?.checked;
          speakWithSpeechSynthesis(text, { rate, pitch, voice })
            .then(async ({ ended }) => { if (auto || REMAINING_TURNS>0) { try { await ended; maybeContinueConversation(); } catch {} } })
            .catch(()=>{ try { playBeepsForText(tts.duration); } catch {} finally { if (REMAINING_TURNS>0 || auto) maybeContinueConversation(); } });
        } else if (playAudio) {
          // Headless / unsupported speech synthesis environment: fallback to beeps
          try { await playBeepsForText(tts.duration); } catch {}
          if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
        }
        log('🎛️ Using backend: speech');
        return;
      }

      if (backend === 'kokoro') {
  // Ensure runtime attempt if user selected kokoro
  await ensureKokoroRuntime();
        const inst = await ensureKokoroInstance();
        if (!inst) {
          log('kokoro error: not loaded; falling back to beeps');
          const tts = buildTtsFromText(text);
          scheduleFromTts(tts);
          if (playAudio) await playBeepsForText(tts.duration);
          log('🎛️ Using backend: kokoro');
          return;
        }
        try {
          const out = await inst.speak(text);
          let abuf = null;
          if (out && typeof out.getAudioBuffer === 'function') abuf = await out.getAudioBuffer();
          else if (out && out.buffer && out.buffer.sampleRate) abuf = out.buffer;
          if (!abuf) throw new Error('no AudioBuffer from kokoro');
          const env = energyFromAudioBuffer(abuf);
          const tts = buildTtsFromText(text, abuf.duration);
          if (env && env.length) tts.energy = env;
          scheduleFromTts(tts);
          if (playAudio) {
            if (!(FORCE_WORKLET && await playViaWorklet(abuf))) await playAudioBuffer(abuf);
          }
          log('🔊 kokoro audio ok');
          if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
        } catch (e) {
          log('kokoro error; fallback to beeps: ' + (e?.message||e));
          const tts = buildTtsFromText(text); scheduleFromTts(tts); if (playAudio) await playBeepsForText(tts.duration);
          if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
        }
        log('🎛️ Using backend: kokoro');
        return;
      }

      if (backend === 'speecht5') {
        try {
          const g = window;
          const canOrt = !!(g.ort && g.ModelUrlConfig && g.ModelUrlConfig.getModelUrl && g.ModelUrlConfig.getModelUrl('speecht5'));
          const transformersLoaded = !!g.transformers;
          if (SPEECHT5_ON_DEVICE && (SPEECHT5_ON_DEVICE_FAKE || transformersLoaded)) {
            await runOnDeviceSpeechT5(text, playAudio);
            log(SPEECHT5_ON_DEVICE_FAKE ? '🧪 SpeechT5 on-device FAKE path' : '🧪 SpeechT5 on-device path');
            if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
          } else if (canOrt && g.SpeechT5OrtTask && g.SpeechT5OrtTask.SpeechT5OrtTask) {
            const { SpeechT5OrtTask } = g.SpeechT5OrtTask; const task = new SpeechT5OrtTask({ provider: 'wasm' }); await task.initialize(g);
            const tts = buildTtsFromText(text); scheduleFromTts(tts); if (playAudio) await playBeepsForText(tts.duration);
            log('🧪 SpeechT5 ORT path initialized');
            if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
          } else if (g.SpeechT5StubTask && g.SpeechT5StubTask.SpeechT5StubTask) {
            const { SpeechT5StubTask } = g.SpeechT5StubTask; const stub = new SpeechT5StubTask({ text, durationSec: Math.max(0.6, text.length * 0.08) });
            const it = stub.run(); const n = await it.next(); const dur = n?.value?.dt || 0.8;
            const tts = buildTtsFromText(text, dur); scheduleFromTts(tts); if (playAudio) await playBeepsForText(tts.duration);
            log('🔁 SpeechT5 stub path');
            if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
          } else {
            const tts = buildTtsFromText(text); scheduleFromTts(tts); if (playAudio) await playBeepsForText(tts.duration);
            log('⚠️ SpeechT5 not available; used fallback');
            if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
          }
        } catch (e) {
          log('speecht5 error; fallback to beeps: ' + (e?.message||e));
          const tts = buildTtsFromText(text); scheduleFromTts(tts); if (playAudio) await playBeepsForText(tts.duration);
          if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
        }
        log('🎛️ Using backend: speecht5');
        return;
      }

      // Fallback beeps only
      const tts = buildTtsFromText(text);
      scheduleFromTts(tts);
      if (playAudio) await playBeepsForText(tts.duration);
      log('🎛️ Using backend: beeps');
  if (REMAINING_TURNS>0 || document.getElementById('autoListen')?.checked) maybeContinueConversation();
    }

    // Simple beeps as stand-in for TTS audio
  async function playBeepsForText(durationSec) {
      const ctx = await getPageAudioCtx();
      if (!ctx) { log('AudioContext unavailable'); return null; }
      // If context remains suspended, inform user
      if (ctx.state !== 'running') {
        try { await ctx.resume(); } catch {}
      }
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(440, ctx.currentTime);
      o.connect(g); g.connect(ctx.destination);
      const now = ctx.currentTime;
      // Smooth attack and release; avoid 0 target for exponential ramp
      g.gain.setValueAtTime(0.0001, now);
      o.start(now);
      g.gain.exponentialRampToValueAtTime(0.4, now + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(0.15, durationSec));
      o.stop(now + Math.max(0.2, durationSec + 0.02));
      // Auto-disconnect to prevent node buildup
  o.onended = () => { try { o.disconnect(); g.disconnect(); } catch {} };
  logAudio('beeps_play', { dur: durationSec });
      return ctx;
    }

    // Microphone energy → gesture task
    let media = null; let audioEnergyTask = null; let micCtx = null; let pcmBuf = [];
    async function startMic() {
      if (media) return;
      media = await navigator.mediaDevices.getUserMedia({ audio: true });
      micCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = micCtx.createMediaStreamSource(media);
      const processor = micCtx.createScriptProcessor(2048, 1, 1);
      source.connect(processor); processor.connect(micCtx.destination);
      pcmBuf = [];
      processor.onaudioprocess = (ev) => {
        const ch = ev.inputBuffer.getChannelData(0);
        pcmBuf.push(new Float32Array(ch));
        if (pcmBuf.length > 64) pcmBuf.shift();
      };
      const { AudioEnergyGestureTask } = window.AudioEnergyGestureTask || {};
      audioEnergyTask = new AudioEnergyGestureTask({ id: 'mic_energy', trackId: 'audio', framerate: 30, chunkMs: 150 });
      orch.submitTask(audioEnergyTask);
      const feed = setInterval(()=>{
        if (!media || !audioEnergyTask) { clearInterval(feed); return; }
        const flat = concatFloat32(pcmBuf); if (flat && flat.length) audioEnergyTask.setPcm(flat, micCtx.sampleRate);
      }, 180);
      const loop = async () => { await orch.runSlice(8); if (media) requestAnimationFrame(loop); };
      loop();
      log('🎙️ Mic started');
    }
    function stopAll() {
      try { media?.getTracks().forEach(t=>t.stop()); } catch {}
      media = null; try { audioEnergyTask?.abort?.abort(); } catch {}
      audioEnergyTask = null; try { micCtx?.close(); } catch {}
      pcmBuf = [];
      log('⏹️ Stopped');
    }
    function concatFloat32(chunks) { if (!chunks?.length) return null; const total = chunks.reduce((a,c)=>a+c.length,0); const out=new Float32Array(total); let off=0; for (const c of chunks){out.set(c,off); off+=c.length;} return out; }

    // Wire UI
    document.getElementById('mic').onclick = () => startMic().catch(e => log('Mic error: '+e.message));
    document.getElementById('stop').onclick = () => stopAll();
    document.getElementById('say').onclick = () => {
      const text = document.getElementById('text').value || 'hello';
      const play = document.getElementById('playAudio').checked;
      scheduleTtsFromText(text, play);
      // Pump scheduler briefly in case no mic loop is active
      const start = performance.now();
      (function pump(){ orch.runSlice(8).then(()=>{ if (performance.now()-start < 1200) requestAnimationFrame(pump); }); })();
    };

    // Listen & Reply: prefer on-device ASR when requested or when SpeechRecognition is unavailable
    function getSpeechRecognitionCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition; }
    async function listenAndReply() {
      if (listeningInProgress) return; listeningInProgress = true;
      const useFake = (ASR_ENGINE === 'fake');
      if (useFake) {
        try {
          log('👂 Listening (fake ASR)…');
          try { logAudio('listen_fake_start'); } catch {}
          // Exercise mic permission & capture path deterministically
          try { await recordMicSeconds(parseInt(qs.get('listenSec')||'2',10) || 2); } catch {}
          try { logAudio('listen_fake_after_record'); } catch {}
          const text = 'testing one two';
          log('📝 Heard: ' + text);
          const reply = `You said: ${text}`;
          document.getElementById('text').value = reply; document.getElementById('playAudio').checked = true;
          await scheduleTtsFromText(reply, true);
          try { logAudio('listen_fake_after_schedule'); } catch {}
          conversationStats.listens++;
          conversationStats.replies++;
          if (REMAINING_TURNS>0) { REMAINING_TURNS--; setTimeout(()=>{ listeningInProgress=false; listenAndReply(); }, 10); return; }
        } catch (e) {
          const fallback = 'Hello there.'; document.getElementById('text').value = fallback; document.getElementById('playAudio').checked = true;
          await scheduleTtsFromText(fallback, true);
          try { logAudio('listen_fake_error'); } catch {}
          conversationStats.listens++;
          conversationStats.replies++;
          if (REMAINING_TURNS>0) { REMAINING_TURNS--; setTimeout(()=>{ listeningInProgress=false; listenAndReply(); }, 10); return; }
        }
        listeningInProgress = false;
        return;
      }
      const useWhisper = (ASR_ENGINE === 'whisper') || !getSpeechRecognitionCtor();
      if (useWhisper) {
        try {
          log('👂 Listening (on-device)…');
          const { pcm, sr } = await recordMicSeconds(parseInt(qs.get('listenSec')||'3',10) || 3);
          const target = 16000; const pcm16 = resampleLinear(pcm, sr, target);
          const model = ASR_MODEL || 'Xenova/whisper-tiny.en';
          const text = await runOnDeviceAsr(pcm16, target, model);
          log('📝 Heard: ' + (text||''));
          const reply = text ? `You said: ${text}` : 'I did not catch that.';
          document.getElementById('text').value = reply; document.getElementById('playAudio').checked = true;
          await scheduleTtsFromText(reply, true);
          conversationStats.listens++;
          conversationStats.replies++;
        } catch (e) {
          log('ASR error: ' + (e?.message||e));
          const fallback = 'Hello there.'; document.getElementById('text').value = fallback; document.getElementById('playAudio').checked = true;
          await scheduleTtsFromText(fallback, true);
          conversationStats.listens++;
          conversationStats.replies++;
        }
  listeningInProgress = false; return;
      }
      // Browser SpeechRecognition path
      const Rec = getSpeechRecognitionCtor();
      const rec = new Rec();
      rec.lang = 'en-US'; rec.interimResults = false; rec.continuous = false;
  return new Promise((resolve) => {
        rec.onresult = async (ev) => {
          try {
            const t = ev.results?.[0]?.[0]?.transcript || '';
            log('📝 Heard: ' + t);
            const reply = t ? `You said: ${t}` : 'I did not catch that.';
            document.getElementById('text').value = reply; document.getElementById('playAudio').checked = true;
            await scheduleTtsFromText(reply, true);
            conversationStats.listens++;
            conversationStats.replies++;
    if (REMAINING_TURNS>0) { REMAINING_TURNS--; setTimeout(()=>{ listeningInProgress=false; listenAndReply(); }, 10); return; }
      } finally { if (listeningInProgress) listeningInProgress=false; resolve(); }
        };
        rec.onerror = async (e) => {
          const err = (e?.error||e); log('Recognition error: ' + err);
          const fallback = (String(err).includes('no-speech') || String(err).includes('aborted')) ? 'Could you repeat that?' : 'Hello there.';
          try { document.getElementById('text').value = fallback; document.getElementById('playAudio').checked = true; await scheduleTtsFromText(fallback, true); } catch {}
          conversationStats.listens++;
          conversationStats.replies++;
      if (REMAINING_TURNS>0) { REMAINING_TURNS--; setTimeout(()=>{ listeningInProgress=false; listenAndReply(); }, 10); resolve(); return; }
      resolve(); if (listeningInProgress) listeningInProgress=false;
        };
        rec.onend = () => { /* no-op */ };
        try { rec.start(); log('👂 Listening...'); } catch (e) { log('Recognition start failed: '+(e?.message||e)); resolve(); }
      });
    }
    document.getElementById('listen').onclick = () => listenAndReply();

    // Push-to-talk (hold Space)
    let pttActive = false;
    window.addEventListener('keydown', async (e) => {
      if (!document.getElementById('ptt')?.checked) return;
      if (e.code === 'Space' && !pttActive) {
        pttActive = true; e.preventDefault(); log('🎙️ PTT down');
        try { await listenAndReply(); } finally { /* wait for single utterance result */ }
      }
    }, { capture: true });
    window.addEventListener('keyup', (e) => {
      if (!document.getElementById('ptt')?.checked) return;
      if (e.code === 'Space') { pttActive = false; log('🛑 PTT up'); }
    }, { capture: true });

    // Expose for tests
    function getStats(){
      const st = binder?.getStats ? binder.getStats() : { applied:0, expressions:0, stub:true };
      return { applied: st.applied||0, expressions: st.expressions||0, stub: !!st.stub };
    }
  window.__ultimateDemo = { startMic, stopAll, sayText: (t,play) => scheduleTtsFromText(t, play), listenAndReply, orch, timeline, getStats, maybeLoadVRM };
  window.__ultimateDemo.getConversationStats = () => ({ ...conversationStats, remaining: REMAINING_TURNS });
  window.__ultimateAudioLog = window.__ultimateAudioLog || [];
  let __lastTtsScheduleTs = null; let __latencies = [];
  function logAudio(type, detail){
    try {
      const now = performance.now();
      const entry = { ts: now, type, ...(detail||{}) };
      // Capture scheduling ts
      if (type === 'tts_scheduled' || /_scheduled$/.test(type)) { __lastTtsScheduleTs = now; }
      // On playback related events compute latency
      if (/(_play$|_play_error$|speech_play_error|beeps_play|buffer_play|pcm_play|speecht5_real_play|speecht5_fallback_play)/.test(type) && __lastTtsScheduleTs != null) {
        const latencyMs = now - __lastTtsScheduleTs;
        entry.latencyMs = +latencyMs.toFixed(1);
        __latencies.push(latencyMs);
        if (__latencies.length>200) __latencies.splice(0,__latencies.length-200);
      }
      window.__ultimateAudioLog.push(entry);
      if (window.__ultimateAudioLog.length>500) window.__ultimateAudioLog.splice(0, window.__ultimateAudioLog.length-500);
      const avgLatency = __latencies.length ? (__latencies.reduce((a,b)=>a+b,0)/__latencies.length) : null;
      window.__ultimateAudioDiag = { lastType: type, total: window.__ultimateAudioLog.length, ctxState: pageAudioCtx? pageAudioCtx.state:'none', avgLatencyMs: avgLatency };
      if (DEBUG_AUDIO) console.debug('[audio-log]', entry);
    } catch {}
  }
  window.__ultimateDemo.getAudioMetrics = () => {
    if (!__latencies.length) return { samples: 0, avgLatencyMs: 0, lastLatencyMs: 0, p50:0,p90:0,p95:0,p99:0 };
    const sum = __latencies.reduce((a,b)=>a+b,0);
    const avg = sum / __latencies.length;
    const last = __latencies[__latencies.length-1];
    const sorted = __latencies.slice().sort((a,b)=>a-b);
    function pct(p){
      if (!sorted.length) return 0; const idx = Math.min(sorted.length-1, Math.floor(p/100 * (sorted.length-1))); return sorted[idx];
    }
    const p50 = pct(50), p90 = pct(90), p95 = pct(95), p99 = pct(99);
    return {
      samples: __latencies.length,
      avgLatencyMs: +avg.toFixed(1),
      lastLatencyMs: +last.toFixed(1),
      p50:+p50.toFixed(1), p90:+p90.toFixed(1), p95:+p95.toFixed(1), p99:+p99.toFixed(1)
    };
  };
  window.__ultimateDemo.getAudioLog = () => window.__ultimateAudioLog.slice();
  window.__ultimateDemo.getAudioDiag = () => window.__ultimateAudioDiag || {};

    // Initialize defaults from query and attempt optional VRM load if requested
    (function initFromQuery(){
      const q = new URLSearchParams(location.search);
      let backend = q.get('backend');
      if (backend) {
        const sel = document.getElementById('backend'); if (sel) sel.value = backend;
        log('Backend preselected: ' + backend);
      } else {
        // Auto-select Kokoro when a kokoro runtime/model hint is present and no backend explicitly chosen
        const hinted = q.get('kokoroJs') || q.get('kokoro') || (window.ModelUrlConfig?.getModelUrl && window.ModelUrlConfig.getModelUrl('kokoro')) || '';
        if (hinted) {
          const sel = document.getElementById('backend'); if (sel) sel.value = 'kokoro';
          log('Backend auto-selected: kokoro');
        }
      }
      // Auto-listen trigger when requested
      if (AUTO_LISTEN) {
        setTimeout(()=>{ try { document.getElementById('listen').click(); } catch {} }, 50);
      }
    })();
    maybeLoadVRM();
  </script>
