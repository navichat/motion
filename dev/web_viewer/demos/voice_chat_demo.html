<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Voice Chat Demo – Talk to Ichika</title>
  <style>
    body{font-family:sans-serif;padding:16px;background:#0b0f14;color:#d7e1ee}
    button{margin-right:8px}
    #log{font:12px ui-monospace,monospace;background:#0a0e13;border:1px solid #16202c;border-radius:6px;padding:8px;height:140px;overflow:auto}
  </style>
</head>
<body>
  <h1>Voice Chat with Ichika</h1>
  <p>Microphone input -> TTS reply audio -> gestures from audio energy envelope. Uses BVHTimeline + Orchestrator.</p>
  <div>
    <button id="mic">Start Mic</button>
    <button id="stop">Stop</button>
    <button id="say">Mock Speak Reply</button>
    <pre id="log"></pre>
  </div>

  <!-- Needed UMD modules -->
  <script src="../src/audio/AudioEnvelope.js"></script>
  <script src="../src/components/animation/timeline/tasks/AudioEnergyGestureTask.js"></script>
  <script src="../src/utils/scheduler/FibonacciHeap.js"></script>
  <script src="../src/utils/scheduler/TaskScheduler.js"></script>
  <script src="../src/components/animation/timeline/TimelineChunkAdapter.js"></script>
  <script src="../src/components/animation/timeline/BVHTimeline.js"></script>
  <script src="../src/orchestrator/IchikaOrchestrator.js"></script>

  <script>
    const log = (m) => { const el = document.getElementById('log'); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };

    // Simple in-page TTS stub: generates a beep tone as reply.
    function ttsBeep(durationMs = 800, freq = 440) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(ctx.destination);
      o.start();
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + durationMs / 1000);
      o.stop(ctx.currentTime + durationMs / 1000);
      return ctx; // caller can stop/close later if needed
    }

    // Orchestrator setup
    const Orch = window.IchikaOrchestrator;
    const BVHTLCtor = (window.BVHTimeline && window.BVHTimeline.BVHTimeline) || window.BVHTimeline;
    const timeline = new BVHTLCtor({ framerate: 30, lookaheadFrames: 30 });
    const orch = new Orch({ timeline, quantumMs: 16, onEvent: (e) => { if (e.type === 'chunk') log('chunk@'+e.trackId+' t0='+e.t0.toFixed(2)); } });
    timeline.play();

    let media = null;
    let audioEnergyTask = null;

    async function startMic() {
      if (media) return;
      media = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const source = ctx.createMediaStreamSource(media);
      const processor = ctx.createScriptProcessor(2048, 1, 1);
      source.connect(processor); processor.connect(ctx.destination);

      const pcm = [];
      processor.onaudioprocess = (ev) => {
        const ch = ev.inputBuffer.getChannelData(0);
        pcm.push(new Float32Array(ch));
        if (pcm.length > 100) pcm.shift(); // keep a sliding window
      };

      // Periodically feed task with concatenated buffer
      setInterval(() => {
        if (!audioEnergyTask) return;
        const flat = concatFloat32(pcm);
        if (flat && flat.length) audioEnergyTask.setPcm(flat, ctx.sampleRate);
      }, 200);

      // Start gesture task
      const { AudioEnergyGestureTask } = window.AudioEnergyGestureTask || {};
      audioEnergyTask = new AudioEnergyGestureTask({ id: 'mic_energy', trackId: 'audio', framerate: 30, chunkMs: 150 });
      orch.submitTask(audioEnergyTask);

      // Scheduler loop
      const runLoop = async () => {
        await orch.runSlice(8);
        if (media) requestAnimationFrame(runLoop);
      };
      runLoop();
      log('🎙️ Mic started');
    }

    function stopAll() {
      if (media) {
        media.getTracks().forEach(t => t.stop());
        media = null;
      }
      if (audioEnergyTask) {
        try { audioEnergyTask.abort.abort(); } catch {}
        audioEnergyTask = null;
      }
      log('⏹️ Stopped');
    }

    function concatFloat32(chunks) {
      if (!chunks || chunks.length === 0) return null;
      const total = chunks.reduce((a,c)=>a+c.length,0);
      const out = new Float32Array(total);
      let off = 0;
      for (const c of chunks) { out.set(c, off); off += c.length; }
      return out;
    }

    async function mockSpeak() {
      // Simulated avatar reply; also schedule a short energy-driven gesture task
      ttsBeep(600, 523.25);
      const { AudioEnergyGestureTask } = window.AudioEnergyGestureTask || {};
      if (AudioEnergyGestureTask) {
        const sr = 16000; const len = sr * 0.8;
        const pcm = new Float32Array(len);
        for (let i=0;i<len;i++) pcm[i] = Math.sin(2*Math.PI*440*i/sr) * (i/len);
        const task = new AudioEnergyGestureTask({ id: 'reply_energy', trackId: 'audio', framerate: 30, chunkMs: 120 });
        task.setPcm(pcm, sr);
        orch.submitTask(task);
        // run scheduler for ~1s
        const start = performance.now();
        (function pump(){
          orch.runSlice(8).then(()=>{
            if (performance.now() - start < 1000) requestAnimationFrame(pump); else { try{task.abort.abort();}catch{} }
          });
        })();
      }
      log('🔊 Avatar speaking (beep)');
    }

    document.getElementById('mic').onclick = () => startMic().catch(e => log('Mic error: ' + e.message));
    document.getElementById('stop').onclick = () => stopAll();
    document.getElementById('say').onclick = () => mockSpeak();

    // Expose for tests
    window.__voiceDemo = { startMic, stopAll, mockSpeak, orch, timeline };
  </script>
</body>
</html>
