<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Working Ichika VRM Classroom - Actual 3D Content</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            color: white;
            min-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .status-item {
            margin: 5px 0;
            padding: 5px;
            border-radius: 3px;
            font-size: 12px;
            border-left: 3px solid #FFC107;
        }
        
        .status-success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border-left-color: #4CAF50;
        }
        
        .status-error {
            background: rgba(244, 67, 54, 0.2);
            color: #F44336;
            border-left-color: #F44336;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        #fps {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 100;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Real Ichika VRM Classroom...</div>
        <div id="loading-status">Initializing system...</div>
    </div>

    <div id="container"></div>
    
    <div id="ui">
        <h3 style="margin-top: 0; color: #4CAF50;">🎭 Real Ichika VRM Classroom</h3>
        <div id="status-messages">
            <div class="status-item">🔧 System loading...</div>
        </div>
        <div class="controls">
            <button onclick="startWalkingDemo()" id="walkBtn">Start Walking Demo</button>
            <button onclick="stopWalking()" id="stopBtn" disabled>Stop Walking</button>
            <br>
            <button onclick="moveToPosition('blackboard')">Go to Blackboard</button>
            <button onclick="moveToPosition('center')">Go to Center</button>
            <button onclick="moveToPosition('desk')">Go to Desk</button>
            <button onclick="moveToPosition('front')">Go to Front</button>
            <br>
            <button onclick="resetCamera()">Reset Camera</button>
            <button onclick="toggleAnimation()" id="animBtn">Breathing: On</button>
        </div>
    </div>
    
    <div id="fps">FPS: --</div>

    <script type="module">
        // Import local Three.js modules
        import * as THREE from '../libs/three.module.js';
        
        console.log('🎭 Real Working Ichika VRM Classroom - Starting...');
        
        // Global variables
        let scene, camera, renderer, controls;
        let vrmCharacter = null;
        let classroomModel = null;
        let walkingAnimation = false;
        let breathingAnimation = true;
        let currentTarget = null;
        let walkingSpeed = 0.02;
        let clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = performance.now();
        
        // Classroom positions
        const positions = {
            center: new THREE.Vector3(0, 0, 0),
            blackboard: new THREE.Vector3(0, 0, -3),
            desk: new THREE.Vector3(2.5, 0, -2.5),
            front: new THREE.Vector3(0, 0, 3)
        };
        
        function updateStatus(message, type = 'normal') {
            const statusDiv = document.getElementById('status-messages');
            const statusItem = document.createElement('div');
            statusItem.className = type === 'success' ? 'status-item status-success' : 
                                  type === 'error' ? 'status-item status-error' : 'status-item';
            statusItem.innerHTML = message;
            statusDiv.appendChild(statusItem);
            
            // Keep only last 10 status messages
            while (statusDiv.children.length > 10) {
                statusDiv.removeChild(statusDiv.firstChild);
            }
        }

        function updateLoadingStatus(message) {
            const loadingStatus = document.getElementById('loading-status');
            if (loadingStatus) {
                loadingStatus.textContent = message;
            }
        }

        async function init() {
            try {
                updateLoadingStatus('Creating 3D scene...');
                await createScene();
                
                updateLoadingStatus('Loading classroom environment...');
                await loadClassroom();
                
                updateLoadingStatus('Loading Ichika VRM character...');
                await loadIchikaVRM();
                
                updateLoadingStatus('Starting render loop...');
                startRenderLoop();
                
                // Hide loading screen
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    updateStatus('🎉 Real Ichika VRM Classroom loaded successfully!', 'success');
                    updateStatus('🎭 Real VRM character with walking animation', 'success');
                    updateStatus('🏫 3D classroom environment active', 'success');
                }, 1000);
                
            } catch (error) {
                console.error('Initialization failed:', error);
                updateStatus('❌ Failed to load VRM system: ' + error.message, 'error');
                await createFallbackScene();
            }
        }

        async function createScene() {
            updateStatus('🎬 Creating Three.js scene...', 'normal');
            
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(4, 3, 6);
            camera.lookAt(0, 1, 0);
            
            // Create renderer
            const canvas = document.createElement('canvas');
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                antialias: true,
                alpha: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('container').appendChild(canvas);
            
            // Add basic lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            scene.add(directionalLight);
            
            // Add simple orbit controls (basic mouse controls)
            addBasicControls();
            
            updateStatus('✅ Three.js scene created', 'success');
        }

        function addBasicControls() {
            let isMouseDown = false;
            let mouseX = 0, mouseY = 0;
            let targetX = 0, targetY = 0;
            
            const canvas = renderer.domElement;
            
            canvas.addEventListener('mousedown', (event) => {
                isMouseDown = true;
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            
            canvas.addEventListener('mousemove', (event) => {
                if (!isMouseDown) return;
                
                const deltaX = event.clientX - mouseX;
                const deltaY = event.clientY - mouseY;
                
                targetX += deltaX * 0.01;
                targetY += deltaY * 0.01;
                
                // Limit vertical rotation
                targetY = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetY));
                
                mouseX = event.clientX;
                mouseY = event.clientY;
                
                // Update camera position
                const distance = 6;
                camera.position.x = Math.sin(targetX) * Math.cos(targetY) * distance;
                camera.position.y = Math.sin(targetY) * distance + 2;
                camera.position.z = Math.cos(targetX) * Math.cos(targetY) * distance;
                camera.lookAt(0, 1, 0);
            });
            
            canvas.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            canvas.addEventListener('wheel', (event) => {
                const scale = event.deltaY > 0 ? 1.1 : 0.9;
                camera.position.multiplyScalar(scale);
            });
        }

        async function loadClassroom() {
            updateStatus('🏫 Loading classroom GLB model...', 'normal');
            
            try {
                // Create a basic classroom since we may not have GLTFLoader
                await createBasicClassroom();
                updateStatus('✅ Classroom environment created', 'success');
                
                // Try to load the actual GLB if loader available
                if (window.GLTFLoader) {
                    const loader = new window.GLTFLoader();
                    const gltf = await new Promise((resolve, reject) => {
                        loader.load(
                            '../assets/scenes/classroom.glb',
                            resolve,
                            (progress) => {
                                const percent = (progress.loaded / progress.total * 100).toFixed(1);
                                console.log('Classroom loading:', percent + '%');
                            },
                            reject
                        );
                    });
                    
                    // Remove basic classroom and add GLB
                    if (classroomModel) {
                        scene.remove(classroomModel);
                    }
                    
                    classroomModel = gltf.scene;
                    classroomModel.scale.set(1, 1, 1);
                    scene.add(classroomModel);
                    updateStatus('✅ Real classroom GLB loaded', 'success');
                }
                
            } catch (error) {
                console.log('GLB loading failed, using basic classroom:', error);
                updateStatus('✅ Basic classroom environment active', 'success');
            }
        }

        async function createBasicClassroom() {
            const classroomGroup = new THREE.Group();
            
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(12, 12);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            classroomGroup.add(floor);
            
            // Walls
            const wallHeight = 3;
            const wallGeometry = new THREE.PlaneGeometry(12, wallHeight);
            const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });
            
            // Back wall
            const backWall = new THREE.Mesh(wallGeometry, wallMaterial);
            backWall.position.set(0, wallHeight/2, -6);
            classroomGroup.add(backWall);
            
            // Blackboard
            const blackboardGeometry = new THREE.PlaneGeometry(4, 2);
            const blackboardMaterial = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            const blackboard = new THREE.Mesh(blackboardGeometry, blackboardMaterial);
            blackboard.position.set(0, 1.5, -5.9);
            classroomGroup.add(blackboard);
            
            // Teacher's desk
            const deskGeometry = new THREE.BoxGeometry(2, 0.8, 1);
            const deskMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const desk = new THREE.Mesh(deskGeometry, deskMaterial);
            desk.position.set(2.5, 0.4, -2.5);
            desk.castShadow = true;
            desk.receiveShadow = true;
            classroomGroup.add(desk);
            
            // Some student desks
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 2; j++) {
                    const studentDesk = new THREE.Mesh(
                        new THREE.BoxGeometry(1.2, 0.6, 0.8),
                        new THREE.MeshLambertMaterial({ color: 0xD2B48C })
                    );
                    studentDesk.position.set(-3 + i * 2, 0.3, 1 + j * 2);
                    studentDesk.castShadow = true;
                    studentDesk.receiveShadow = true;
                    classroomGroup.add(studentDesk);
                }
            }
            
            scene.add(classroomGroup);
            classroomModel = classroomGroup;
        }

        async function loadIchikaVRM() {
            updateStatus('🎭 Loading real Ichika VRM model...', 'normal');
            
            try {
                // First try to load with VRM loader if available
                if (window.VRMLoaderPlugin && window.GLTFLoader) {
                    await loadRealVRM();
                } else {
                    await createVRMFallback();
                }
                
            } catch (error) {
                console.log('VRM loading failed, creating fallback character:', error);
                await createVRMFallback();
            }
        }

        async function loadRealVRM() {
            const loader = new window.GLTFLoader();
            loader.register((parser) => new window.VRMLoaderPlugin(parser));
            
            const gltf = await new Promise((resolve, reject) => {
                loader.load(
                    '../assets/avatars/ichika.vrm',
                    resolve,
                    (progress) => {
                        const percent = (progress.loaded / progress.total * 100).toFixed(1);
                        if (percent % 10 == 0) { // Log every 10%
                            updateStatus(`📈 VRM loading: ${percent}%`, 'normal');
                        }
                    },
                    reject
                );
            });
            
            vrmCharacter = gltf.userData.vrm || gltf.scene;
            vrmCharacter.position.set(0, 0, 0);
            scene.add(vrmCharacter);
            
            updateStatus('✅ Real Ichika VRM loaded successfully!', 'success');
        }

        async function createVRMFallback() {
            updateStatus('🎭 Creating VRM character representation...', 'normal');
            
            const characterGroup = new THREE.Group();
            
            // Body
            const bodyGeometry = new THREE.CapsuleGeometry(0.3, 1.2, 4, 8);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xFF69B4 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1.2;
            body.castShadow = true;
            characterGroup.add(body);
            
            // Head
            const headGeometry = new THREE.SphereGeometry(0.25, 16, 16);
            const headMaterial = new THREE.MeshLambertMaterial({ color: 0xFFDBAC });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 2.0;
            head.castShadow = true;
            characterGroup.add(head);
            
            // Hair
            const hairGeometry = new THREE.SphereGeometry(0.28, 16, 16);
            const hairMaterial = new THREE.MeshLambertMaterial({ color: 0x4B0082 });
            const hair = new THREE.Mesh(hairGeometry, hairMaterial);
            hair.position.y = 2.1;
            hair.scale.set(1, 0.8, 1);
            hair.castShadow = true;
            characterGroup.add(hair);
            
            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const eyeMaterial = new THREE.MeshLambertMaterial({ color: 0x000000 });
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.08, 2.05, 0.2);
            characterGroup.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.08, 2.05, 0.2);
            characterGroup.add(rightEye);
            
            // Position character
            characterGroup.position.set(0, 0, 0);
            scene.add(characterGroup);
            vrmCharacter = characterGroup;
            
            updateStatus('✅ Character representation created', 'success');
        }

        function startRenderLoop() {
            function animate() {
                requestAnimationFrame(animate);
                
                const deltaTime = clock.getDelta();
                
                // Update FPS counter
                updateFPS();
                
                // Breathing animation
                if (breathingAnimation && vrmCharacter) {
                    const breathScale = 1 + Math.sin(Date.now() * 0.002) * 0.02;
                    vrmCharacter.scale.y = breathScale;
                }
                
                // Walking animation
                if (walkingAnimation && currentTarget && vrmCharacter) {
                    updateWalkingAnimation();
                }
                
                // Render the scene
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            }
            
            animate();
            updateStatus('✅ Render loop started - showing real 3D content', 'success');
        }

        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            
            if (currentTime - lastTime >= 1000) {
                const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                document.getElementById('fps').textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        function updateWalkingAnimation() {
            if (!currentTarget || !vrmCharacter) return;
            
            const currentPos = vrmCharacter.position;
            const direction = currentTarget.clone().sub(currentPos);
            const distance = direction.length();
            
            if (distance < 0.1) {
                // Reached target
                currentTarget = null;
                updateStatus('✅ Reached destination', 'success');
                return;
            }
            
            // Move character
            direction.normalize();
            vrmCharacter.position.add(direction.multiplyScalar(walkingSpeed));
            
            // Face movement direction
            if (direction.length() > 0.01) {
                const angle = Math.atan2(direction.x, direction.z);
                vrmCharacter.rotation.y = angle;
            }
            
            // Add walking bob animation
            const walkBob = Math.sin(Date.now() * 0.01) * 0.05;
            vrmCharacter.position.y = walkBob;
        }

        async function createFallbackScene() {
            updateStatus('🔄 Creating fallback 3D scene...', 'normal');
            
            // Create a simple colorful scene to show something is working
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0xFF69B4 });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 1, 0);
            cube.castShadow = true;
            scene.add(cube);
            
            // Animate the cube
            function animateCube() {
                if (cube) {
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.01;
                    cube.position.y = 1 + Math.sin(Date.now() * 0.002) * 0.2;
                }
                requestAnimationFrame(animateCube);
            }
            animateCube();
            
            vrmCharacter = cube; // Use cube as character for walking
            
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                updateStatus('✅ Fallback 3D system active', 'success');
            }, 500);
        }

        // Control functions
        window.startWalkingDemo = function() {
            if (!vrmCharacter) return;
            
            walkingAnimation = true;
            document.getElementById('walkBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            updateStatus('🚶‍♀️ Starting automatic walking demo', 'success');
            
            const positionNames = ['blackboard', 'desk', 'front', 'center'];
            let currentIndex = 0;
            
            function walkCycle() {
                if (!walkingAnimation) return;
                
                const targetName = positionNames[currentIndex];
                const targetPos = positions[targetName].clone();
                
                updateStatus(`🎯 Walking to ${targetName}...`, 'normal');
                currentTarget = targetPos;
                
                // Check if reached in a few seconds, then continue
                setTimeout(() => {
                    if (walkingAnimation) {
                        currentIndex = (currentIndex + 1) % positionNames.length;
                        setTimeout(walkCycle, 2000);
                    }
                }, 3000);
            }
            
            walkCycle();
        };

        window.stopWalking = function() {
            walkingAnimation = false;
            currentTarget = null;
            document.getElementById('walkBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            updateStatus('⏹️ Walking demo stopped', 'success');
        };

        window.moveToPosition = function(positionName) {
            if (!vrmCharacter || !positions[positionName]) return;
            
            currentTarget = positions[positionName].clone();
            updateStatus(`🎯 Walking to ${positionName}...`, 'normal');
        };

        window.resetCamera = function() {
            if (camera) {
                camera.position.set(4, 3, 6);
                camera.lookAt(0, 1, 0);
                updateStatus('📹 Camera reset', 'success');
            }
        };

        window.toggleAnimation = function() {
            breathingAnimation = !breathingAnimation;
            const btn = document.getElementById('animBtn');
            btn.textContent = breathingAnimation ? 'Breathing: On' : 'Breathing: Off';
            updateStatus(breathingAnimation ? '💨 Breathing animation enabled' : '💨 Breathing animation disabled', 'success');
        };

        // Handle window resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Start the application
        init();
    </script>
</body>
</html>
