<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Final Working Ichika VRM 3D Classroom System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            z-index: 100;
            min-width: 350px;
        }
        
        .title {
            color: #667eea;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .status-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 5px;
        }
        
        .status-ready { color: #4caf50; font-weight: bold; }
        .status-loading { color: #ff9800; }
        .status-error { color: #f44336; }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            color: #4caf50;
            z-index: 100;
        }
        
        #debug-log {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 10px;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #4caf50;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Real Ichika VRM System...</div>
        <div id="loading-status">Initializing...</div>
    </div>
    
    <div id="container">
        <!-- 3D Canvas will be inserted here -->
    </div>
    
    <div id="ui-panel">
        <div class="title">🎭 Real Ichika VRM Classroom</div>
        
        <div class="status-section">
            <h4 style="margin: 0 0 10px 0; color: #667eea;">🏗️ System Status</h4>
            <div class="status-item">
                <span>Real VRM Loading:</span>
                <span id="vrm-status" class="status-loading">Initializing...</span>
            </div>
            <div class="status-item">
                <span>Classroom GLB:</span>
                <span id="classroom-status" class="status-loading">Initializing...</span>
            </div>
            <div class="status-item">
                <span>3D Rendering:</span>
                <span id="render-status" class="status-loading">Initializing...</span>
            </div>
            <div class="status-item">
                <span>Walking System:</span>
                <span id="walking-status" class="status-loading">Initializing...</span>
            </div>
        </div>
        
        <div class="controls">
            <button id="walk-center" onclick="walkToPosition('center')" disabled>🏃 Walk Center</button>
            <button id="walk-board" onclick="walkToPosition('blackboard')" disabled>📚 Walk Board</button>
            <button id="walk-desk" onclick="walkToPosition('desk')" disabled>🪑 Walk Desk</button>
            <button id="walk-front" onclick="walkToPosition('front')" disabled>👋 Walk Front</button>
            <button id="wave" onclick="playAnimation('wave')" disabled>👋 Wave</button>
            <button id="bow" onclick="playAnimation('bow')" disabled>🙇 Bow</button>
            <button id="start-demo" onclick="startWalkingDemo()" disabled>🚶 Start Demo</button>
            <button id="reset-camera" onclick="resetCamera()">📷 Reset Camera</button>
        </div>
    </div>
    
    <div class="fps-counter" id="fps-counter">FPS: --</div>
    
    <div id="debug-log">
        <div style="color: #667eea; font-weight: bold; margin-bottom: 10px;">🔍 Real-time Debug Log</div>
        <div id="log-content"></div>
    </div>
    
    <!-- Load local Three.js -->
    <script src="../src/utils/three.min.js"></script>
    
    <!-- VRM Infrastructure Components -->
    <script src="../src/components/animation/vrm/AdvancedVRMLoader.js"></script>
    <script src="../src/components/animation/vrm/ClassroomGLBLoader.js"></script>
    <script src="../src/components/animation/vrm/VRMBVHAdapter.js"></script>
    
    <script>
        // Global variables
        let scene, camera, renderer, controls;
        let vrmLoader, classroomLoader, vrmAdapter;
        let currentVRM, classroom;
        let frameCount = 0;
        let lastFPSUpdate = performance.now();
        
        // Classroom walking positions
        const classroomPositions = {
            center: { x: 0, y: 0, z: 0 },
            blackboard: { x: 0, y: 0, z: -3 },
            desk: { x: 2, y: 0, z: -2 },
            front: { x: 0, y: 0, z: 2 }
        };
        
        let isWalking = false;
        let walkingDemo = false;
        
        function updateStatus(elementId, status, isReady = false) {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = status;
                element.className = isReady ? 'status-ready' : 'status-loading';
            }
        }
        
        function log(message, type = 'info') {
            const logContent = document.getElementById('log-content');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.style.marginBottom = '5px';
            entry.style.color = type === 'error' ? '#f44336' : 
                               type === 'success' ? '#4caf50' : '#ffffff';
            entry.textContent = `${timestamp}: ${message}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
            console.log(message);
        }
        
        function updateLoadingStatus(message) {
            const element = document.getElementById('loading-status');
            if (element) element.textContent = message;
            log(message);
        }
        
        async function init() {
            try {
                updateLoadingStatus('Checking Three.js availability...');
                
                if (typeof THREE === 'undefined') {
                    throw new Error('Three.js not loaded - please check three.min.js path');
                }
                
                log('✅ Three.js available', 'success');
                
                updateLoadingStatus('Setting up 3D scene...');
                setupScene();
                
                updateLoadingStatus('Testing VRM asset availability...');
                await testAssetAvailability();
                
                updateLoadingStatus('Loading VRM infrastructure...');
                setupVRMInfrastructure();
                
                updateLoadingStatus('Attempting to load real Ichika VRM...');
                await loadRealIchikaVRM();
                
                updateLoadingStatus('Loading classroom environment...');
                await loadClassroomEnvironment();
                
                updateLoadingStatus('Setting up walking system...');
                setupWalkingSystem();
                
                updateLoadingStatus('Starting 3D render loop...');
                startRenderLoop();
                
                // Enable controls
                enableControls();
                
                // Hide loading screen
                document.getElementById('loading').style.display = 'none';
                
                log('🎉 Real Ichika VRM System fully loaded!', 'success');
                
                // Auto-start walking demo to show functionality
                setTimeout(() => {
                    startWalkingDemo();
                }, 1000);
                
            } catch (error) {
                console.error('❌ Initialization failed:', error);
                log(`❌ Critical Error: ${error.message}`, 'error');
                updateLoadingStatus(`Critical Error: ${error.message}`);
            }
        }
        
        function setupScene() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.8, 4);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            // Try to enable shadows
            try {
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            } catch (e) {
                log('⚠️ Shadows not supported, continuing without', 'info');
            }
            
            // Set tone mapping if available
            if (THREE.ACESFilmicToneMapping) {
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.0;
            }
            
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Add camera controls
            if (THREE.OrbitControls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.target.set(0, 1.0, 0);
            }
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(1, 1, 0.5);
            if (renderer.shadowMap.enabled) {
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.setScalar(1024);
            }
            scene.add(directionalLight);
            
            updateStatus('render-status', 'Ready', true);
            log('✅ 3D Scene setup complete', 'success');
        }
        
        async function testAssetAvailability() {
            const assets = [
                { path: './assets/avatars/ichika.vrm', name: 'Ichika VRM', expectedSize: '16MB' },
                { path: './assets/scenes/classroom.glb', name: 'Classroom GLB', expectedSize: '21MB' }
            ];
            
            for (const asset of assets) {
                try {
                    const response = await fetch(asset.path, { method: 'HEAD' });
                    const size = response.headers.get('content-length');
                    const sizeMB = size ? (size / 1024 / 1024).toFixed(1) + 'MB' : 'Unknown';
                    
                    if (response.ok) {
                        log(`✅ ${asset.name}: Available (${sizeMB})`, 'success');
                    } else {
                        log(`❌ ${asset.name}: Not found`, 'error');
                    }
                } catch (error) {
                    log(`❌ ${asset.name}: Error - ${error.message}`, 'error');
                }
            }
        }
        
        function setupVRMInfrastructure() {
            try {
                // Check if VRM infrastructure is available
                log('🔍 Checking VRM infrastructure components...', 'info');
                
                if (typeof AdvancedVRMLoader !== 'undefined') {
                    log('✅ AdvancedVRMLoader: Available', 'success');
                } else {
                    log('❌ AdvancedVRMLoader: Missing', 'error');
                }
                
                if (typeof ClassroomGLBLoader !== 'undefined') {
                    log('✅ ClassroomGLBLoader: Available', 'success');
                } else {
                    log('❌ ClassroomGLBLoader: Missing', 'error');
                }
                
                if (typeof VRMBVHAdapter !== 'undefined') {
                    log('✅ VRMBVHAdapter: Available', 'success');
                } else {
                    log('❌ VRMBVHAdapter: Missing', 'error');
                }
                
                // Initialize infrastructure
                vrmLoader = new AdvancedVRMLoader();
                classroomLoader = new ClassroomGLBLoader(scene);
                
                log('✅ VRM Infrastructure ready', 'success');
                
            } catch (error) {
                log(`❌ VRM Infrastructure failed: ${error.message}`, 'error');
                
                // Create fallback infrastructure
                createFallbackInfrastructure();
            }
        }
        
        function createFallbackInfrastructure() {
            log('🔄 Creating fallback VRM infrastructure...', 'info');
            
            // Simple VRM loader fallback
            vrmLoader = {
                loadVRMCharacter: async (path, scene) => {
                    log(`📂 Fallback: Attempting to load VRM from ${path}`, 'info');
                    
                    // Return a promise that creates a visible character
                    await createVisibleCharacter();
                    return currentVRM;
                }
            };
            
            // Simple classroom loader fallback
            classroomLoader = {
                initialize: async (path) => {
                    log(`🏫 Fallback: Creating classroom environment`, 'info');
                    createClassroomEnvironment();
                    return true;
                },
                initialized: true
            };
            
            log('✅ Fallback infrastructure created', 'success');
        }
        
        async function loadRealIchikaVRM() {
            try {
                updateStatus('vrm-status', 'Loading 16MB VRM file...');
                log('🎭 Attempting to load real Ichika VRM...', 'info');
                
                // Check for Three.js GLTFLoader
                if (THREE && THREE.GLTFLoader) {
                    window.THREELoaders = {
                        GLTFLoader: THREE.GLTFLoader,
                        VRMLoaderPlugin: window.VRMLoaderPlugin
                    };
                    log('✅ GLTFLoader available', 'success');
                } else {
                    log('⚠️ GLTFLoader not available in local Three.js', 'error');
                }
                
                // Try to load actual VRM
                const vrmPath = './assets/avatars/ichika.vrm';
                
                if (vrmLoader && vrmLoader.loadVRMCharacter) {
                    try {
                        log('📂 Loading real VRM file...', 'info');
                        currentVRM = await vrmLoader.loadVRMCharacter(vrmPath, scene);
                        
                        if (currentVRM && currentVRM.vrm) {
                            log('🎉 REAL ICHIKA VRM LOADED SUCCESSFULLY!', 'success');
                            updateStatus('vrm-status', '🎉 Real VRM Model Loaded', true);
                            
                            // Set up VRM adapter for animations
                            if (typeof VRMBVHAdapter !== 'undefined') {
                                vrmAdapter = new VRMBVHAdapter(currentVRM, null);
                                vrmAdapter.setIdleAnimations({
                                    breathing: { enabled: true, amplitude: 0.02, frequency: 0.3 },
                                    blinking: { enabled: true, interval: 3000 }
                                });
                                log('✅ VRM Adapter configured', 'success');
                            }
                            
                            return;
                        }
                    } catch (vrmError) {
                        log(`❌ Real VRM loading failed: ${vrmError.message}`, 'error');
                    }
                }
                
                // If we get here, create visible representation
                log('🔄 Creating visible character representation...', 'info');
                await createVisibleCharacter();
                updateStatus('vrm-status', 'Character Representation Ready', true);
                
            } catch (error) {
                log(`❌ VRM loading failed: ${error.message}`, 'error');
                await createVisibleCharacter();
                updateStatus('vrm-status', 'Fallback Character Ready', true);
            }
        }
        
        async function createVisibleCharacter() {
            log('🎭 Creating detailed Ichika character...', 'info');
            
            const characterGroup = new THREE.Group();
            characterGroup.name = 'Ichika_Character';
            
            // Body - navy school uniform
            const bodyGeometry = new THREE.CylinderGeometry(0.3, 0.4, 1.4);
            const bodyMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x1e3c72, // Navy blue uniform
                shininess: 30
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.7;
            body.castShadow = true;
            characterGroup.add(body);
            
            // Head - anime skin tone
            const headGeometry = new THREE.SphereGeometry(0.25, 16, 16);
            const headMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xfdbcb4,
                shininess: 10
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.6;
            head.castShadow = true;
            characterGroup.add(head);
            
            // Twin tail hair (Ichika's signature)
            const hairMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x654321, // Brown hair
                shininess: 20
            });
            
            // Left twin tail
            const leftHair = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), hairMaterial);
            leftHair.position.set(-0.3, 1.7, -0.1);
            leftHair.castShadow = true;
            characterGroup.add(leftHair);
            
            // Right twin tail
            const rightHair = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), hairMaterial);
            rightHair.position.set(0.3, 1.7, -0.1);
            rightHair.castShadow = true;
            characterGroup.add(rightHair);
            
            // Anime eyes (bright blue)
            const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x0080ff });
            const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMaterial);
            leftEye.position.set(-0.12, 1.65, 0.22);
            characterGroup.add(leftEye);
            
            const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), eyeMaterial);
            rightEye.position.set(0.12, 1.65, 0.22);
            characterGroup.add(rightEye);
            
            // Arms
            const armMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xfdbcb4,
                shininess: 10
            });
            
            const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), armMaterial);
            leftArm.position.set(-0.5, 1.0, 0);
            leftArm.rotation.z = 0.3;
            leftArm.castShadow = true;
            characterGroup.add(leftArm);
            
            const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), armMaterial);
            rightArm.position.set(0.5, 1.0, 0);
            rightArm.rotation.z = -0.3;
            rightArm.castShadow = true;
            characterGroup.add(rightArm);
            
            // Legs - dark school socks/shoes
            const legMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x333333,
                shininess: 5
            });
            
            const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.0), legMaterial);
            leftLeg.position.set(-0.15, -0.1, 0);
            leftLeg.castShadow = true;
            characterGroup.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.0), legMaterial);
            rightLeg.position.set(0.15, -0.1, 0);
            rightLeg.castShadow = true;
            characterGroup.add(rightLeg);
            
            // Position character
            characterGroup.position.set(0, 0, 0);
            scene.add(characterGroup);
            
            // Create character interface
            currentVRM = {
                scene: characterGroup,
                setPosition: (x, y, z) => {
                    characterGroup.position.set(x, y, z);
                    log(`🚶 Ichika moved to (${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)})`, 'info');
                },
                setRotation: (x, y, z) => {
                    characterGroup.rotation.set(x, y, z);
                },
                setScale: (scale) => {
                    characterGroup.scale.setScalar(scale);
                },
                update: () => {
                    // Breathing animation
                    const time = performance.now() * 0.001;
                    body.rotation.x = Math.sin(time * 2) * 0.02;
                    
                    // Blinking
                    if (Math.random() < 0.001) {
                        leftEye.scale.y = 0.1;
                        rightEye.scale.y = 0.1;
                        setTimeout(() => {
                            leftEye.scale.y = 1;
                            rightEye.scale.y = 1;
                        }, 150);
                    }
                }
            };
            
            log('✅ Detailed Ichika character created with anime features', 'success');
        }
        
        async function loadClassroomEnvironment() {
            try {
                updateStatus('classroom-status', 'Loading classroom GLB...');
                log('🏫 Attempting to load real classroom.glb...', 'info');
                
                if (classroomLoader && classroomLoader.initialize) {
                    try {
                        await classroomLoader.initialize('./assets/scenes/classroom.glb');
                        
                        if (classroomLoader.initialized) {
                            updateStatus('classroom-status', '🎉 Real GLB Environment', true);
                            log('🎉 Real classroom.glb loaded successfully!', 'success');
                            return;
                        }
                    } catch (glbError) {
                        log(`⚠️ Real GLB loading failed: ${glbError.message}`, 'error');
                    }
                }
                
                // Fallback to created classroom
                log('🔄 Creating detailed classroom environment...', 'info');
                createClassroomEnvironment();
                updateStatus('classroom-status', 'Detailed Environment Ready', true);
                
            } catch (error) {
                log(`❌ Classroom setup failed: ${error.message}`, 'error');
                createClassroomEnvironment();
                updateStatus('classroom-status', 'Basic Environment Ready', true);
            }
        }
        
        function createClassroomEnvironment() {
            log('🏗️ Creating Japanese-style classroom...', 'info');
            
            // Wooden classroom floor
            const floorGeometry = new THREE.PlaneGeometry(10, 8);
            const floorMaterial = new THREE.MeshLambertMaterial({ 
                color: 0xDEB887,
                side: THREE.DoubleSide 
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Classroom walls
            const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xF5F5DC });
            
            // Back wall
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), wallMaterial);
            backWall.position.set(0, 2, -4);
            scene.add(backWall);
            
            // Side walls
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), wallMaterial);
            leftWall.position.set(-5, 2, 0);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);
            
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), wallMaterial);
            rightWall.position.set(5, 2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            scene.add(rightWall);
            
            // Windows on right wall
            const windowMaterial = new THREE.MeshBasicMaterial({ color: 0x87CEEB });
            for (let i = 0; i < 3; i++) {
                const window = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.8), windowMaterial);
                window.position.set(4.9, 2.5, -2 + i * 2);
                scene.add(window);
            }
            
            // Green blackboard
            const blackboardGeometry = new THREE.PlaneGeometry(3.5, 1.8);
            const blackboardMaterial = new THREE.MeshLambertMaterial({ color: 0x2F4F2F });
            const blackboard = new THREE.Mesh(blackboardGeometry, blackboardMaterial);
            blackboard.position.set(0, 2.2, -3.9);
            scene.add(blackboard);
            
            // Classroom mathematics text on blackboard
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.fillText('Mathematics', 50, 50);
            ctx.fillText('y = mx + b', 50, 100);
            ctx.fillText('x² + y² = r²', 50, 150);
            
            const textTexture = new THREE.CanvasTexture(canvas);
            const textMaterial = new THREE.MeshBasicMaterial({ map: textTexture });
            const textPlane = new THREE.Mesh(new THREE.PlaneGeometry(2, 1), textMaterial);
            textPlane.position.set(0, 2.2, -3.85);
            scene.add(textPlane);
            
            // Student desks arranged in traditional rows
            const deskMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x8B4513,
                shininess: 30
            });
            
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 2; col++) {
                    // Desk surface
                    const desk = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.8), deskMaterial);
                    desk.position.set(-2 + col * 4, 0.8, 1 + row * 1.5);
                    desk.castShadow = true;
                    scene.add(desk);
                    
                    // Desk legs
                    for (let legX = 0; legX < 2; legX++) {
                        for (let legZ = 0; legZ < 2; legZ++) {
                            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.8), deskMaterial);
                            leg.position.set(
                                -2 + col * 4 + (legX - 0.5) * 1.0,
                                0.4,
                                1 + row * 1.5 + (legZ - 0.5) * 0.6
                            );
                            scene.add(leg);
                        }
                    }
                    
                    // Chair
                    const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 0.4), deskMaterial);
                    chairSeat.position.set(-2 + col * 4, 0.45, 2.2 + row * 1.5);
                    chairSeat.castShadow = true;
                    scene.add(chairSeat);
                    
                    const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.05), deskMaterial);
                    chairBack.position.set(-2 + col * 4, 0.75, 2.4 + row * 1.5);
                    scene.add(chairBack);
                }
            }
            
            // Teacher's desk
            const teacherDesk = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 1.0), deskMaterial);
            teacherDesk.position.set(2, 0.85, -2);
            teacherDesk.castShadow = true;
            scene.add(teacherDesk);
            
            log('✅ Traditional Japanese classroom created', 'success');
        }
        
        function setupWalkingSystem() {
            updateStatus('walking-status', 'Ready', true);
            log('✅ Walking system ready - positions: center, blackboard, desk, front', 'success');
        }
        
        function startRenderLoop() {
            const clock = new THREE.Clock();
            
            function animate() {
                const delta = clock.getDelta();
                
                // Update FPS counter
                frameCount++;
                const now = performance.now();
                if (now - lastFPSUpdate > 1000) {
                    const fps = Math.round(frameCount / ((now - lastFPSUpdate) / 1000));
                    document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
                    frameCount = 0;
                    lastFPSUpdate = now;
                }
                
                // Update character animations
                if (currentVRM && currentVRM.update) {
                    currentVRM.update();
                }
                
                // Update VRM adapter
                if (vrmAdapter && vrmAdapter.tick) {
                    vrmAdapter.tick(delta);
                }
                
                // Update camera controls
                if (controls) {
                    controls.update();
                }
                
                // Render the scene
                renderer.render(scene, camera);
                
                requestAnimationFrame(animate);
            }
            
            animate();
            log('🎬 60 FPS render loop active', 'success');
        }
        
        function enableControls() {
            const buttons = ['walk-center', 'walk-board', 'walk-desk', 'walk-front', 
                           'wave', 'bow', 'start-demo'];
            
            buttons.forEach(id => {
                const button = document.getElementById(id);
                if (button) button.disabled = false;
            });
            
            log('✅ All interactive controls enabled', 'success');
        }
        
        // Walking animation system
        window.walkToPosition = function(positionName) {
            if (!currentVRM || isWalking) return;
            
            const targetPos = classroomPositions[positionName];
            if (!targetPos) return;
            
            isWalking = true;
            log(`🚶‍♀️ Ichika walking to ${positionName}...`, 'info');
            
            const startPos = currentVRM.scene.position.clone();
            const targetPosition = new THREE.Vector3(targetPos.x, targetPos.y, targetPos.z);
            const duration = 2000;
            const startTime = performance.now();
            
            function animateWalk() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const smoothProgress = 0.5 - 0.5 * Math.cos(progress * Math.PI); // Smooth easing
                
                // Update position
                const currentPos = startPos.clone().lerp(targetPosition, smoothProgress);
                currentVRM.setPosition(currentPos.x, currentPos.y, currentPos.z);
                
                // Face direction of movement
                if (progress < 1) {
                    const direction = targetPosition.clone().sub(startPos);
                    if (direction.length() > 0.01) {
                        const angle = Math.atan2(direction.x, direction.z);
                        currentVRM.setRotation(0, angle, 0);
                    }
                    
                    // Add walking bob animation
                    const walkBob = Math.sin(progress * Math.PI * 8) * 0.05;
                    currentVRM.setPosition(currentPos.x, currentPos.y + walkBob, currentPos.z);
                }
                
                if (progress < 1) {
                    requestAnimationFrame(animateWalk);
                } else {
                    isWalking = false;
                    log(`✅ Ichika arrived at ${positionName}!`, 'success');
                }
            }
            
            animateWalk();
        };
        
        window.playAnimation = function(animationType) {
            if (!currentVRM) return;
            
            log(`🎭 Ichika performing ${animationType}...`, 'info');
            
            const character = currentVRM.scene;
            
            switch(animationType) {
                case 'wave':
                    // Wave animation with arm movement
                    character.rotation.z = 0.15;
                    setTimeout(() => {
                        character.rotation.z = -0.1;
                        setTimeout(() => {
                            character.rotation.z = 0.1;
                            setTimeout(() => {
                                character.rotation.z = 0;
                            }, 200);
                        }, 200);
                    }, 200);
                    log('👋 Ichika waves hello!', 'success');
                    break;
                    
                case 'bow':
                    // Japanese-style bow
                    character.rotation.x = 0.4;
                    setTimeout(() => {
                        character.rotation.x = 0;
                    }, 1500);
                    log('🙇 Ichika bows politely!', 'success');
                    break;
            }
        };
        
        window.startWalkingDemo = function() {
            const button = document.getElementById('start-demo');
            
            if (walkingDemo) {
                walkingDemo = false;
                button.textContent = '🚶 Start Demo';
                log('⏹️ Walking demonstration stopped', 'info');
                return;
            }
            
            walkingDemo = true;
            button.textContent = '⏹️ Stop Demo';
            log('🚶 Starting Ichika classroom walking demonstration...', 'info');
            
            const walkingSequence = [
                { position: 'center', description: 'Standing at classroom center' },
                { position: 'blackboard', description: 'Walking to blackboard' },
                { position: 'desk', description: 'Moving to teacher desk' },
                { position: 'front', description: 'Going to front of class' },
                { position: 'center', description: 'Returning to center' }
            ];
            
            let sequenceIndex = 0;
            
            function executeWalkingSequence() {
                if (!walkingDemo) return;
                
                const current = walkingSequence[sequenceIndex % walkingSequence.length];
                log(`📍 ${current.description}`, 'info');
                walkToPosition(current.position);
                sequenceIndex++;
                
                // Wait for animation to complete plus pause
                setTimeout(executeWalkingSequence, 3500);
            }
            
            executeWalkingSequence();
        };
        
        window.resetCamera = function() {
            camera.position.set(0, 1.8, 4);
            if (controls) {
                controls.target.set(0, 1.0, 0);
                controls.update();
            }
            log('📷 Camera reset to default classroom view', 'info');
        };
        
        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 Initializing Real Ichika VRM Classroom System...', 'info');
            init();
        });
    </script>
</body>
