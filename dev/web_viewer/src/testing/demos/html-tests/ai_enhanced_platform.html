<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Enhanced Motion Viewer - Real AI Inference Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #222;
            color: white;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #0084ff;
            text-align: center;
            margin-bottom: 20px;
        }
        .ai-status {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #0084ff;
        }
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .model-card {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #666;
        }
        .model-card.loading {
            border-left-color: #ffa500;
        }
        .model-card.success {
            border-left-color: #00ff00;
        }
        .model-card.error {
            border-left-color: #ff0000;
        }
        .model-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
        }
        .model-status {
            font-size: 0.9em;
            color: #ccc;
        }
        .controls {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        button {
            background: #0084ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0066cc;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .log {
            background: #111;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .metric-card {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #0084ff;
        }
        .metric-label {
            font-size: 0.9em;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI-Enhanced Motion Viewer</h1>
        
        <div class="ai-status">
            <h2>🧠 Real AI Inference Status</h2>
            <p id="aiStatus">Initializing AI model system...</p>
        </div>
        
        <div class="metrics">
            <div class="metric-card">
                <div class="metric-value" id="modelsLoaded">0</div>
                <div class="metric-label">Models Loaded</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="inferenceCount">0</div>
                <div class="metric-label">Inferences Run</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="successRate">0%</div>
                <div class="metric-label">Success Rate</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="avgTime">0ms</div>
                <div class="metric-label">Avg Time</div>
            </div>
        </div>
        
        <div class="controls">
            <h3>🎮 AI Model Controls</h3>
            <button id="loadModelsBtn">Load All AI Models</button>
            <button id="runInferenceBtn" disabled>Run Batch Inference</button>
            <button id="runContinuousBtn" disabled>Start Continuous Inference</button>
            <button id="stopContinuousBtn" disabled>Stop Continuous</button>
            <button id="clearLogBtn">Clear Log</button>
        </div>
        
        <div class="model-grid" id="modelGrid">
            <!-- Model cards will be populated here -->
        </div>
        
        <div class="log" id="logOutput"></div>
    </div>

    <script>
        // Enhanced AI Model Manager for comprehensive testing
        class ComprehensiveAIModelManager {
            constructor() {
                this.models = new Map();
                this.isInitialized = false;
                this.ort = null;
                this.metrics = {
                    modelsLoaded: 0,
                    inferenceCount: 0,
                    successCount: 0,
                    totalTime: 0
                };
                this.continuousMode = false;
                this.continuousInterval = null;
                
                this.MODEL_PATHS = {
                    'FaceFormer': '/engine/web_porting_poc/faceformer/faceformer_minimal.onnx',
                    'Audio2Gesture': '/audio2gesture_step_fixed.onnx',
                    'RSMT_DeepPhase': '/RSMT-Realtime-Stylized-Motion-Transition/output/web_viewer/deepphase.onnx',
                    'RSMT_StyleVAE': '/RSMT-Realtime-Stylized-Motion-Transition/output/web_viewer/stylevae.onnx',
                    'RSMT_TransitionNet': '/RSMT-Realtime-Stylized-Motion-Transition/output/web_viewer/transitionnet.onnx',
                    'GenericModel': '/engine/python_ref/model.onnx',
                    'FaceFormer_Simple': '/engine/web_porting_poc/faceformer/faceformer_simple_step.onnx',
                    'FaceFormer_Fixed': '/engine/web_porting_poc/faceformer/faceformer_fixed_length.onnx',
                    'FaceFormer_Vocaset': '/engine/web_porting_poc/faceformer/faceformer_vocaset_simple.onnx'
                };
            }
            
            log(message, type = 'info') {
                const timestamp = new Date().toISOString().substr(11, 8);
                const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
                const fullMessage = `[${timestamp}] ${prefix} ${message}`;
                
                console.log(fullMessage);
                
                const logOutput = document.getElementById('logOutput');
                if (logOutput) {
                    logOutput.innerHTML += fullMessage + '<br>';
                    logOutput.scrollTop = logOutput.scrollHeight;
                }
                
                // Update status
                const statusEl = document.getElementById('aiStatus');
                if (statusEl) {
                    statusEl.textContent = message;
                }
                
                // Output for comprehensive test collection
                if (type === 'success' || message.includes('inference') || message.includes('model')) {
                    console.log(`AI_MODEL_OUTPUT: ${JSON.stringify({
                        type: 'ai_model_activity',
                        message: message,
                        timestamp: new Date().toISOString(),
                        metrics: this.metrics
                    })}`);
                }
            }
            
            async initialize() {
                if (this.isInitialized) return true;
                
                try {
                    this.log('Initializing ONNX Runtime for comprehensive AI testing...');
                    
                    // Import ONNX Runtime with fallbacks
                    const versions = ['1.19.0', '1.18.0', '1.17.3'];
                    
                    for (const version of versions) {
                        try {
                            if (window.ort) {
                                this.ort = window.ort;
                                break;
                            }
                            
                            const ortModule = await import(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${version}/dist/ort.min.js`);
                            this.ort = ortModule.default || ortModule;
                            
                            // Configure for main thread
                            this.ort.env.wasm.numThreads = 1;
                            this.ort.env.wasm.simd = false;
                            this.ort.env.wasm.proxy = false;
                            
                            this.log(`ONNX Runtime ${version} loaded successfully`, 'success');
                            break;
                            
                        } catch (versionError) {
                            this.log(`ONNX Runtime ${version} failed: ${versionError.message}`, 'warning');
                        }
                    }
                    
                    if (!this.ort) {
                        throw new Error('All ONNX Runtime versions failed');
                    }
                    
                    this.isInitialized = true;
                    this.createModelCards();
                    return true;
                    
                } catch (error) {
                    this.log(`Failed to initialize ONNX Runtime: ${error.message}`, 'error');
                    return false;
                }
            }
            
            createModelCards() {
                const grid = document.getElementById('modelGrid');
                if (!grid) return;
                
                grid.innerHTML = '';
                
                for (const [modelType, modelPath] of Object.entries(this.MODEL_PATHS)) {
                    const card = document.createElement('div');
                    card.className = 'model-card';
                    card.id = `card-${modelType}`;
                    
                    card.innerHTML = `
                        <div class="model-name">${modelType}</div>
                        <div class="model-status" id="status-${modelType}">Ready to load</div>
                        <div style="font-size: 0.8em; color: #888; margin-top: 5px;">${modelPath}</div>
                    `;
                    
                    grid.appendChild(card);
                }
            }
            
            updateModelStatus(modelType, status, type = 'info') {
                const card = document.getElementById(`card-${modelType}`);
                const statusEl = document.getElementById(`status-${modelType}`);
                
                if (card) {
                    card.className = `model-card ${type}`;
                }
                
                if (statusEl) {
                    statusEl.textContent = status;
                }
            }
            
            async loadModel(modelType, modelPath) {
                if (this.models.has(modelType)) {
                    return this.models.get(modelType);
                }
                
                await this.initialize();
                
                if (!this.ort) {
                    this.log(`ONNX Runtime not available for ${modelType}`, 'warning');
                    return this.createMockModel(modelType);
                }
                
                try {
                    this.updateModelStatus(modelType, 'Loading...', 'loading');
                    this.log(`Loading ${modelType} from ${modelPath}`);
                    
                    // Check if model file exists first by attempting to fetch
                    try {
                        const response = await fetch(modelPath, { method: 'HEAD' });
                        if (!response.ok) {
                            throw new Error(`Model file not found (HTTP ${response.status}): ${modelPath}`);
                        }
                        this.log(`✓ Model file found: ${modelPath}`);
                    } catch (fetchError) {
                        throw new Error(`Model file access failed: ${fetchError.message}`);
                    }
                    
                    const session = await this.ort.InferenceSession.create(modelPath, {
                        executionProviders: ['cpu'],
                        graphOptimizationLevel: 'disabled'
                    });
                    
                    this.log(`✅ Successfully loaded REAL ${modelType} model (NOT MOCK!)`, 'success');
                    this.updateModelStatus(modelType, 'REAL MODEL LOADED', 'success');
                    this.models.set(modelType, session);
                    this.metrics.modelsLoaded++;
                    this.updateMetrics();
                    
                    return session;
                    
                } catch (error) {
                    this.log(`❌ Failed to load ${modelType}: ${error.message}`, 'error');
                    this.updateModelStatus(modelType, `Error: ${error.message}`, 'error');
                    
                    // Only use mock if we specifically can't load the real model
                    this.log(`⚠️ Falling back to MOCK session for ${modelType}`, 'warning');
                    const mockModel = this.createMockModel(modelType);
                    this.models.set(modelType, mockModel);
                    return mockModel;
                }
            }
            
            createMockModel(modelType) {
                return {
                    isMock: true,
                    modelType: modelType,
                    run: async (inputs) => {
                        // Return realistic mock outputs
                        const outputSize = modelType.includes('Whisper') ? 100 : 
                                         modelType.includes('FaceFormer') ? 512 : 
                                         modelType.includes('Audio2Gesture') ? 75 : 10;
                        
                        return {
                            output: new this.ort.Tensor('float32', new Float32Array(outputSize).fill(0.1), [1, outputSize])
                        };
                    }
                };
            }
            
            async loadAllModels() {
                this.log('Starting batch model loading...', 'info');
                const results = [];
                
                for (const [modelType, modelPath] of Object.entries(this.MODEL_PATHS)) {
                    const result = await this.loadModel(modelType, modelPath);
                    results.push({ modelType, success: !result.isMock });
                    
                    // Small delay between loads
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                const successCount = results.filter(r => r.success).length;
                this.log(`Batch loading complete: ${successCount}/${results.length} models loaded successfully`, 'success');
                
                return results;
            }
            
            async runInference(modelType, modelPath, inputs = null) {
                const startTime = Date.now();
                const model = await this.loadModel(modelType, modelPath);
                
                try {
                    // Generate appropriate inputs if not provided
                    if (!inputs) {
                        inputs = this.generateInputs(modelType, model);
                    }
                    
                    const result = await model.run(inputs);
                    const elapsed = Date.now() - startTime;
                    
                    this.metrics.inferenceCount++;
                    this.metrics.successCount++;
                    this.metrics.totalTime += elapsed;
                    this.updateMetrics();
                    
                    const resultType = model.isMock ? '(MOCK)' : '(REAL AI)';
                    this.log(`✅ ${modelType} inference ${resultType} completed in ${elapsed}ms`, 'success');
                    
                    return {
                        success: true,
                        result: result,
                        isMock: model.isMock || false,
                        isRealAI: !model.isMock,
                        modelType: modelType,
                        executionTime: elapsed
                    };
                    
                } catch (error) {
                    const elapsed = Date.now() - startTime;
                    this.metrics.inferenceCount++;
                    this.metrics.totalTime += elapsed;
                    this.updateMetrics();
                    
                    this.log(`❌ ${modelType} inference failed: ${error.message}`, 'error');
                    return {
                        success: false,
                        error: error.message,
                        modelType: modelType,
                        executionTime: elapsed,
                        isMock: false,
                        isRealAI: false
                    };
                }
            }
            
            generateInputs(modelType, model) {
                // Generate appropriate inputs based on model type
                let inputTensor;
                let inputName = 'input';
                
                // Try to get actual input names from model
                if (model.inputNames && model.inputNames.length > 0) {
                    inputName = model.inputNames[0];
                }
                
                if (modelType.includes('Audio2Gesture')) {
                    inputTensor = new this.ort.Tensor('float32', new Float32Array(1 * 26).fill(0.1), [1, 26]);
                } else if (modelType.includes('FaceFormer')) {
                    inputTensor = new this.ort.Tensor('float32', new Float32Array(1 * 512).fill(0.1), [1, 512]);
                } else if (modelType.includes('RSMT')) {
                    inputTensor = new this.ort.Tensor('float32', new Float32Array(1 * 75).fill(0.1), [1, 75]);
                } else if (modelType.includes('Whisper')) {
                    inputTensor = new this.ort.Tensor('float32', new Float32Array(80 * 100).fill(0.1), [1, 80, 100]);
                } else {
                    inputTensor = new this.ort.Tensor('float32', new Float32Array(1 * 10).fill(0.1), [1, 10]);
                }
                
                const inputs = {};
                inputs[inputName] = inputTensor;
                return inputs;
            }
            
            async runBatchInference() {
                this.log('Starting batch inference across all models...', 'info');
                const results = [];
                
                for (const [modelType, modelPath] of Object.entries(this.MODEL_PATHS)) {
                    const result = await this.runInference(modelType, modelPath);
                    results.push(result);
                    
                    // Small delay between inferences
                    await new Promise(resolve => setTimeout(resolve, 200));
                }
                
                const successCount = results.filter(r => r.success).length;
                this.log(`Batch inference complete: ${successCount}/${results.length} successful`, 'success');
                
                // Output results for comprehensive test collection
                console.log('AI_MODEL_BATCH_RESULTS:', JSON.stringify(results, null, 2));
                
                return results;
            }
            
            startContinuousInference() {
                if (this.continuousMode) return;
                
                this.continuousMode = true;
                this.log('Starting continuous inference mode...', 'info');
                
                this.continuousInterval = setInterval(async () => {
                    if (!this.continuousMode) return;
                    
                    // Pick a random model to run inference on
                    const modelTypes = Object.keys(this.MODEL_PATHS);
                    const randomModel = modelTypes[Math.floor(Math.random() * modelTypes.length)];
                    const modelPath = this.MODEL_PATHS[randomModel];
                    
                    await this.runInference(randomModel, modelPath);
                    
                }, 2000); // Run inference every 2 seconds
            }
            
            stopContinuousInference() {
                this.continuousMode = false;
                if (this.continuousInterval) {
                    clearInterval(this.continuousInterval);
                    this.continuousInterval = null;
                }
                this.log('Continuous inference mode stopped', 'info');
            }
            
            updateMetrics() {
                document.getElementById('modelsLoaded').textContent = this.metrics.modelsLoaded;
                document.getElementById('inferenceCount').textContent = this.metrics.inferenceCount;
                
                const successRate = this.metrics.inferenceCount > 0 
                    ? Math.round((this.metrics.successCount / this.metrics.inferenceCount) * 100)
                    : 0;
                document.getElementById('successRate').textContent = successRate + '%';
                
                const avgTime = this.metrics.inferenceCount > 0
                    ? Math.round(this.metrics.totalTime / this.metrics.inferenceCount)
                    : 0;
                document.getElementById('avgTime').textContent = avgTime + 'ms';
            }
            
            clearLog() {
                const logOutput = document.getElementById('logOutput');
                if (logOutput) {
                    logOutput.innerHTML = '';
                }
            }
        }
        
        // Initialize the system
        const aiManager = new ComprehensiveAIModelManager();
        window.aiManager = aiManager; // Make it globally accessible for testing
        
        // Setup event handlers
        document.addEventListener('DOMContentLoaded', () => {
            // Button handlers
            document.getElementById('loadModelsBtn').onclick = async () => {
                document.getElementById('loadModelsBtn').disabled = true;
                await aiManager.loadAllModels();
                document.getElementById('runInferenceBtn').disabled = false;
                document.getElementById('runContinuousBtn').disabled = false;
                document.getElementById('loadModelsBtn').disabled = false;
            };
            
            document.getElementById('runInferenceBtn').onclick = async () => {
                document.getElementById('runInferenceBtn').disabled = true;
                await aiManager.runBatchInference();
                document.getElementById('runInferenceBtn').disabled = false;
            };
            
            document.getElementById('runContinuousBtn').onclick = () => {
                aiManager.startContinuousInference();
                document.getElementById('runContinuousBtn').disabled = true;
                document.getElementById('stopContinuousBtn').disabled = false;
            };
            
            document.getElementById('stopContinuousBtn').onclick = () => {
                aiManager.stopContinuousInference();
                document.getElementById('runContinuousBtn').disabled = false;
                document.getElementById('stopContinuousBtn').disabled = true;
            };
            
            document.getElementById('clearLogBtn').onclick = () => {
                aiManager.clearLog();
            };
            
            // Auto-initialize and start testing
            setTimeout(async () => {
                await aiManager.initialize();
                
                // Auto-load models for comprehensive testing
                setTimeout(async () => {
                    aiManager.log('Auto-starting AI model comprehensive testing...', 'info');
                    await aiManager.loadAllModels();
                    
                    // Auto-run batch inference
                    setTimeout(async () => {
                        await aiManager.runBatchInference();
                        
                        // Start continuous mode for ongoing testing
                        setTimeout(() => {
                            aiManager.startContinuousInference();
                        }, 5000);
                        
                    }, 3000);
                }, 2000);
            }, 1000);
        });
        
        // Expose results for Playwright collection
        window.getAIModelResults = () => {
            return {
                metrics: aiManager.metrics,
                models: Array.from(aiManager.models.keys()),
                isInitialized: aiManager.isInitialized,
                continuousMode: aiManager.continuousMode
            };
        };
    </script>
</body>
</html>
