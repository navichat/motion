<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Worker Syntax Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .test-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        #status {
            font-size: 18px;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .success { background: rgba(0, 255, 0, 0.2); border: 2px solid #00ff00; }
        .error { background: rgba(255, 0, 0, 0.2); border: 2px solid #ff0000; }
        .loading { background: rgba(255, 255, 0, 0.2); border: 2px solid #ffff00; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        button:hover { background: #5a6fd8; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Quick Conversation Worker Test</h1>
        <p>This test verifies that the conversation worker loads without syntax errors.</p>
        
        <div id="status" class="loading">Testing worker syntax...</div>
        
        <button onclick="testWorker()">Test Worker Again</button>
        <button onclick="clearStatus()">Clear Status</button>
        
        <div id="log"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff6b6b' : type === 'success' ? '#51cf66' : '#74c0fc';
            
            logDiv.innerHTML += `<div style="color: ${color}; margin: 5px 0;">[${timestamp}] ${message}</div>`;
        }
        
        function updateStatus(message, type = 'loading') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type;
        }
        
        function testWorker() {
            updateStatus('Creating worker...', 'loading');
            log('Attempting to create conversation worker...');
            
            try {
                const worker = new Worker('./js/conversationWorkerWorking.js');
                
                let hasError = false;
                
                worker.onmessage = function(e) {
                    if (!hasError) {
                        updateStatus('✅ Worker loaded successfully! No syntax errors.', 'success');
                        log('Worker created and is responding to messages', 'success');
                        log(`First message received: ${JSON.stringify(e.data)}`, 'info');
                    }
                };
                
                worker.onerror = function(error) {
                    hasError = true;
                    updateStatus('❌ Worker failed to load - syntax error detected', 'error');
                    log(`Worker error: ${error.message}`, 'error');
                    log(`Error details: ${JSON.stringify(error)}`, 'error');
                };
                
                // Give the worker a moment to load and send a test message
                setTimeout(() => {
                    if (!hasError) {
                        log('Sending test message to worker...', 'info');
                        worker.postMessage({ type: 'test', data: 'Hello worker' });
                    }
                }, 1000);
                
                // Terminate worker after test
                setTimeout(() => {
                    worker.terminate();
                    log('Worker terminated after test', 'info');
                }, 3000);
                
            } catch (error) {
                updateStatus('❌ Failed to create worker', 'error');
                log(`Worker creation failed: ${error.message}`, 'error');
            }
        }
        
        function clearStatus() {
            document.getElementById('log').innerHTML = '';
            updateStatus('Ready to test...', 'loading');
        }
        
        // Auto-run test on page load
        window.addEventListener('load', testWorker);
    </script>
</body>
</html>
