<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Audio Generation Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .test-result {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }
        .success { border-left: 5px solid #4CAF50; }
        .warning { border-left: 5px solid #FF9800; }
        .error { border-left: 5px solid #F44336; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover { background: #5a6fd8; }
        audio { width: 100%; margin: 10px 0; }
        #waveform {
            width: 100%;
            height: 100px;
            background: #333;
            border: 1px solid #666;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 TTS Audio Generation Test</h1>
        <p>Testing that the conversation worker now generates actual audio data instead of silence.</p>
        
        <button onclick="testTTSGeneration()">Test TTS Audio Generation</button>
        <button onclick="clearResults()">Clear Results</button>
        
        <div id="results"></div>
        
        <div id="audioSection" style="display: none;">
            <h3>Generated Audio:</h3>
            <audio id="audioPlayer" controls></audio>
            <canvas id="waveform" width="800" height="100"></canvas>
            <div id="audioStats"></div>
        </div>
    </div>

    <script>
        function addResult(message, type = 'success') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('audioSection').style.display = 'none';
        }
        
        function visualizeWaveform(audioData) {
            const canvas = document.getElementById('waveform');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = '#4CAF50';
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            const step = audioData.length / width;
            for (let i = 0; i < width; i++) {
                const index = Math.floor(i * step);
                const amplitude = audioData[index] || 0;
                const y = (1 - amplitude) * height / 2;
                
                if (i === 0) {
                    ctx.moveTo(i, y);
                } else {
                    ctx.lineTo(i, y);
                }
            }
            
            ctx.stroke();
        }
        
        function analyzeAudioData(audioData) {
            let maxAmplitude = 0;
            let nonZeroSamples = 0;
            let rms = 0;
            
            for (let i = 0; i < audioData.length; i++) {
                const sample = Math.abs(audioData[i]);
                maxAmplitude = Math.max(maxAmplitude, sample);
                if (sample > 0.001) nonZeroSamples++;
                rms += sample * sample;
            }
            
            rms = Math.sqrt(rms / audioData.length);
            
            return {
                maxAmplitude,
                nonZeroSamples,
                totalSamples: audioData.length,
                rms,
                hasAudio: nonZeroSamples > audioData.length * 0.1
            };
        }
        
        async function testTTSGeneration() {
            addResult('Creating conversation worker...', 'warning');
            
            try {
                const worker = new Worker('./js/conversationWorkerWorking.js');
                
                worker.onmessage = function(e) {
                    const { type, result, message } = e.data;
                    
                    if (type === 'info') {
                        addResult(`Worker: ${message}`, 'warning');
                    }
                    
                    if (type === 'output' && result && result.audio) {
                        const audioData = result.audio;
                        const sampleRate = result.sampleRate || 16000;
                        
                        addResult('✅ Audio data received!', 'success');
                        
                        // Analyze the audio data
                        const analysis = analyzeAudioData(audioData);
                        
                        addResult(`Audio Analysis:
                        - Total samples: ${analysis.totalSamples}
                        - Non-zero samples: ${analysis.nonZeroSamples}
                        - Max amplitude: ${analysis.maxAmplitude.toFixed(4)}
                        - RMS level: ${analysis.rms.toFixed(4)}
                        - Has actual audio: ${analysis.hasAudio ? '✅ YES' : '❌ NO'}`, 
                        analysis.hasAudio ? 'success' : 'error');
                        
                        if (analysis.hasAudio) {
                            // Create audio buffer and play
                            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                            const audioBuffer = audioContext.createBuffer(1, audioData.length, sampleRate);
                            const channelData = audioBuffer.getChannelData(0);
                            channelData.set(audioData);
                            
                            // Convert to WAV blob for playback
                            const wavBlob = audioBufferToWav(audioBuffer);
                            const audioUrl = URL.createObjectURL(wavBlob);
                            
                            const audioPlayer = document.getElementById('audioPlayer');
                            audioPlayer.src = audioUrl;
                            
                            // Show audio section and visualize
                            document.getElementById('audioSection').style.display = 'block';
                            visualizeWaveform(audioData);
                            
                            document.getElementById('audioStats').innerHTML = `
                                <strong>Audio Stats:</strong><br>
                                Duration: ${(audioData.length / sampleRate).toFixed(2)}s<br>
                                Sample Rate: ${sampleRate}Hz<br>
                                Bit Depth: 32-bit Float<br>
                                <a href="${audioUrl}" download="tts-test.wav">📥 Download WAV</a>
                            `;
                            
                            addResult('🎵 Audio ready for playback!', 'success');
                        }
                        
                        worker.terminate();
                    }
                    
                    if (type === 'error') {
                        addResult(`❌ Worker error: ${message}`, 'error');
                        worker.terminate();
                    }
                };
                
                worker.onerror = function(error) {
                    addResult(`❌ Worker failed to load: ${error.message}`, 'error');
                };
                
                // Initialize and test
                addResult('Initializing worker...', 'warning');
                worker.postMessage({ type: 'init' });
                
                // Wait a bit then test TTS
                setTimeout(() => {
                    addResult('Testing TTS generation...', 'warning');
                    worker.postMessage({ 
                        type: 'test_tts', 
                        text: 'Hello! This is a test of the improved TTS system that should generate actual audio data.'
                    });
                }, 2000);
                
            } catch (error) {
                addResult(`❌ Test failed: ${error.message}`, 'error');
            }
        }
        
        function audioBufferToWav(buffer) {
            const length = buffer.length;
            const arrayBuffer = new ArrayBuffer(44 + length * 2);
            const view = new DataView(arrayBuffer);
            
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, buffer.sampleRate, true);
            view.setUint32(28, buffer.sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, length * 2, true);
            
            const channelData = buffer.getChannelData(0);
            let offset = 44;
            for (let i = 0; i < length; i++) {
                const sample = Math.max(-1, Math.min(1, channelData[i]));
                view.setInt16(offset, sample * 0x7FFF, true);
                offset += 2;
            }
            
            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }
    </script>
</body>
</html>
