<!DOCTYPE html>
<html>
<head>
    <title>Direct AI Model Test</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js"></script>
</head>
<body>
    <h1>Direct AI Model Test</h1>
    <div id="output"></div>
    <button id="testButton">Run AI Model Tests</button>
    
    <script>
        const output = document.getElementById('output');
        const testButton = document.getElementById('testButton');
        
        function log(message, type = 'info') {
            console.log(message);
            const div = document.createElement('div');
            div.textContent = `[${new Date().toISOString()}] ${message}`;
            div.style.color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
            output.appendChild(div);
        }
        
        const MODEL_PATHS = {
            'FaceFormer': 'dev/engine/web_porting_poc/faceformer/faceformer_minimal.onnx',
            'Audio2Gesture': 'audio2gesture_step_fixed.onnx',
            'RSMT_DeepPhase': 'RSMT-Realtime-Stylized-Motion-Transition/output/web_viewer/deepphase.onnx',
            'RSMT_StyleVAE': 'RSMT-Realtime-Stylized-Motion-Transition/output/web_viewer/stylevae.onnx',
            'RSMT_TransitionNet': 'RSMT-Realtime-Stylized-Motion-Transition/output/web_viewer/transitionnet.onnx',
            'Whisper_Encoder': 'transformers.js-examples/whisper-web/dist/onnx/whisper-base/encoder_model.onnx',
            'Whisper_Decoder': 'transformers.js-examples/whisper-web/dist/onnx/whisper-base/decoder_model_merged.onnx',
            'GenericModel': 'dev/engine/python_ref/model.onnx',
            'TinyLlama': 'dev/models/tinyllama_model.onnx',  // May not exist - will test gracefully
            'Kokoro': 'dev/models/kokoro_v0_19.onnx'         // May not exist - will test gracefully
        };
        
        async function testSingleModel(modelType, modelPath) {
            try {
                log(`🔄 Testing ${modelType}...`);
                
                // Configure ONNX Runtime for simple execution
                ort.env.wasm.numThreads = 1;
                ort.env.wasm.simd = false;
                ort.env.wasm.proxy = false;
                
                // Try to create session
                const session = await ort.InferenceSession.create(modelPath, {
                    executionProviders: ['cpu'],
                    graphOptimizationLevel: 'disabled'
                });
                
                log(`✅ ${modelType} model loaded successfully`, 'success');
                
                // Create dummy input based on model type and inspect model inputs
                let inputTensor;
                let inputName = 'input'; // Default input name
                
                // Get model input info
                const inputNames = session.inputNames;
                if (inputNames && inputNames.length > 0) {
                    inputName = inputNames[0];
                    log(`📝 ${modelType} input name: ${inputName}`);
                }
                
                // Create appropriate input tensor based on model type
                if (modelType.includes('TinyLlama') || modelType.includes('DiabloGPT')) {
                    inputTensor = new ort.Tensor('int64', [101, 2023, 2003, 102], [1, 4]);
                } else if (modelType.includes('Whisper')) {
                    inputTensor = new ort.Tensor('float32', new Float32Array(80 * 100).fill(0.1), [1, 80, 100]);
                } else if (modelType.includes('Audio2Gesture')) {
                    inputTensor = new ort.Tensor('float32', new Float32Array(1 * 26).fill(0.1), [1, 26]);
                } else if (modelType.includes('FaceFormer')) {
                    inputTensor = new ort.Tensor('float32', new Float32Array(1 * 512).fill(0.1), [1, 512]);
                } else if (modelType.includes('RSMT')) {
                    inputTensor = new ort.Tensor('float32', new Float32Array(1 * 75).fill(0.1), [1, 75]);
                } else {
                    // Generic input
                    inputTensor = new ort.Tensor('float32', new Float32Array(1 * 10).fill(0.1), [1, 10]);
                }
                
                // Prepare inputs object
                const inputs = {};
                inputs[inputName] = inputTensor;
                
                log(`🔮 ${modelType} running inference with input shape: ${inputTensor.dims.join('x')}`);
                
                // Run inference
                const results = await session.run(inputs);
                
                log(`🎉 ${modelType} inference completed successfully!`, 'success');
                log(`📊 ${modelType} output shape: ${Object.keys(results).join(', ')}`);
                
                return { success: true, modelType, results };
                
            } catch (error) {
                log(`❌ ${modelType} failed: ${error.message}`, 'error');
                return { success: false, modelType, error: error.message };
            }
        }
        
        async function runAllTests() {
            testButton.disabled = true;
            log('🚀 Starting direct AI model tests...');
            
            const results = [];
            let successCount = 0;
            
            for (const [modelType, modelPath] of Object.entries(MODEL_PATHS)) {
                const result = await testSingleModel(modelType, modelPath);
                results.push(result);
                
                if (result.success) {
                    successCount++;
                }
                
                // Small delay between tests
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            log(`\n📊 Test Results: ${successCount}/${results.length} models successful`);
            
            // Output results for Playwright collection
            window.aiModelTestResults = results;
            console.log('AI_MODEL_TEST_RESULTS:', JSON.stringify(results, null, 2));
            
            testButton.disabled = false;
        }
        
        testButton.addEventListener('click', runAllTests);
        
        // Auto-start tests after page load
        setTimeout(() => {
            runAllTests();
        }, 1000);
    </script>
</body>
</html>
