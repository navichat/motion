<!DOCTYPE html>
<html>
<head>
    <title>Task Manager Test Runner</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { padding: 20px; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task Manager Test Runner</h1>
        <button id="run-tests" class="btn btn-primary">Run Tests</button>
        <div id="results"></div>
    </div>

    <script type="module">
        import { TaskManagerTestSuite } from './src/testing/TaskManagerTestSuite.js';

        const runTestsButton = document.getElementById('run-tests');
        const resultsContainer = document.getElementById('results');

        runTestsButton.addEventListener('click', async () => {
            resultsContainer.innerHTML = '';
            const testSuite = new TaskManagerTestSuite();
            const results = await testSuite.runAllTests();
            results.forEach(result => {
                const resultElement = document.createElement('div');
                resultElement.className = `alert ${result.passed ? 'alert-success' : 'alert-danger'}`;
                resultElement.textContent = `${result.name}: ${result.passed ? 'Passed' : 'Failed'}`;
                resultsContainer.appendChild(resultElement);
            });
        });
    </script>
</body>
</html>
