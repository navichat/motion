<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple-to-Apple KNN Benchmark</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            line-height: 1.6;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 2.5em;
        }
        .benchmark-specs {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 2px solid #4CAF50;
        }
        .benchmark-specs h3 {
            color: #4CAF50;
            margin-top: 0;
        }
        .spec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .spec-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .spec-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffeb3b;
        }
        .spec-label {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 5px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .test-section h3 {
            color: #ffeb3b;
            margin-top: 0;
        }
        button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 8px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        button.danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }
        button.info {
            background: linear-gradient(45deg, #2196F3, #1976D2);
        }
        .output {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 15px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .metric-label {
            opacity: 0.8;
        }
        .metric-value {
            font-weight: bold;
            color: #ffeb3b;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
            font-size: 16px;
        }
        .status.success {
            background: rgba(76, 175, 80, 0.3);
            border: 2px solid #4CAF50;
        }
        .status.error {
            background: rgba(244, 67, 54, 0.3);
            border: 2px solid #f44336;
        }
        .status.info {
            background: rgba(33, 150, 243, 0.3);
            border: 2px solid #2196F3;
        }
        .status.warning {
            background: rgba(255, 193, 7, 0.3);
            border: 2px solid #FFC107;
            color: #000;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏁 Apple-to-Apple KNN Benchmark</h1>
        
        <div class="benchmark-specs">
            <h3>📊 Benchmark Specifications</h3>
            <div class="spec-grid">
                <div class="spec-item">
                    <div class="spec-value">512</div>
                    <div class="spec-label">Vector Dimensions</div>
                </div>
                <div class="spec-item">
                    <div class="spec-value">4,096</div>
                    <div class="spec-label">Total Vectors</div>
                </div>
                <div class="spec-item">
                    <div class="spec-value">8</div>
                    <div class="spec-label">Top K Results</div>
                </div>
                <div class="spec-item">
                    <div class="spec-value">Cosine</div>
                    <div class="spec-label">Distance Metric</div>
                </div>
                <div class="spec-item">
                    <div class="spec-value">5</div>
                    <div class="spec-label">Test Iterations</div>
                </div>
                <div class="spec-item">
                    <div class="spec-value">Normalized</div>
                    <div class="spec-label">Vector Format</div>
                </div>
            </div>
        </div>

        <div id="status" class="status info">
            Ready to run comprehensive KNN benchmark
        </div>

        <div class="test-section">
            <h3>🚀 Test Control</h3>
            <button onclick="runFullBenchmark()" class="info">🏁 Run Full Apple-to-Apple Benchmark</button>
            <button onclick="generateTestData()" class="info">📊 Generate Test Dataset</button>
            <button onclick="clearResults()" class="danger">🗑️ Clear Results</button>
            
            <div class="progress-bar">
                <div id="progress" class="progress-fill"></div>
            </div>
            
            <div id="control-output" class="output"></div>
        </div>

        <div class="test-section">
            <h3>📈 Benchmark Results</h3>
            <div class="results-grid" id="results-grid">
                <!-- Results will be populated here -->
            </div>
        </div>

        <div class="test-section">
            <h3>📋 Detailed Logs</h3>
            <div id="detailed-logs" class="output"></div>
        </div>
    </div>

    <!-- Load KNN interfaces -->
    <script src="close-vector/closevector-interface.js"></script>
    <script src="hsnwlib/hnsw-interface.js"></script>
    <script src="close-vector/unified-knn-interface.js"></script>

    <script>
        // Benchmark configuration
        const BENCHMARK_CONFIG = {
            dimensions: 512,
            totalVectors: 4096,
            k: 8,
            iterations: 5,
            distanceMetric: 'cosine',
            warmupRuns: 2
        };

        // Global state
        let testDataset = null;
        let queryVectors = null;
        let benchmarkResults = {};
        let instances = {};

        // Generate identical test dataset for all implementations
        function generateStandardizedTestData() {
            log('control-output', 'Generating standardized test dataset...');
            
            const vectors = [];
            const categories = ['documents', 'images', 'audio', 'embeddings', 'features', 'text', 'vision', 'speech'];
            
            // Use fixed seed for reproducible results
            let seed = 12345;
            function seededRandom() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }
            
            for (let i = 0; i < BENCHMARK_CONFIG.totalVectors; i++) {
                const cluster = Math.floor(i / 512); // 8 clusters of 512 vectors each
                const vector = [];
                
                // Generate deterministic vectors with clustering patterns
                for (let j = 0; j < BENCHMARK_CONFIG.dimensions; j++) {
                    const clusterBias = Math.sin(cluster * 0.5 + j * 0.01) * 0.4;
                    const noise = (seededRandom() - 0.5) * 0.3;
                    vector.push(clusterBias + noise);
                }
                
                // Normalize to unit length for cosine similarity
                const norm = Math.sqrt(vector.reduce((sum, val) => sum + val * val, 0));
                const normalizedVector = vector.map(val => val / (norm + 1e-8));
                
                vectors.push({
                    id: `vector_${i.toString().padStart(4, '0')}`,
                    vector: normalizedVector,
                    metadata: {
                        category: categories[i % categories.length],
                        cluster: cluster,
                        index: i,
                        timestamp: Date.now() - (i * 1000) // Spread timestamps
                    }
                });
            }
            
            // Generate query vectors from the same distribution but different values
            const queries = [];
            for (let i = 0; i < 10; i++) {
                const cluster = i % 8; // One query per cluster
                const vector = [];
                
                for (let j = 0; j < BENCHMARK_CONFIG.dimensions; j++) {
                    const clusterBias = Math.sin(cluster * 0.5 + j * 0.01) * 0.4;
                    const noise = (seededRandom() - 0.5) * 0.2; // Less noise for queries
                    vector.push(clusterBias + noise);
                }
                
                // Normalize
                const norm = Math.sqrt(vector.reduce((sum, val) => sum + val * val, 0));
                const normalizedVector = vector.map(val => val / (norm + 1e-8));
                
                queries.push({
                    id: `query_${i}`,
                    vector: normalizedVector,
                    expectedCluster: cluster
                });
            }
            
            testDataset = vectors;
            queryVectors = queries;
            
            log('control-output', `Generated ${vectors.length} vectors and ${queries.length} queries`);
            log('control-output', `Vector dimensions: ${BENCHMARK_CONFIG.dimensions}`);
            log('control-output', `Distance metric: ${BENCHMARK_CONFIG.distanceMetric}`);
            
            return { vectors, queries };
        }

        // Initialize all KNN implementations with identical configurations
        async function initializeImplementations() {
            log('control-output', 'Initializing KNN implementations...');
            
            try {
                // CloseVector
                instances.closevector = new CloseVectorInterface();
                const cvResult = await instances.closevector.initialize(
                    BENCHMARK_CONFIG.dimensions, 
                    BENCHMARK_CONFIG.distanceMetric
                );
                log('control-output', `CloseVector: ${cvResult.success ? 'SUCCESS' : 'FAILED'}`);
                
                // HNSW
                instances.hnsw = new HNSWInterface();
                const hnswResult = await instances.hnsw.initialize(
                    BENCHMARK_CONFIG.dimensions,
                    10000,
                    BENCHMARK_CONFIG.distanceMetric,
                    { M: 16, efConstruction: 200 }
                );
                log('control-output', `HNSW: ${hnswResult.success ? 'SUCCESS' : 'FAILED'}`);
                
                // Unified KNN (for comparison)
                instances.unified = new UnifiedKNNInterface();
                const unifiedResult = await instances.unified.initialize({
                    implementation: 'auto',
                    dimensions: BENCHMARK_CONFIG.dimensions,
                    maxElements: 10000,
                    distanceMetric: BENCHMARK_CONFIG.distanceMetric
                });
                log('control-output', `Unified: ${unifiedResult.success ? 'SUCCESS' : 'FAILED'}`);
                
                return true;
            } catch (error) {
                log('control-output', `Initialization error: ${error.message}`);
                return false;
            }
        }

        // Add vectors to all implementations
        async function addVectorsToAll() {
            log('control-output', 'Adding test vectors to all implementations...');
            
            const addResults = {};
            
            for (const [name, instance] of Object.entries(instances)) {
                const startTime = performance.now();
                
                try {
                    const result = await instance.addVectors(testDataset);
                    const addTime = performance.now() - startTime;
                    
                    addResults[name] = {
                        success: result.success,
                        added: result.added,
                        failed: result.failed,
                        timeMs: addTime
                    };
                    
                    log('control-output', `${name}: Added ${result.added}/${testDataset.length} vectors in ${addTime.toFixed(2)}ms`);
                } catch (error) {
                    addResults[name] = {
                        success: false,
                        error: error.message,
                        timeMs: performance.now() - startTime
                    };
                    log('control-output', `${name}: ERROR - ${error.message}`);
                }
                
                updateProgress(Object.keys(addResults).length / Object.keys(instances).length * 30);
            }
            
            return addResults;
        }

        // Run search benchmark on all implementations
        async function runSearchBenchmark() {
            log('control-output', 'Running search benchmark...');
            
            const searchResults = {};
            
            for (const [name, instance] of Object.entries(instances)) {
                log('control-output', `\nBenchmarking ${name}...`);
                
                const results = {
                    searchTimes: [],
                    accuracyScores: [],
                    totalTime: 0,
                    errors: 0
                };
                
                // Warmup runs
                for (let w = 0; w < BENCHMARK_CONFIG.warmupRuns; w++) {
                    try {
                        await instance.knnSearch(queryVectors[0].vector, BENCHMARK_CONFIG.k);
                    } catch (e) {
                        // Ignore warmup errors
                    }
                }
                
                // Actual benchmark runs
                for (let iteration = 0; iteration < BENCHMARK_CONFIG.iterations; iteration++) {
                    const iterationResults = [];
                    
                    for (let qIdx = 0; qIdx < queryVectors.length; qIdx++) {
                        const query = queryVectors[qIdx];
                        const startTime = performance.now();
                        
                        try {
                            const searchOptions = name === 'unified' ? 
                                { compareImplementations: false } : 
                                { includeMetadata: true };
                            
                            const result = await instance.knnSearch(query.vector, BENCHMARK_CONFIG.k, searchOptions);
                            const searchTime = performance.now() - startTime;
                            
                            if (result.success) {
                                // Calculate accuracy based on cluster matching
                                const resultData = name === 'unified' ? 
                                    result.implementations[result.active_implementation]?.results || [] :
                                    result.results || [];
                                
                                let correctResults = 0;
                                resultData.forEach(res => {
                                    if (res.metadata && res.metadata.cluster === query.expectedCluster) {
                                        correctResults++;
                                    }
                                });
                                
                                const accuracy = correctResults / BENCHMARK_CONFIG.k;
                                
                                iterationResults.push({
                                    searchTime,
                                    accuracy,
                                    resultsReturned: resultData.length
                                });
                            } else {
                                results.errors++;
                                iterationResults.push({
                                    searchTime: performance.now() - startTime,
                                    accuracy: 0,
                                    resultsReturned: 0
                                });
                            }
                        } catch (error) {
                            results.errors++;
                            iterationResults.push({
                                searchTime: performance.now() - startTime,
                                accuracy: 0,
                                resultsReturned: 0,
                                error: error.message
                            });
                        }
                    }
                    
                    // Aggregate iteration results
                    const avgSearchTime = iterationResults.reduce((sum, r) => sum + r.searchTime, 0) / iterationResults.length;
                    const avgAccuracy = iterationResults.reduce((sum, r) => sum + r.accuracy, 0) / iterationResults.length;
                    
                    results.searchTimes.push(avgSearchTime);
                    results.accuracyScores.push(avgAccuracy);
                    
                    log('control-output', `  Iteration ${iteration + 1}: ${avgSearchTime.toFixed(2)}ms avg, ${(avgAccuracy * 100).toFixed(1)}% accuracy`);
                }
                
                // Calculate final metrics
                results.avgSearchTime = results.searchTimes.reduce((a, b) => a + b, 0) / results.searchTimes.length;
                results.minSearchTime = Math.min(...results.searchTimes);
                results.maxSearchTime = Math.max(...results.searchTimes);
                results.avgAccuracy = results.accuracyScores.reduce((a, b) => a + b, 0) / results.accuracyScores.length;
                results.stdDevSearchTime = Math.sqrt(
                    results.searchTimes.reduce((sum, time) => sum + Math.pow(time - results.avgSearchTime, 2), 0) / results.searchTimes.length
                );
                
                searchResults[name] = results;
                
                log('control-output', `${name} final: ${results.avgSearchTime.toFixed(2)}ms ±${results.stdDevSearchTime.toFixed(2)}ms, ${(results.avgAccuracy * 100).toFixed(1)}% accuracy`);
                
                const progressPercent = 30 + (Object.keys(searchResults).length / Object.keys(instances).length * 60);
                updateProgress(progressPercent);
            }
            
            return searchResults;
        }

        // Run complete apple-to-apple benchmark
        async function runFullBenchmark() {
            try {
                updateStatus('Running comprehensive benchmark...', 'info');
                updateProgress(0);
                
                // Step 1: Generate test data
                if (!testDataset) {
                    generateStandardizedTestData();
                }
                updateProgress(10);
                
                // Step 2: Initialize implementations
                const initSuccess = await initializeImplementations();
                if (!initSuccess) {
                    updateStatus('Initialization failed', 'error');
                    return;
                }
                updateProgress(20);
                
                // Step 3: Add vectors
                const addResults = await addVectorsToAll();
                updateProgress(30);
                
                // Step 4: Run search benchmark
                const searchResults = await runSearchBenchmark();
                updateProgress(90);
                
                // Step 5: Compile and display results
                benchmarkResults = {
                    config: BENCHMARK_CONFIG,
                    addResults,
                    searchResults,
                    timestamp: new Date().toISOString()
                };
                
                displayResults();
                updateProgress(100);
                updateStatus('Benchmark completed successfully!', 'success');
                
                // Log summary
                log('detailed-logs', '\n=== BENCHMARK SUMMARY ===');
                Object.entries(searchResults).forEach(([name, results]) => {
                    log('detailed-logs', `${name.toUpperCase()}:`);
                    log('detailed-logs', `  Average Search Time: ${results.avgSearchTime.toFixed(3)}ms`);
                    log('detailed-logs', `  Standard Deviation: ±${results.stdDevSearchTime.toFixed(3)}ms`);
                    log('detailed-logs', `  Average Accuracy: ${(results.avgAccuracy * 100).toFixed(2)}%`);
                    log('detailed-logs', `  Errors: ${results.errors}`);
                    log('detailed-logs', '');
                });
                
            } catch (error) {
                log('control-output', `Benchmark error: ${error.message}`);
                updateStatus('Benchmark failed', 'error');
            }
        }

        // Display benchmark results
        function displayResults() {
            const resultsGrid = document.getElementById('results-grid');
            resultsGrid.innerHTML = '';
            
            if (!benchmarkResults.searchResults) return;
            
            Object.entries(benchmarkResults.searchResults).forEach(([name, results]) => {
                const card = document.createElement('div');
                card.className = 'result-card';
                
                card.innerHTML = `
                    <div class="result-title">${name.toUpperCase()} Results</div>
                    <div class="metric">
                        <span class="metric-label">Avg Search Time:</span>
                        <span class="metric-value">${results.avgSearchTime.toFixed(3)}ms</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Min Search Time:</span>
                        <span class="metric-value">${results.minSearchTime.toFixed(3)}ms</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Max Search Time:</span>
                        <span class="metric-value">${results.maxSearchTime.toFixed(3)}ms</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Std Deviation:</span>
                        <span class="metric-value">±${results.stdDevSearchTime.toFixed(3)}ms</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Average Accuracy:</span>
                        <span class="metric-value">${(results.avgAccuracy * 100).toFixed(2)}%</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Errors:</span>
                        <span class="metric-value">${results.errors}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Total Queries:</span>
                        <span class="metric-value">${BENCHMARK_CONFIG.iterations * queryVectors.length}</span>
                    </div>
                `;
                
                resultsGrid.appendChild(card);
            });
        }

        // Generate test data
        function generateTestData() {
            generateStandardizedTestData();
            updateStatus(`Generated ${BENCHMARK_CONFIG.totalVectors} vectors and ${queryVectors.length} queries`, 'success');
        }

        // Clear results
        function clearResults() {
            document.getElementById('results-grid').innerHTML = '';
            document.getElementById('control-output').textContent = '';
            document.getElementById('detailed-logs').textContent = '';
            benchmarkResults = {};
            updateProgress(0);
            updateStatus('Results cleared', 'info');
        }

        // Update status
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        // Update progress bar
        function updateProgress(percent) {
            const progressEl = document.getElementById('progress');
            progressEl.style.width = `${Math.min(100, Math.max(0, percent))}%`;
        }

        // Log output to specified element
        function log(elementId, message) {
            const outputEl = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            outputEl.textContent += `[${timestamp}] ${message}\n`;
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('Apple-to-Apple KNN Benchmark ready - Click "Run Full Benchmark" to begin', 'info');
        });
    </script>
</body>
</html>
