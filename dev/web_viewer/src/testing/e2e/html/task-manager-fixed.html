<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar AI Task Manager - E2E Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin: 20px 0; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        .working { background-color: #fff3cd; }
        #aiResults { max-height: 300px; overflow-y: auto; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Avatar AI Task Manager - E2E Test</h1>
    
    <div class="controls">
        <button id="runBasicAI">Run Basic AI Pipeline</button>
        <button id="runAdvancedAI">Run Advanced AI Pipeline</button>
        <button id="runFullWorkload">Run Full Workload Test</button>
        <button id="clearResults">Clear Results</button>
    </div>
    
    <div id="status">Ready...</div>
    <div id="aiResults"></div>
    
    <!-- Use absolute paths from web_viewer root -->
    <script src="../../../js/hnswlib-wasm.js"></script>
    <script src="../../../js/main.js"></script>
    <script>
        // Override worker paths to use correct base path from the reorganized structure
        const basePath = '../../../';
        
        // Override worker paths to use correct base path
        window.WORKER_BASE_PATH = basePath + 'js/workers/';
        
        console.log('✅ Scripts loaded successfully');
        
        // Initialize test handlers after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            initializeTestHandlers();
        });
        
        function initializeTestHandlers() {
            document.getElementById('runBasicAI').addEventListener('click', async () => {
                setStatus('Running basic AI pipeline...', 'working');
                try {
                    // Use the actual function from main.js
                    await window.runRealWorkloadTest();
                    
                    // Wait a bit for results to populate
                    setTimeout(() => {
                        if (window.avatarInferenceResults) {
                            displayResults('Basic AI Pipeline', window.avatarInferenceResults);
                            setStatus('✅ Basic AI pipeline completed', 'success');
                        }
                    }, 5000);
                } catch (error) {
                    console.error('Basic AI test failed:', error);
                    setStatus('❌ Basic AI pipeline failed: ' + error.message, 'error');
                }
            });
            
            document.getElementById('runAdvancedAI').addEventListener('click', async () => {
                setStatus('Running advanced AI pipeline...', 'working');
                try {
                    await window.runRealWorkloadTest();
                    
                    // Wait a bit for results to populate
                    setTimeout(() => {
                        if (window.avatarInferenceResults) {
                            displayResults('Advanced AI Pipeline', window.avatarInferenceResults);
                            setStatus('✅ Advanced AI pipeline completed', 'success');
                        }
                    }, 8000);
                } catch (error) {
                    console.error('Advanced AI test failed:', error);
                    setStatus('❌ Advanced AI pipeline failed: ' + error.message, 'error');
                }
            });
            
            document.getElementById('runFullWorkload').addEventListener('click', async () => {
                setStatus('Running full workload test...', 'working');
                try {
                    await window.runRealWorkloadTest();
                    
                    // Wait longer for full workload to complete
                    setTimeout(() => {
                        if (window.avatarInferenceResults) {
                            displayResults('Full Workload Test', window.avatarInferenceResults);
                            setStatus('✅ Full workload test completed', 'success');
                        }
                    }, 15000);
                } catch (error) {
                    console.error('Full workload test failed:', error);
                    setStatus('❌ Full workload test failed: ' + error.message, 'error');
                }
            });
            
            document.getElementById('clearResults').addEventListener('click', () => {
                document.getElementById('aiResults').innerHTML = '';
                setStatus('Results cleared', 'success');
            });
        }
        
        function setStatus(message, type = '') {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<div class="${type}">${message}</div>`;
        }
        
        function displayResults(testName, results) {
            const resultsEl = document.getElementById('aiResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result success';
            
            // Handle the actual result format from runRealWorkloadTest
            const totalResults = results.metadata ? results.metadata.totalResults : 0;
            const resultsList = results.results || [];
            
            resultDiv.innerHTML = `
                <h3>${testName} Results</h3>
                <p><strong>Total Results:</strong> ${totalResults}</p>
                <p><strong>Completed Models:</strong> ${results.metadata ? results.metadata.completedModels.join(', ') : 'None'}</p>
                <p><strong>Test Status:</strong> ${results.metadata ? results.metadata.testStatus : 'Unknown'}</p>
                <details>
                    <summary>Raw Results Data</summary>
                    <pre>${JSON.stringify(results, null, 2)}</pre>
                </details>
            `;
            resultsEl.appendChild(resultDiv);
            
            // Expose results globally for Playwright
            window.lastAIResults = results;
            window.dispatchEvent(new CustomEvent('aiResultsUpdated', { detail: results }));
        }
    </script>
</body>
</html>
