<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantized Model Optimization Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .model-test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; background: #f9f9f9; }
        .model-result { margin: 10px 0; padding: 10px; background: #e8f5e8; border-left: 4px solid #4CAF50; }
        .model-error { margin: 10px 0; padding: 10px; background: #ffeaea; border-left: 4px solid #f44336; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-card { padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #007bff; }
        .loading { color: #666; font-style: italic; }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #dc3545; font-weight: bold; }
        pre { background: #f1f1f1; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Quantized Model Optimization Test</h1>
        <p>Testing real quantized models: <strong>Silero VAD</strong>, <strong>Whisper</strong>, <strong>SpeechT5</strong>, and <strong>Kokoro TTS</strong></p>
        
        <div class="stats">
            <div class="stat-card">
                <h3>📊 Models Available</h3>
                <div id="modelCount">Loading...</div>
            </div>
            <div class="stat-card">
                <h3>⚡ Performance Gains</h3>
                <div id="performanceGains">Loading...</div>
            </div>
            <div class="stat-card">
                <h3>💾 Memory Savings</h3>
                <div id="memorySavings">Loading...</div>
            </div>
            <div class="stat-card">
                <h3>🎛️ Quantization Types</h3>
                <div id="quantizationTypes">Loading...</div>
            </div>
        </div>

        <button onclick="testAllModels()">🧪 Test All Quantized Models</button>
        <button onclick="runPerformanceComparison()">📈 Performance Comparison</button>
        <button onclick="testWorkerIntegration()">👥 Test Worker Integration</button>
        <button onclick="clearResults()">🧹 Clear Results</button>

        <div id="results"></div>
    </div>

    <script src="quantized-model-optimizer.js"></script>
    <script src="compute-backend-optimizer.js"></script>
    <script>
        let optimizer = null;
        let testResults = [];

        // Initialize on page load
        window.addEventListener('load', async () => {
            try {
                optimizer = new QuantizedModelOptimizer();
                await updateStats();
                console.log('🎉 Quantized Model Optimizer loaded successfully!');
            } catch (error) {
                console.error('❌ Failed to initialize optimizer:', error);
                document.getElementById('results').innerHTML = `
                    <div class="model-error">
                        <strong>Initialization Error:</strong> ${error.message}
                    </div>
                `;
            }
        });

        async function updateStats() {
            if (!optimizer) return;

            try {
                const models = optimizer.getAvailableModels();
                document.getElementById('modelCount').innerHTML = `
                    <strong>${models.length}</strong> models<br>
                    <small>${models.map(m => m.displayName).join(', ')}</small>
                `;

                // Calculate total quantizations and backends
                const totalQuantizations = models.reduce((sum, m) => sum + m.quantizations, 0);
                const totalBackends = models.reduce((sum, m) => sum + m.backends, 0);
                
                document.getElementById('performanceGains').innerHTML = `
                    Up to <strong>12x</strong> speedup<br>
                    <small>WebGPU + int4 quantization</small>
                `;

                document.getElementById('memorySavings').innerHTML = `
                    Up to <strong>75%</strong> reduction<br>
                    <small>int4/int8 quantization</small>
                `;

                document.getElementById('quantizationTypes').innerHTML = `
                    <strong>${totalQuantizations}</strong> total options<br>
                    <small>int4, int8, fp16, fp32</small>
                `;

            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }

        async function testAllModels() {
            if (!optimizer) {
                addResult('❌ Optimizer not initialized', 'error');
                return;
            }

            addResult('🚀 Starting comprehensive quantized model tests...', 'loading');
            
            const models = [
                { name: 'silero-vad', priority: 'performance', description: 'Silero VAD - Real-time voice detection' },
                { name: 'whisper-tiny-en', priority: 'memory', description: 'Whisper Tiny - Memory efficient ASR' },
                { name: 'whisper-base', priority: 'accuracy', description: 'Whisper Base - High accuracy ASR' },
                { name: 'speecht5-tts', priority: 'performance', description: 'SpeechT5 - Fast text-to-speech' },
                { name: 'kokoro-tts', priority: 'accuracy', description: 'Kokoro - High quality TTS' }
            ];

            testResults = [];

            for (const model of models) {
                try {
                    addResult(`🔧 Testing: ${model.description}`, 'loading');
                    
                    const startTime = performance.now();
                    
                    // Get optimal configuration
                    const config = await optimizer.selectOptimalModelConfiguration(model.name, {
                        prioritize: model.priority
                    });

                    if (config) {
                        const configTime = performance.now() - startTime;
                        
                        // Generate mock data and execute
                        const mockData = generateMockData(model.name);
                        const execStart = performance.now();
                        
                        const result = await optimizer.executeWithOptimizedModel(
                            model.name, 
                            mockData, 
                            { prioritize: model.priority }
                        );
                        
                        const execTime = performance.now() - execStart;
                        const totalTime = performance.now() - startTime;

                        testResults.push({
                            model: model.name,
                            description: model.description,
                            backend: result.optimization.backend,
                            quantization: result.optimization.quantization,
                            speedup: result.optimization.estimatedSpeedup,
                            memoryReduction: result.optimization.memoryReduction,
                            configTime: configTime.toFixed(1),
                            execTime: execTime.toFixed(1),
                            totalTime: totalTime.toFixed(1)
                        });

                        addResult(`
                            <div class="model-result">
                                <strong>✅ ${model.description}</strong><br>
                                Backend: <code>${result.optimization.backend}</code><br>
                                Quantization: <code>${result.optimization.quantization}</code><br>
                                Speedup: <strong>${result.optimization.estimatedSpeedup}x</strong><br>
                                Memory reduction: <strong>${result.optimization.memoryReduction}%</strong><br>
                                Execution time: ${execTime.toFixed(1)}ms<br>
                                <small>Configuration: ${configTime.toFixed(1)}ms | Total: ${totalTime.toFixed(1)}ms</small>
                            </div>
                        `, 'success');

                    } else {
                        addResult(`❌ Failed to configure ${model.description}`, 'error');
                    }

                } catch (error) {
                    addResult(`❌ Error testing ${model.description}: ${error.message}`, 'error');
                }
            }

            addResult(`🎉 All tests completed! Tested ${testResults.length} models successfully.`, 'success');
        }

        async function runPerformanceComparison() {
            if (testResults.length === 0) {
                addResult('⚠️ Run "Test All Models" first to generate performance data', 'loading');
                return;
            }

            const comparison = `
                <div class="model-result">
                    <h3>📊 Performance Comparison Results</h3>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 10px;">
                        <tr style="background: #f1f1f1;">
                            <th style="text-align: left; padding: 8px; border: 1px solid #ddd;">Model</th>
                            <th style="text-align: left; padding: 8px; border: 1px solid #ddd;">Backend</th>
                            <th style="text-align: left; padding: 8px; border: 1px solid #ddd;">Quantization</th>
                            <th style="text-align: right; padding: 8px; border: 1px solid #ddd;">Speedup</th>
                            <th style="text-align: right; padding: 8px; border: 1px solid #ddd;">Memory ↓</th>
                            <th style="text-align: right; padding: 8px; border: 1px solid #ddd;">Time (ms)</th>
                        </tr>
                        ${testResults.map(r => `
                            <tr>
                                <td style="padding: 8px; border: 1px solid #ddd; font-size: 12px;">${r.description.split(' - ')[0]}</td>
                                <td style="padding: 8px; border: 1px solid #ddd;"><code>${r.backend}</code></td>
                                <td style="padding: 8px; border: 1px solid #ddd;"><code>${r.quantization}</code></td>
                                <td style="padding: 8px; border: 1px solid #ddd; text-align: right; font-weight: bold; color: #28a745;">${r.speedup}x</td>
                                <td style="padding: 8px; border: 1px solid #ddd; text-align: right; font-weight: bold; color: #007bff;">${r.memoryReduction}%</td>
                                <td style="padding: 8px; border: 1px solid #ddd; text-align: right;">${r.execTime}</td>
                            </tr>
                        `).join('')}
                    </table>
                    <p style="margin-top: 15px; font-size: 14px;">
                        <strong>Key Insights:</strong><br>
                        • Best speedup: <strong>${Math.max(...testResults.map(r => r.speedup))}x</strong> (${testResults.find(r => r.speedup === Math.max(...testResults.map(r => r.speedup))).description.split(' - ')[0]})<br>
                        • Best memory reduction: <strong>${Math.max(...testResults.map(r => r.memoryReduction))}%</strong><br>
                        • Average execution time: <strong>${(testResults.reduce((sum, r) => sum + parseFloat(r.execTime), 0) / testResults.length).toFixed(1)}ms</strong>
                    </p>
                </div>
            `;

            addResult(comparison, 'success');
        }

        async function testWorkerIntegration() {
            addResult('👥 Testing Worker Integration...', 'loading');

            try {
                // Test if we can create a worker with the quantized optimizer
                const workerCode = `
                    importScripts('./quantized-model-optimizer.js');
                    importScripts('./compute-backend-optimizer.js');
                    
                    let optimizer = null;
                    
                    self.addEventListener('message', async function(e) {
                        if (e.data.type === 'init') {
                            try {
                                optimizer = new QuantizedModelOptimizer();
                                self.postMessage({ type: 'ready', success: true });
                            } catch (error) {
                                self.postMessage({ type: 'error', error: error.message });
                            }
                        } else if (e.data.type === 'test') {
                            try {
                                const config = await optimizer.selectOptimalModelConfiguration('silero-vad', {
                                    prioritize: 'performance'
                                });
                                self.postMessage({ type: 'result', config: config });
                            } catch (error) {
                                self.postMessage({ type: 'error', error: error.message });
                            }
                        }
                    });
                `;

                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));

                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('Worker timeout')), 10000);
                    
                    worker.onmessage = function(e) {
                        clearTimeout(timeout);
                        if (e.data.type === 'ready' && e.data.success) {
                            worker.postMessage({ type: 'test' });
                        } else if (e.data.type === 'result') {
                            addResult(`
                                <div class="model-result">
                                    <strong>✅ Worker Integration Test Passed!</strong><br>
                                    Worker successfully initialized quantized model optimizer<br>
                                    Test configuration: Backend <code>${e.data.config.backend}</code>, 
                                    Quantization <code>${e.data.config.quantization}</code><br>
                                    <small>This demonstrates CPU worker can use quantized models</small>
                                </div>
                            `, 'success');
                            worker.terminate();
                            resolve();
                        } else if (e.data.type === 'error') {
                            reject(new Error(e.data.error));
                        }
                    };

                    worker.onerror = function(error) {
                        clearTimeout(timeout);
                        reject(error);
                    };

                    worker.postMessage({ type: 'init' });
                });

            } catch (error) {
                addResult(`❌ Worker integration test failed: ${error.message}`, 'error');
            }
        }

        function generateMockData(modelName) {
            switch (modelName) {
                case 'silero-vad':
                    return { audioData: new Float32Array(16000), sampleRate: 16000 };
                case 'whisper-tiny-en':
                case 'whisper-base':
                    return { audioData: new Float32Array(32000), sampleRate: 16000, language: 'en' };
                case 'speecht5-tts':
                    return { text: "Test quantized speech synthesis", speaker: 'default' };
                case 'kokoro-tts':
                    return { text: "Test Kokoro TTS quantization", voice: 'default' };
                default:
                    return { data: 'mock' };
            }
        }

        function addResult(html, type = 'info') {
            const results = document.getElementById('results');
            const className = type === 'error' ? 'model-error' : 
                            type === 'success' ? 'model-result' : 
                            type === 'loading' ? 'loading' : '';
            
            const div = document.createElement('div');
            div.className = className;
            div.innerHTML = typeof html === 'string' ? html : html.outerHTML;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            testResults = [];
        }
    </script>
</body>
</html>
